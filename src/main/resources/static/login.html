<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hexatombe</title>
<style>
:root{--bg:#0b0a0a;--bg2:#131110;--line:#241f1d;--line2:#332b28;--fg:#e8e2dc;--fg3:#8d827c;
--gold:#c9a227;--blood:#7a1c1c;--blood2:#b32424}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:28px 24px}
h1{font:700 26px/1.1 ui-serif,Georgia,serif;letter-spacing:.14em;margin:0 0 4px;text-transform:uppercase}
h1 i{color:var(--blood2);font-style:normal}
p.sub{color:var(--fg3);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);margin:14px 0 5px}
input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:3px;
padding:10px 11px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:20px;background:var(--blood);color:#fff;border:1px solid var(--blood2);
border-radius:3px;padding:11px;font:600 13px/1 inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--blood2)}
button[disabled]{opacity:.55;cursor:default}
.msg{margin-top:14px;font-size:13px;color:var(--blood2);min-height:18px}
.hint{margin-top:18px;font-size:12px;color:var(--fg3);line-height:1.45}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>Hexa<i>tombe</i></h1>
  <p class="sub">Mesa de Ordem Paranormal</p>
  <label for="login">Login</label>
  <input id="login" name="login" autocapitalize="none" autocomplete="username" required>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
  <div class="msg" id="m"></div>
  <p class="hint">Se você é jogador, o mestre te passa o login. Entrando, você vê a aba Mesa com o que ele liberou.</p>
</form>
<script>
(function(){
  "use strict";
  function cookie(n){ var m=document.cookie.match(new RegExp("(^|; )"+n+"=([^;]*)")); return m?decodeURIComponent(m[2]):""; }
  fetch("/api/ping",{credentials:"same-origin"}).catch(function(){});
  var f=document.getElementById("f"), b=document.getElementById("b"), m=document.getElementById("m");
  f.onsubmit=function(e){
    e.preventDefault();
    m.textContent=""; b.disabled=true; b.textContent="Entrando…";
    var body=new URLSearchParams();
    body.set("login",document.getElementById("login").value);
    body.set("senha",document.getElementById("senha").value);
    var h={"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"};
    var t=cookie("XSRF-TOKEN"); if(t)h["X-XSRF-TOKEN"]=t;
    fetch("/api/login",{method:"POST",credentials:"same-origin",headers:h,body:body.toString()})
      .then(function(r){
        if(r.ok){ location.href="/"; return; }
        return r.json().catch(function(){return {};}).then(function(j){
          m.textContent=(j&&j.erro)||"login ou senha inválidos";
          b.disabled=false; b.textContent="Entrar";
          document.getElementById("senha").value="";
          document.getElementById("senha").focus(); });
      })
      .catch(function(){ m.textContent="servidor fora do ar"; b.disabled=false; b.textContent="Entrar"; });
  };
  document.getElementById("login").focus();
})();
</script>
</body>
</html>
