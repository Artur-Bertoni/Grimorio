<script>
/* veste o ultimo tema usado neste aparelho (o app grava em grim_pele); sem nada gravado, fica o padrao */
try{ var p=JSON.parse(localStorage.getItem("grim_pele")||"null");
  if(p&&p.v){ var r=document.documentElement; for(var k in p.v)r.style.setProperty("--"+k,p.v[k]);
    r.setAttribute("data-estilo",p.estilo||""); r.style.setProperty("color-scheme",p.esquema||"dark"); }
  if(localStorage.getItem("grim_fx")==="0")document.documentElement.setAttribute("data-fx","off");
}catch(e){}
</script>
<style>
:root{--bg:#0a0708;--bg2:#130d0f;--line:#322328;--line2:#48313a;--fg:#ece4d9;--fg3:#7d6e6b;
--gold:#c9a227;--blood:#b3122a;--blood2:#e23048;--blood-dim:#5e0f1c;
--disp:"Cinzel",Georgia,serif;--body:"Spectral",Georgia,serif;--ui:"Barlow Condensed","Arial Narrow",sans-serif;
--rc:.3125rem;color-scheme:dark}
html[data-estilo="fantasia"]{--rc:.625rem}
html[data-estilo="misterio"]{--rc:1.25rem}
html[data-estilo="investigacao"]{--rc:.25rem}
html[data-estilo="ficcao"]{--rc:1.125rem .25rem 1.125rem .25rem}
*{box-sizing:border-box}
html{font-size:clamp(16px,calc(11px + .36vw),24px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:1rem/1.5 var(--body);
display:flex;align-items:center;justify-content:center;padding:1.5rem}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(70% 55% at 50% 0%,color-mix(in srgb,var(--blood) 26%,transparent),transparent 70%),
  radial-gradient(60% 45% at 50% 110%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 70%)}
.card{position:relative;width:100%;max-width:23.5rem;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rc);
padding:2.25rem 1.75rem 1.75rem;box-shadow:0 1.5rem 4rem -1.5rem rgba(0,0,0,.6);
background-image:linear-gradient(90deg,transparent,var(--blood) 18%,var(--gold) 50%,var(--blood) 82%,transparent);
background-size:100% 3px;background-repeat:no-repeat;animation:chega .6s cubic-bezier(.2,.7,.2,1) backwards}
.selo{display:block;width:3.5rem;height:3.5rem;filter:drop-shadow(0 .375rem .75rem rgba(0,0,0,.5));margin:0 auto 1rem;animation:chega .7s cubic-bezier(.2,.7,.2,1) .1s backwards}
@keyframes chega{from{opacity:0;transform:translateY(1rem) scale(.98)}}
h1,p.sub{text-align:center}
h1{font:800 1.9rem/1.1 var(--disp);letter-spacing:.14em;margin:0 0 .25rem;text-transform:uppercase;
text-shadow:0 0 1.75rem color-mix(in srgb,var(--blood2) 45%,transparent)}
p.sub,label,button{font-family:var(--ui)}
input,button{transition:border-color .18s,box-shadow .22s,background-color .18s,transform .12s}
input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
button:hover{box-shadow:0 .375rem 1.25rem -.375rem var(--blood2)}
button:active{transform:scale(.97)}
html[data-fx="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1 i{color:var(--blood2);font-style:normal}
p.sub{color:var(--fg3);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1.375rem}
label{display:block;font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);margin:.875rem 0 .3125rem}
input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:.1875rem;
padding:.625rem .6875rem;font-size:.9375rem;font-family:inherit}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;margin-top:1.25rem;background:var(--blood);color:#fff;border:1px solid var(--blood2);
border-radius:.1875rem;padding:.6875rem;font:600 .8125rem/1 inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--blood2)}
button[disabled]{opacity:.55;cursor:default}
.msg{margin-top:.875rem;font-size:.8125rem;color:var(--blood2);min-height:1.125rem}
.hint{margin-top:1.125rem;font-size:.75rem;color:var(--fg3);line-height:1.45}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <svg class="selo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="23.1" rx="7.5" ry=".9" fill="var(--bg)" fill-opacity=".55"/><polygon points="12,1.5 7,8.5 17,8.5" fill="var(--blood)"/><polygon points="12,1.5 7,8.5 17,8.5" fill="var(--fg)" fill-opacity="0.28"/><polygon points="12,1.5 2.9,6.75 7,8.5" fill="var(--blood)"/><polygon points="12,1.5 2.9,6.75 7,8.5" fill="var(--fg)" fill-opacity="0.15"/><polygon points="12,1.5 21.1,6.75 17,8.5" fill="var(--blood)"/><polygon points="12,1.5 21.1,6.75 17,8.5" fill="var(--fg)" fill-opacity="0.06"/><polygon points="2.9,6.75 2.9,17.25 7,8.5" fill="var(--blood)"/><polygon points="2.9,6.75 2.9,17.25 7,8.5" fill="var(--bg)" fill-opacity="0.08"/><polygon points="21.1,6.75 21.1,17.25 17,8.5" fill="var(--blood)"/><polygon points="21.1,6.75 21.1,17.25 17,8.5" fill="var(--bg)" fill-opacity="0.32"/><polygon points="2.9,17.25 7,8.5 12,17.2" fill="var(--blood)"/><polygon points="2.9,17.25 7,8.5 12,17.2" fill="var(--bg)" fill-opacity="0.17"/><polygon points="21.1,17.25 17,8.5 12,17.2" fill="var(--blood)"/><polygon points="21.1,17.25 17,8.5 12,17.2" fill="var(--bg)" fill-opacity="0.38"/><polygon points="2.9,17.25 12,22.5 12,17.2" fill="var(--blood)"/><polygon points="2.9,17.25 12,22.5 12,17.2" fill="var(--bg)" fill-opacity="0.34"/><polygon points="21.1,17.25 12,22.5 12,17.2" fill="var(--blood)"/><polygon points="21.1,17.25 12,22.5 12,17.2" fill="var(--bg)" fill-opacity="0.51"/><polygon points="7,8.5 17,8.5 12,17.2" fill="var(--blood)"/><polygon points="7,8.5 17,8.5 12,17.2" fill="var(--fg)" fill-opacity="0.31"/><g fill="none" stroke="var(--gold)" stroke-width=".45" stroke-linejoin="round" stroke-linecap="round" stroke-opacity=".9"><polygon points="12,1.5 21.1,6.75 21.1,17.25 12,22.5 2.9,17.25 2.9,6.75"/><polygon points="7,8.5 17,8.5 12,17.2"/><path d="M12 1.5 7 8.5M12 1.5 17 8.5M2.9 6.75 7 8.5M21.1 6.75 17 8.5M2.9 17.25 7 8.5M2.9 17.25 12 17.2M21.1 17.25 17 8.5M21.1 17.25 12 17.2M12 22.5V17.2"/></g><text x="12" y="13.05" text-anchor="middle" font-size="4.4" font-weight="800" font-family="Cinzel, Georgia, serif" fill="var(--bg)" fill-opacity=".82">20</text><path d="M8.4 4.1 11.1 2.5" stroke="var(--fg)" stroke-opacity=".75" stroke-width=".6" stroke-linecap="round"/></svg>
  <h1>Grim<i>ório</i></h1>
  <p class="sub">Mesa de RPG</p>
  <label for="login">Login</label>
  <input id="login" name="login" autocapitalize="none" autocomplete="username" required>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required>
  <div id="campoNome" hidden>
    <label for="nome">Seu nome na mesa</label>
    <input id="nome" name="nome" autocomplete="name">
  </div>
  <button id="b" type="submit">Entrar</button>
  <div class="msg" id="m"></div>
  <p class="hint" id="hint"></p>
  <p class="hint"><a href="#" id="alt" style="color:var(--gold)">Criar uma conta</a></p>
</form>
<script>
(function(){
  "use strict";
  function cookie(n){ var m=document.cookie.match(new RegExp("(^|; )"+n+"=([^;]*)")); return m?decodeURIComponent(m[2]):""; }
  fetch("/api/ping",{credentials:"same-origin"}).catch(function(){});
  var f=document.getElementById("f"), b=document.getElementById("b"), m=document.getElementById("m");
  var alt=document.getElementById("alt"), hint=document.getElementById("hint");
  var campoNome=document.getElementById("campoNome");
  var convite="";
  try{ convite=new URLSearchParams(location.search).get("convite")||""; }catch(e){}
  var modo="entrar", registroAberto=false;

  function pinta(){
    var criar=(modo==="criar");
    b.textContent=criar?"Criar conta":"Entrar";
    campoNome.hidden=!criar;
    document.getElementById("nome").required=criar;
    document.getElementById("senha").setAttribute("autocomplete",criar?"new-password":"current-password");
    alt.textContent=criar?"Já tenho conta":"Criar uma conta";
    alt.hidden=!(registroAberto||convite||criar);
    hint.textContent=convite
      ? "Você chegou por um convite. Entre ou crie a conta e já cai na campanha."
      : (criar ? "Escolha um login curto, sem espaço. A senha precisa de 6 caracteres ou mais."
               : "Se você é jogador, quem mestra te passa o acesso.");
    m.textContent="";
  }
  alt.onclick=function(e){ e.preventDefault(); modo=(modo==="criar")?"entrar":"criar"; pinta(); };

  fetch("/api/ping",{credentials:"same-origin"})
    .then(function(r){ return r.json(); })
    .then(function(j){ registroAberto=!!(j&&j.registroAberto); pinta(); })
    .catch(function(){ pinta(); });

  function destino(){ return convite ? ("/?convite="+encodeURIComponent(convite)) : "/"; }

  f.onsubmit=function(e){
    e.preventDefault();
    m.textContent=""; b.disabled=true;
    var login=document.getElementById("login").value;
    var senha=document.getElementById("senha").value;
    var h={"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"};
    var t=cookie("XSRF-TOKEN"); if(t)h["X-XSRF-TOKEN"]=t;

    if(modo==="criar"){
      b.textContent="Criando…";
      var hj={"Content-Type":"application/json;charset=UTF-8"};
      if(t)hj["X-XSRF-TOKEN"]=t;
      fetch("/api/registrar",{method:"POST",credentials:"same-origin",headers:hj,
        body:JSON.stringify({login:login,senha:senha,
          nome:document.getElementById("nome").value,convite:convite})})
        .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
          if(!r.ok){ m.textContent=(j&&j.erro)||"não consegui criar a conta";
            b.disabled=false; pinta(); return; }
          modo="entrar"; entrar(login,senha,h); }); })
        .catch(function(){ m.textContent="servidor fora do ar"; b.disabled=false; pinta(); });
      return;
    }
    b.textContent="Entrando…";
    entrar(login,senha,h);
  };

  function entrar(login,senha,h){
    var body=new URLSearchParams();
    body.set("login",login); body.set("senha",senha);
    fetch("/api/login",{method:"POST",credentials:"same-origin",headers:h,body:body.toString()})
      .then(function(r){
        if(r.ok){ location.href=destino(); return; }
        return r.json().catch(function(){return {};}).then(function(j){
          m.textContent=(j&&j.erro)||"login ou senha inválidos";
          b.disabled=false; pinta();
          document.getElementById("senha").value="";
          document.getElementById("senha").focus(); });
      })
      .catch(function(){ m.textContent="servidor fora do ar"; b.disabled=false; pinta(); });
  }
  pinta();
  document.getElementById("login").focus();
})();
</script>
</body>
</html>
