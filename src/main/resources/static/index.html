<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Grimório</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0708'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%23b3122a' stroke-width='2.5'/%3E%3Cpath d='M12 12l8 8M20 12l-8 8' stroke='%23c9a227' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fontes.css">
<style>
/* Layout: barra fixa de ritual no topo, trilho lateral de contexto, canvas de territorios ao centro */
:root{
  --bg:#0a0708; --bg2:#130d0f; --bg3:#1c1416; --bg4:#241a1d;
  --line:#322328; --line2:#48313a;
  --fg:#ece4d9; --fg2:#b7a9a2; --fg3:#7d6e6b;
  --blood:#b3122a; --blood2:#e23048; --blood-dim:#5e0f1c;
  --gold:#c9a227; --gold2:#e8c45a; --sobre-gold:#140e02;
  --ok:#7ba36f; --warn:#d08a2c;
  --t-abertura:#8e7cc3; --t-despertares:#c2458a; --t-saopaulo:#c9a227; --t-galpao:#c0392b; --t-gancho:#4a8fa8;
  --disp:"Cinzel", Georgia, serif;
  --body:"Spectral", Georgia, "Times New Roman", serif;
  --ui:"Barlow Condensed", "Arial Narrow", sans-serif;
  --r:4px; --maxw:100%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); margin:0;
  font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#070506}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}

.ui{font-family:var(--ui);letter-spacing:.06em;text-transform:uppercase}
.disp{font-family:var(--disp);letter-spacing:.04em}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prose{max-width:92ch}

/* ---------- TOPO ---------- */
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:linear-gradient(var(--bg2),var(--bg) 70%,transparent);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.topin{display:flex;align-items:center;gap:14px;max-width:var(--maxw);margin:0 auto;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.sigil{width:26px;height:29px;flex:0 0 auto}
.brand b{font-family:var(--disp);font-weight:800;font-size:1.02rem;letter-spacing:.14em;line-height:1}
.brand span{display:block;font-family:var(--ui);font-size:.63rem;letter-spacing:.22em;color:var(--fg3);margin-top:2px}
nav.tabs{display:flex;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--ui);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);
  padding:7px 12px;border:1px solid transparent;border-radius:var(--r);white-space:nowrap}
.tab:hover{color:var(--fg2);background:var(--bg2)}
.tab[aria-current="true"]{color:var(--fg);background:var(--bg3);border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--blood)}
.acts{display:flex;gap:6px;flex:0 0 auto}
.ibtn{font-family:var(--ui);font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2);
  border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;display:flex;align-items:center;gap:6px;background:var(--bg2)}
.ibtn:hover{border-color:var(--line2);color:var(--fg);background:var(--bg3)}
.ibtn.on{border-color:var(--gold);color:var(--gold)}
.ibtn.live{border-color:var(--blood);color:var(--blood2)}
.ibtn svg{width:14px;height:14px;flex:0 0 auto}
.kbd{font-family:var(--ui);font-size:.66rem;border:1px solid var(--line2);border-radius:3px;padding:1px 4px;color:var(--fg3)}

/* widget de trilha tocando */
.nowbar{display:flex;align-items:center;gap:7px;flex:0 0 auto;max-width:330px;
  border:1px solid var(--blood-dim,#5a1620);border-radius:999px;background:rgba(179,18,42,.10);padding:3px 4px 3px 11px}
.nowbar[hidden]{display:none}
.nowbar .nbdot{width:7px;height:7px;border-radius:50%;background:var(--blood2);flex:0 0 auto;animation:nbp 1.6s ease-in-out infinite}
@keyframes nbp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.nowbar .nbdot{animation:none}}
.nowbar .nbname{font-family:var(--ui);font-size:.76rem;letter-spacing:.07em;color:var(--fg);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:180px;min-width:0;text-align:left}
.nowbar .nbname:hover{color:var(--gold)}
.nbb{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:0 0 auto;border:1px solid transparent}
.nbb:hover{color:var(--fg);background:var(--bg3);border-color:var(--line2)}
.nbb svg{width:12px;height:12px}
.nbb.off{color:var(--fg3);opacity:.5}
.nbb.off:hover{opacity:1}
@media (max-width:1100px){.nowbar .nbname{max-width:110px}}
@media (max-width:760px){.nowbar .nbname{display:none}}

main{max-width:var(--maxw);margin:0 auto;padding-block:22px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- TIPOGRAFIA ---------- */
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
h1.page{font-family:var(--disp);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);letter-spacing:.06em;line-height:1.05}
.eyebrow{font-family:var(--ui);font-size:.74rem;letter-spacing:.26em;color:var(--blood2);text-transform:uppercase}
h2.sec{font-family:var(--disp);font-size:1.18rem;letter-spacing:.09em;text-transform:uppercase;
  display:flex;align-items:center;gap:12px;color:var(--fg)}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.lead{color:var(--fg2);max-width:68ch}
.muted{color:var(--fg3)}
.sm{font-size:.9rem}

/* ---------- CARTOES ---------- */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;gap:14px}
.sec-wrap{display:flex;flex-direction:column;gap:14px;margin-top:34px}

/* PCs */
.pcs{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.pc{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pc .por{position:relative;aspect-ratio:1/1;background:#000;overflow:hidden}
.pc .por img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:opacity .35s}
.pc .por img.mk{position:absolute;inset:0;opacity:0}
.pc:hover .por img.mk{opacity:1}
.pc:hover .por img:not(.mk){opacity:0}
.pc .por:not(:has(img.mk)) img{opacity:1!important}
.pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc b{font-family:var(--disp);font-size:.98rem;letter-spacing:.03em}
.pc .alc{font-family:var(--ui);font-size:.74rem;letter-spacing:.14em;color:var(--blood2);text-transform:uppercase}
.pc .termos{font-size:.82rem;color:var(--fg3);line-height:1.4}
.pc .row{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}

.chip{font-family:var(--ui);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:999px;padding:2px 9px;color:var(--fg2);white-space:nowrap}
.chip.b{border-color:var(--blood);color:var(--blood2)}
.chip.g{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.btn:hover{background:var(--bg4);color:var(--fg);cursor:pointer}

/* segredo */
.segredo{border-left:2px solid var(--blood);background:linear-gradient(90deg,rgba(179,18,42,.09),transparent 60%);
  padding:9px 12px;border-radius:0 var(--r) var(--r) 0}
.segredo .lb{font-family:var(--ui);font-size:.68rem;letter-spacing:.18em;color:var(--blood2);text-transform:uppercase;display:block;margin-bottom:3px}
.blur{filter:blur(5px);cursor:pointer;transition:filter .2s;user-select:none}
.blur:hover{filter:blur(3px)}
.blur.rev{filter:none;cursor:auto}

/* episodios */
.eps{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ep{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--bg2);padding:10px 13px;align-items:baseline}
.ep:hover{background:var(--bg3)}
.ep .n{font-family:var(--disp);font-weight:800;font-size:1.05rem;color:var(--blood);text-align:right}
.ep.done .n{color:var(--ok)}
.ep b{font-family:var(--disp);font-size:.97rem;letter-spacing:.04em}
.ep p{margin:2px 0 0;font-size:.88rem;color:var(--fg3)}

/* metodo */
.met{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.met .c{background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:12px 14px}
.met .c b{font-family:var(--disp);font-size:.95rem;display:block;margin-bottom:4px}
.met .c p{margin:0;font-size:.89rem;color:var(--fg2)}

/* indice AS */
.idx{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.idx .doc{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.idx .doc>b{font-family:var(--disp);font-size:.95rem;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.idx ul{list-style:none;margin:0;padding:0;font-size:.88rem}
.idx li{padding:1px 0}
.idx .g{color:var(--fg);font-weight:600}
.idx .s{padding-left:12px;color:var(--fg2)}
.idx .s2{padding-left:24px;color:var(--fg3);font-size:.85rem}
.pg{font-family:var(--ui);font-size:.72rem;color:var(--gold);letter-spacing:.06em;cursor:pointer;border-bottom:1px dotted var(--gold)}
.pg:hover{color:var(--gold2)}
</style>
<style>
/* ---------- SESSAO ---------- */
.sess{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);max-height:calc(100vh - 90px);overflow:auto;padding-right:2px}
.rbox{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.rbox>summary{font-family:var(--ui);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);
  padding:9px 12px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rbox>summary::-webkit-details-marker{display:none}
.rbox>summary::after{content:"+";color:var(--fg3);font-family:var(--ui)}
.rbox[open]>summary::after{content:"−"}
.rbox[open]>summary{border-bottom:1px solid var(--line);color:var(--fg)}
.rbody{padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:8px}
.rbody ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.rbody li{color:var(--fg2)}
.npcrow{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:4px;border-radius:var(--r)}
.npcrow:hover{background:var(--bg3)}
.npcrow img{width:38px;height:38px;border-radius:2px;object-fit:cover;object-position:top center;border:1px solid var(--line2);flex:0 0 auto}
.npcrow b{font-size:.9rem;display:block;font-family:var(--disp)}
.npcrow p{margin:1px 0 0;font-size:.8rem;color:var(--fg3);line-height:1.35}

.sesshead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.vmodes{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--bg2)}
.vmodes button{font-family:var(--ui);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:2px;color:var(--fg3)}
.vmodes button[aria-pressed="true"]{background:var(--bg4);color:var(--fg)}

/* progresso */
.prog{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:.74rem;letter-spacing:.1em;color:var(--fg3)}
.bar{width:90px;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood);transition:width .3s}

/* ---------- CANVAS ---------- */
.cvwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:
  radial-gradient(circle at 30% 10%,rgba(179,18,42,.07),transparent 55%),
  linear-gradient(var(--bg2),var(--bg));overflow:hidden;height:min(74vh,760px);touch-action:none}
.cvtools{position:absolute;right:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:5px}
.cvtools button{width:30px;height:30px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg3);
  color:var(--fg2);font-family:var(--ui);font-size:.9rem;display:grid;place-items:center}
.cvtools button:hover{color:var(--fg);background:var(--bg4)}
.cvhint{position:absolute;left:12px;bottom:10px;z-index:5;font-family:var(--ui);font-size:.68rem;letter-spacing:.1em;color:var(--fg3);pointer-events:none}
.cv{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.cvsvg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.terr{position:absolute;border:1.5px solid;border-radius:14px;padding:30px 12px 12px;background:rgba(10,7,8,.45)}
.terr>.tl{position:absolute;top:-11px;left:14px;font-family:var(--ui);font-size:.74rem;letter-spacing:.2em;
  text-transform:uppercase;padding:1px 9px;background:var(--bg);border:1px solid;border-radius:3px}
.card{position:relative;width:100%;margin-bottom:8px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);
  padding:8px 10px;cursor:pointer;transition:border-color .15s,transform .1s;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.card:hover{border-color:var(--fg3);transform:translateY(-1px)}
.card.done{opacity:.52}
.card.done .ct{text-decoration:line-through;text-decoration-color:var(--blood)}
.card .chd{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.card .cn{font-family:var(--ui);font-size:.68rem;letter-spacing:.12em;color:var(--fg3);text-transform:uppercase}
.card .ct{font-family:var(--disp);font-size:.84rem;line-height:1.25;letter-spacing:.02em}
.card .cfoot{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
.card .thumbs{display:flex;gap:3px;margin-top:7px}
.card .thumbs img{width:30px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
.ckbox{width:15px;height:15px;border:1px solid var(--line2);border-radius:2px;display:grid;place-items:center;flex:0 0 auto;background:var(--bg)}
.ckbox[aria-pressed="true"]{background:var(--blood);border-color:var(--blood)}
.ckbox svg{width:10px;height:10px;opacity:0}
.ckbox[aria-pressed="true"] svg{opacity:1}
.mini{font-family:var(--ui);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);
  border:1px solid var(--line);border-radius:999px;padding:0 6px}
.mini.f{border-color:var(--blood);color:var(--blood2)}

/* ---------- ROTEIRO ---------- */
.roteiro{display:flex;flex-direction:column;gap:12px}
.scn{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scn>summary{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;list-style:none}
.scn>summary::-webkit-details-marker{display:none}
.scn[open]>summary{border-bottom:1px solid var(--line);background:var(--bg3)}
.scn .sn{font-family:var(--ui);font-size:.7rem;letter-spacing:.12em;color:var(--fg3);text-transform:uppercase;flex:0 0 auto}
.scn .st{font-family:var(--disp);font-size:.98rem;letter-spacing:.02em;flex:1;min-width:0}
.scn.done>summary .st{opacity:.5;text-decoration:line-through;text-decoration-color:var(--blood)}
.sbody{padding:14px 15px 17px;display:flex;flex-direction:column;gap:14px}

.fld{display:flex;flex-direction:column;gap:6px}
.flb{font-family:var(--ui);font-size:.73rem;letter-spacing:.17em;text-transform:uppercase;color:var(--fg2);
  display:flex;align-items:center;gap:8px}
.flb::after{content:"";flex:1;height:1px;background:var(--line)}
.leitura{font-size:1.09rem;line-height:1.68;color:var(--fg);background:var(--bg3);border-left:2px solid var(--blood);
  padding:13px 16px;border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap;max-width:112ch}
.dlg,.segredo{max-width:112ch}
.quem{max-width:116ch}
ul.fl>li{max-width:112ch}
.leitura .hint{display:block;font-family:var(--ui);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:7px}
ul.fl{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px;color:var(--fg2)}
ul.fl ul{margin:5px 0 0;padding-left:17px;gap:4px;color:var(--fg3);font-size:.93rem}
ul.fl li::marker{color:var(--blood)}
ul.fl li.q{list-style:none}
.motiva{display:block;margin-top:3px;font-size:.9rem;color:var(--fg3)}
.motiva b{font-family:var(--ui);font-size:.68rem;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.quem{display:flex;gap:10px;align-items:flex-start}
.quem>img{width:52px;height:52px;object-fit:cover;object-position:top center;border:1px solid var(--line2);border-radius:2px;cursor:pointer;flex:0 0 auto}
.tag{font-family:var(--ui);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:0 6px;border-radius:2px;margin-right:6px}
.tag.forcado{background:var(--blood);color:#fff}
.tag.gancho{background:var(--gold);color:#1a1205}
.tag.pista{border:1px solid var(--line2);color:var(--fg2)}
.tag.item{border:1px solid var(--ok);color:var(--ok)}
.dlg{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.dlg b{font-family:var(--ui);font-size:.7rem;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:2px}
.dlg q{font-style:italic;color:var(--fg)}
.testes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:8px;align-items:start}
.teste{display:flex;gap:9px;align-items:flex-start;font-size:.93rem;color:var(--fg2);
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px}
.teste .per{font-family:var(--ui);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--line2);border-radius:999px;padding:1px 8px;flex:0 0 auto}
.faixas{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.faixa{font-family:var(--ui);font-size:.68rem;letter-spacing:.08em;border:1px dashed var(--line2);border-radius:3px;padding:1px 7px;color:var(--fg3)}
.trilharow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tplay{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:3px 11px 3px 8px;
  font-family:var(--ui);font-size:.74rem;letter-spacing:.06em;color:var(--fg2);background:var(--bg3)}
.tplay:hover{border-color:var(--gold);color:var(--fg)}
.tplay .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tplay .sit{color:var(--fg3);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
.tplay.nowplaying{border-color:var(--blood);color:var(--blood2);background:rgba(179,18,42,.1)}
.imgrow{display:flex;gap:7px;flex-wrap:wrap}
.imgrow img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line2);border-radius:2px;cursor:pointer}
.imgrow img:hover{border-color:var(--gold)}
</style>
<style>
/* ---------- MODAIS ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(5,3,4,.82);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;

.sheet{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);width:100%;max-width:860px;

/* busca */
.sfield{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);padding:9px 12px}

.fchip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.08)}
.res{display:flex;flex-direction:column;gap:2px}

.rsrc{font-family:var(--ui);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);

.rsub{font-family:var(--ui);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-top:1px;display:block}
.rsn{font-size:.87rem;color:var(--fg2);margin-top:4px;line-height:1.45}

/* player */
.plmain{display:grid;grid-template-columns:1fr;gap:12px}
.nowbox{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:9px}

.ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.seek{flex:1;min-width:120px;display:flex;align-items:center;gap:8px}

.tm{font-family:var(--ui);font-size:.74rem;color:var(--fg3);font-variant-numeric:tabular-nums}
.volrow{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:.72rem;letter-spacing:.1em;color:var(--fg3);text-transform:uppercase}

.catgrid{display:flex;flex-direction:column;gap:12px}

.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:4px}
.trk{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r);

.trk.on .eq i:nth-child(2){animation-delay:.15s}.trk.on .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

/* biblioteca local */
.libbox{border:1px dashed var(--line2);border-radius:var(--r);padding:16px;text-align:center;background:var(--bg3)}

/* pdf */
.pdfwrap{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1 1 auto;width:100%}
.pdfbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* projecao */
.proj{position:fixed;inset:0;z-index:95;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column}

.projbar{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:7px}
.projnav{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center}

/* edicao */
body.edit [data-ed]{outline:1px dashed rgba(201,162,39,.4);outline-offset:3px;border-radius:2px;min-height:1em}

.edonly{display:none!important}
body.edit .edonly{display:inline-flex!important}

.addbtn{font-family:var(--ui);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);
  border:1px dashed var(--ok);border-radius:var(--r);padding:3px 10px;align-self:flex-start}
.addbtn:hover{background:rgba(123,163,111,.12)}
.editbanner{background:rgba(201,162,39,.1);border-bottom:1px solid var(--gold);padding:6px 14px;
  font-family:var(--ui);font-size:.75rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);text-align:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:var(--bg4);
  border:1px solid var(--line2);border-radius:var(--r);padding:9px 16px;font-family:var(--ui);font-size:.78rem;

}

<script>
(function(){
"use strict";
var VAZIO={versao:2,campanha:null,sessoes:[],trilhaCategorias:[],galeria:[]};
var BASE=window.GRIMORIO_DADOS||null;
var D=BASE?JSON.parse(JSON.stringify(BASE)):JSON.parse(JSON.stringify(VAZIO));

var CID=null,CAMPANHAS=[],MIDIABASE="",ADMIN=false,PAPEL="JOGADOR",EU=null;

function PUBD(){ if(GM&&D&&D.campanha)return D.campanha; return MESA||{}; }
function cAPI(p){ return "/api/c/"+CID+p; }
/* Caminho de imagem do guia vira URL da mídia da campanha. */

  if(/^(https?:|data:|blob:|\/)/i.test(x))return x;
  return MIDIABASE+x.replace(/^\.?\//,""); }
function parametro(n){ try{ return new URLSearchParams(location.search).get(n)||""; }catch(e){ return ""; } }

var VOCAB_PADRAO={campanha:"Campanha",sessao:"Sessão",sessoes:"Sessões",cena:"Cena",cenas:"Cenas",
 territorio:"Território",territorios:"Territórios",evidencia:"Evidência",evidencias:"Evidências",
 npc:"NPC",npcs:"NPCs",local:"Local",locais:"Locais",mestre:"Mestre",jogador:"Jogador",
 jogadores:"Jogadores",trilha:"Trilha",mesa:"Mesa",quadro:"Quadro",roteiro:"Roteiro",
 metodo:"Método",referencia:"Consulta rápida",ficha:"Ficha",fichas:"Fichas"};
function V(k){ var v=PUBD().vocab||{}; return v[k]||VOCAB_PADRAO[k]||k; }

function el(t,a){var e=document.createElement(t);if(a)for(var k in a){
  if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];
  else if(k==="text")e.textContent=a[k];else if(k.slice(0,2)==="on")e[k]=a[k];
  else if(a[k]!=null&&a[k]!==false)e.setAttribute(k,a[k]);} return e;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

function fmt(s){if(!isFinite(s))return "0:00";var m=Math.floor(s/60),x=Math.floor(s%60);return m+":"+(x<10?"0":"")+x;}
function catColor(c){var f=(D.trilhaCategorias||[]).filter(function(x){return x.id===c;})[0];return f?f.cor:"#7d6e6b";}

  return f||{id:id,nome:"SEM TERRITÓRIO",cor:"#7d6e6b"};}
function uid(p){return (p||"x")+Date.now().toString(36)+Math.floor(Math.random()*999).toString(36);}

/* Nome dos livros por extenso em qualquer lugar da tela. A sigla continua
   sendo a chave interna (upload, indice, data-doc); so a exibicao muda. */
var NOMES_DOC={LB:"Livro Básico",SH:"Sobrevivendo ao Horror",
  AS01:"Arquivos Secretos 01",AS02:"Arquivos Secretos 02",AS03:"Arquivos Secretos 03",
  AS04:"Arquivos Secretos 04",AS05:"Arquivos Secretos 05",AS06:"Arquivos Secretos 06",
  AS07:"Arquivos Secretos 07"};
function nomeDoc(ab){ var a=String(ab==null?"":ab).toUpperCase().trim(); if(!a)return "";
  if(typeof LIB!=="undefined"&&LIB.docs&&LIB.docs[a]&&LIB.docs[a].nome)return LIB.docs[a].nome;
  var ds=(typeof IDX!=="undefined"&&IDX&&IDX.docs)||[];
  for(var i=0;i<ds.length;i++){
    if(String(ds[i].abrev||"").toUpperCase()===a||String(ds[i].id||"").toUpperCase()===a)
      return ds[i].nome||a; }
  return NOMES_DOC[a]||ab; }
function refDoc(ab,p){ var n=nomeDoc(ab); return p?(n+" p."+p):n; }
function refLivro(txt){ var m=String(txt==null?"":txt).match(/^\s*([A-Za-z]{1,4}\d{0,2})\s*[Pp]\.?\s*(\d+)/);
  return m?refDoc(m[1],m[2]):nomeDoc(txt); }

function cacheGM(j){ try{localStorage.setItem("grim_gm_"+CID,j);}catch(e){} }
function lerCache(){ try{ var c=localStorage.getItem("grim_gm_"+CID); if(!c)return false;
  var v=JSON.parse(c); if(v&&v.sessoes&&v.sessoes.length){ D=v; normalizaCampanha(); return true; } }catch(e){} return false; }
function cookie(n){ var m=document.cookie.match(new RegExp("(^|; )"+n+"=([^;]*)")); return m?decodeURIComponent(m[2]):""; }
function api(url,opt){
  opt=opt||{}; opt.credentials="same-origin"; opt.headers=opt.headers||{};
  if(opt.body&&typeof opt.body==="object"&&!(opt.body instanceof FormData)){
    opt.headers["Content-Type"]="application/json;charset=UTF-8";
    opt.body=JSON.stringify(opt.body); }
  var m=(opt.method||"GET").toUpperCase();
  if(m!=="GET"&&m!=="HEAD"){ var t=cookie("XSRF-TOKEN"); if(t)opt.headers["X-XSRF-TOKEN"]=t; }
  return fetch(url,opt).then(function(r){
    if(r.status===401){ location.href="login.html"; throw new Error("sessão expirada"); }
    if(r.status===204)return null;
    var ct=r.headers.get("content-type")||"";
    return (ct.indexOf("json")>=0?r.json():r.text()).then(function(b){
      if(!r.ok){ var e=new Error((b&&b.erro)||("HTTP "+r.status)); e.status=r.status; e.corpo=b; throw e; }
      return b; }); });
}
function save(){ if(!GM)return;
  if(!CID||!D.campanha){ toast("Não vou salvar: o guia não está carregado"); return; }
  var j=JSON.stringify(D); cacheGM(j);
  clearTimeout(saveT);
  saveT=setTimeout(function(){ gravaDoc("/guia",j,"guia"); },700); }
function gravaDoc(url,j,qual){
  function tenta(v,repetir){
    return api(cAPI(url),{method:"PUT",body:{json:j,versao:v}}).then(function(r){
      if(qual==="guia")VGUIA=r.versao; else VMESA=r.versao; })
     .catch(function(e){
       if(e.status===409&&e.corpo&&repetir){
         if(qual==="guia")VGUIA=e.corpo.versao; else VMESA=e.corpo.versao;
         return tenta(e.corpo.versao,false); }
       toast(qual==="guia"?"Não consegui salvar no servidor. A cópia local está guardada."
                          :"Não consegui publicar para a mesa"); });
  }
  return tenta(qual==="guia"?VGUIA:VMESA,true);
}
function salvarMesa(){ if(!GM)return;
  if(D&&D.campanha){ MESA.titulo=D.campanha.titulo||""; MESA.sistema=D.campanha.sistema||"";
    MESA.vocab=D.campanha.vocab||{}; MESA.referencia=D.campanha.referencia||[];
    MESA.sinonimos=D.campanha.sinonimos||{}; MESA.canonicas=D.campanha.canonicas||{}; }
  MESA.at=Date.now(); clearTimeout(mesaT);
  mesaT=setTimeout(function(){ gravaDoc("/mesa",JSON.stringify(MESA),"mesa"); },500); }
function aplicaMesa(m){ if(!m||!m.json)return; try{ var v=JSON.parse(m.json);
  if(v&&typeof v==="object"){ MESA={resumos:v.resumos||[],ev:v.ev||[],npcs:v.npcs||[],locais:v.locais||[],
    iaNome:v.iaNome||"",iaArt:v.iaArt||"ao",tema:v.tema||"",titulo:v.titulo||"",
    sistema:v.sistema||"",vocab:v.vocab||{},referencia:v.referencia||[],
    sinonimos:v.sinonimos||{},canonicas:v.canonicas||{},at:v.at||0}; } }catch(e){} }
function iaNome(){ return String(MESA.iaNome||"").trim()||"Claude"; }
function iaArt(){ var a=String(MESA.iaArt||"ao").trim(); return (a==="à"||a==="a")?a:"ao"; }
function iaPergunta(){ return "Perguntar "+iaArt()+" "+iaNome(); }
var mesaRT=null;
function refreshMesa(){ if(!PRONTO||S.view!=="mesa")return;
  clearTimeout(mesaRT);
  mesaRT=setTimeout(function(){ if(S.view!=="mesa")return;
    var b=$("#mbody"); if(!b)return;
    try{ b.innerHTML=mesaSec(); hydrateMesa(); }catch(e){} },300); }
function sondaMesa(){ clearInterval(sondaT);
  sondaT=setInterval(function(){ if(document.hidden||!CID)return;
    api(cAPI("/mesa/versao")).then(function(r){
      if(!r||r.versao===VMESA)return;
      return api(cAPI("/mesa")).then(function(m){ VMESA=m.versao; aplicaMesa(m);
        aplicarTema(temaAtivo()); pintarMarca(); refreshMesa(); });
    }).catch(function(){}); },6000); }

function boot(){
  try{ aplicarTema(temaAtivo()); }catch(e){}
  try{ $("#view").innerHTML='<p class="empty" style="padding:72px 0">Carregando…</p>'; }catch(e){}
  api("/api/sessao").then(function(s){
    EU=s; ADMIN=!!s.admin; IACFG=!!s.iaConfigurada; MYID=String(s.id||"");
    CAMPANHAS=s.campanhas||[];
    var cv=parametro("convite");
    if(!cv)return null;
    return api("/api/convites/"+encodeURIComponent(cv),{method:"POST"})
      .then(function(c){ limparUrl(); toast("Você entrou em "+c.nome);
        try{ localStorage.setItem("grim_cid",String(c.id)); }catch(e){}
        return api("/api/sessao").then(function(s2){ EU=s2; CAMPANHAS=s2.campanhas||[]; }); })
      .catch(function(e){ limparUrl(); toast((e&&e.message)||"convite inválido"); });
  }).then(function(){ escolherCampanha(); })
   .catch(function(e){ try{console.error("boot falhou:",e);}catch(_){}
     BOOTERR=(e&&(e.stack||e.message))||"sem sessão"; PRONTO=true; render(); });
}

function escolherCampanha(){
  if(!CAMPANHAS.length){ PRONTO=true; S.view="semcampanha"; render(); return; }
  var alvo=null;
  try{ var g=localStorage.getItem("grim_cid");
    if(g)alvo=CAMPANHAS.filter(function(c){return String(c.id)===String(g);})[0]||null; }catch(e){}
  if(!alvo&&CAMPANHAS.length===1)alvo=CAMPANHAS[0];
  if(!alvo){ PRONTO=true; S.view="escolher"; render(); return; }
  entrarNaCampanha(alvo.id);
}

function entrarNaCampanha(cid){
  var c=CAMPANHAS.filter(function(x){return String(x.id)===String(cid);})[0];
  if(!c){ toast("Campanha não encontrada"); return; }
  CID=c.id; PAPEL=c.papel; GM=(c.papel==="MESTRE"); MIDIABASE="/midia/c"+CID+"/";
  try{ localStorage.setItem("grim_cid",String(CID)); }catch(e){}
  PRONTO=false; BOOTERR=""; VGUIA=-1; VMESA=-1;
  D=JSON.parse(JSON.stringify(VAZIO));
  MESA={resumos:[],ev:[],npcs:[],locais:[],at:0};
  IDX=null; IDXp=null; CATp=null; PDFC={}; LIB={ok:false,faixas:{},docs:{}};
  try{ invalidaIndice(); }catch(e){}
  S.view=GM?"home":"mesa"; S.sessao=0; S.edit=false;
  try{ $("#view").innerHTML='<p class="empty" style="padding:72px 0">Carregando '+esc(c.nome)+'…</p>'; }catch(e){}

  var ps=[ api(cAPI("/mesa")).then(function(m){ VMESA=m.versao; aplicaMesa(m); }).catch(function(){}) ];
  if(GM) ps.push( api(cAPI("/guia")).then(function(g){ VGUIA=g.versao;
      try{ var v=JSON.parse(g.json||"{}");
        if(v&&v.campanha)D=v;
        else { D=JSON.parse(JSON.stringify(VAZIO)); D.campanha={titulo:c.nome,sistema:c.sistema||""}; }
      }catch(e){ BOOTERR="JSON inválido no guia: "+((e&&e.message)||e); } })
    .catch(function(e){ BOOTERR="não consegui ler o guia: "+((e&&e.message)||e); }) );

  Promise.all(ps).then(function(){
    if(GM&&!D.campanha)D.campanha={titulo:c.nome,sistema:c.sistema||""};
    normalizaCampanha();
    PRONTO=true; aplicarTema(temaAtivo()); pintarMarca();
    render(); sondaMesa(); if(GM)carregaCatalogo();
  });
}

    case "scn-terr":{ var op=s.territorios.map(function(t){return t.id+" · "+t.nome;});
      escolher("Mover a cena para",s.territorios.map(function(t){return {v:t.id,l:t.nome};}),function(v){
        c.territorio=v; done(); }); break; }
    case "blk-add":{ var sel=$("#nb-"+c.id); c.blocos.push(novoBloco(sel?sel.value:"lista")); done(); break; }
    case "blk-del": c.blocos.splice(bi,1); done(); break;
    case "blk-up": case "blk-dn":{ var n3=bi+(a==="blk-up"?-1:1);
      if(n3>=0&&n3<c.blocos.length){ c.blocos.splice(n3,0,c.blocos.splice(bi,1)[0]); done(); } break; }
    case "it-add": blk.itens=blk.itens||[]; blk.itens.push(novoItem(blk.tipo)); done(); break;
    case "it-del": blk.itens.splice(i,1); done(); break;

    case "sub-del": blk.itens[i].sub.splice(j,1); done(); break;

/* ---------- CANVAS ---------- */
var CV={z:.62,x:10,y:10,init:false};
function initCanvas(s){
  var wrap=$("#cvwrap"),cv=$("#cv"),svg=$("#cvsvg"); if(!wrap)return;
  function apply(){ var tr="translate("+CV.x+"px,"+CV.y+"px) scale("+CV.z+")";
    cv.style.transform=tr; svg.style.transform=tr; }
  function links(){ var ps=s.territorios.map(function(t,i){var p=tpos(s,i);return {x:p.x+122,y:p.y+40};}),d="";
    for(var i=0;i<ps.length-1;i++){ var A=ps[i],B=ps[i+1],mx=(A.x+B.x)/2;
      d+='<path d="M'+A.x+' '+A.y+' C '+mx+' '+A.y+', '+mx+' '+B.y+', '+B.x+' '+B.y+'" fill="none" stroke="#48313a" stroke-width="1.4" stroke-dasharray="5 6"/>'; }
    svg.innerHTML=d; }
  links(); apply();
  var drag=null, supClick=false, linha=null;
  function limparLinha(){ if(linha&&linha.parentNode)linha.parentNode.removeChild(linha); }
  function marcarAlvo(x,y){
    if(!linha){ linha=document.createElement("div"); linha.className="dropline"; }
    var sob=document.elementFromPoint(x,y);
    var terr=(sob&&sob.closest)?sob.closest(".terr"):null;
    if(!terr){ limparLinha(); drag.alvo=null; return; }
    var cards=Array.prototype.slice.call(terr.querySelectorAll(".card")).filter(function(n){return n!==drag.node;});
    var k=cards.length;
    for(var i=0;i<cards.length;i++){ var r=cards[i].getBoundingClientRect();
      if(y<r.top+r.height/2){ k=i; break; } }
    drag.alvo={terr:terr.getAttribute("data-terr"),k:k};
    if(k<cards.length)terr.insertBefore(linha,cards[k]);
    else { var ar=terr.querySelector(".addrow"); if(ar)terr.insertBefore(linha,ar); else terr.appendChild(linha); }
  }
  wrap.addEventListener("pointerdown",function(e){
    if(e.target.closest(".railfloat")||e.target.closest(".cvtools"))return;
    if(e.target.isContentEditable)return;
    if(e.target.closest("button")||e.target.closest("select")||e.target.closest("input"))return;
    var card=e.target.closest(".card");
    var t=e.target.closest(".terr");
    if(card&&S.edit){
      drag={m:"c",node:card,id:card.getAttribute("data-scn"),sx:e.clientX,sy:e.clientY,moved:false,alvo:null};
      return; }
    if(t&&!card){
      var id=t.getAttribute("data-terr"),k=s.territorios.map(function(x){return x.id;}).indexOf(id);
      if(k>=0){ var tp=tpos(s,k);
        drag={m:"t",k:k,sx:e.clientX,sy:e.clientY,ox:tp.x,oy:tp.y,node:t,moved:false};
        e.preventDefault();
        try{wrap.setPointerCapture(e.pointerId);}catch(err){}
        return; } }
    drag={m:"p",sx:e.clientX,sy:e.clientY,ox:CV.x,oy:CV.y,lim:!!card,moved:false};
    if(!card){ e.preventDefault(); try{wrap.setPointerCapture(e.pointerId);}catch(err){} }
  });
  wrap.addEventListener("pointermove",function(e){ if(!drag)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(drag.m==="c"){
      if(!drag.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        drag.moved=true; e.preventDefault();
        try{wrap.setPointerCapture(e.pointerId);}catch(err){}
        drag.node.classList.add("dragging"); drag.node.style.pointerEvents="none";
      }
      drag.node.style.transform="translate("+(dx/CV.z)+"px,"+(dy/CV.z)+"px)";
      marcarAlvo(e.clientX,e.clientY); return; }
    if(drag.m==="p"){
      if(drag.lim&&!drag.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        drag.moved=true; try{wrap.setPointerCapture(e.pointerId);}catch(err){} }
      CV.x=drag.ox+dx; CV.y=drag.oy+dy; apply(); }
    else { if(!drag.moved&&Math.abs(dx)<4&&Math.abs(dy)<4)return;
      drag.moved=true;
      var t=s.territorios[drag.k]; t.x=Math.round(drag.ox+dx/CV.z); t.y=Math.round(drag.oy+dy/CV.z);
      drag.node.style.left=t.x+"px"; drag.node.style.top=t.y+"px"; links(); } });
  wrap.addEventListener("pointerup",function(e){
    if(drag&&drag.m==="c"){
      drag.node.classList.remove("dragging"); drag.node.style.transform=""; drag.node.style.pointerEvents="";
      limparLinha();
      if(drag.moved){ supClick=true; setTimeout(function(){supClick=false;},60);
        if(drag.alvo)moverCena(s,drag.id,drag.alvo.terr,drag.alvo.k); }
    } else if(drag&&drag.m==="t"){ if(drag.moved)save(); }
    else if(drag&&drag.m==="p"&&drag.lim&&drag.moved){ supClick=true; setTimeout(function(){supClick=false;},60); }
    drag=null;
    try{wrap.releasePointerCapture(e.pointerId);}catch(err){} });
  wrap.addEventListener("pointercancel",function(){ if(drag&&drag.m==="c"){
      drag.node.classList.remove("dragging"); drag.node.style.transform=""; drag.node.style.pointerEvents=""; limparLinha(); }
    drag=null; });
  wrap.addEventListener("wheel",function(e){
    if(e.target.closest&&(e.target.closest(".railfloat")||e.target.closest(".cvtools")))return;
    e.preventDefault();
    var r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    var nz=Math.min(2.2,Math.max(.22,CV.z*(e.deltaY<0?1.12:.89)));
    CV.x=mx-(mx-CV.x)*(nz/CV.z); CV.y=my-(my-CV.y)*(nz/CV.z); CV.z=nz; apply(); },{passive:false});
  $$("[data-z]",wrap).forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-z");
    if(k==="+")CV.z=Math.min(2.2,CV.z*1.2); else if(k==="-")CV.z=Math.max(.22,CV.z/1.2);
    else enquadrar(); apply(); }; });
  function enquadrar(){
    var maxX=0,maxY=0;
    $$(".terr",cv).forEach(function(t){ maxX=Math.max(maxX,t.offsetLeft+t.offsetWidth); maxY=Math.max(maxY,t.offsetTop+t.offsetHeight); });
    var r=wrap.getBoundingClientRect(), pad=20;
    var rf=$("#railFloat"), rw=(rf&&!rf.hidden)?(rf.offsetWidth+16):0;
    var av=Math.max(240,r.width-pad*2-rw), ah=Math.max(200,r.height-pad*2);
    CV.z=Math.max(.16,Math.min(1.6,Math.min(av/(maxX||1),ah/(maxY||1))));
    CV.x=pad+rw+Math.max(0,(av-(maxX||0)*CV.z)/2);
    CV.y=pad+Math.max(0,(ah-(maxY||0)*CV.z)/2);
    apply();
  }
  CV.fit=enquadrar;
  if(!CV.init){ CV.init=true; setTimeout(enquadrar,30); }
  $$(".card",cv).forEach(function(card){ card.addEventListener("click",function(e){
    if(supClick)return;
    if(e.target.closest("[data-act]"))return; abrirCenaModal(card.getAttribute("data-scn")); }); });
  var rb=$("#railBtn"); if(rb)rb.onclick=function(){ S.rail=!S.rail; $("#railFloat").hidden=!S.rail; rb.classList.toggle("on",S.rail); if(CV.fit)CV.fit(); };
}

function chaveDoTexto(t){
  t=String(t||"").trim();
  var m=t.match(/[?&]convite=([^&\s]+)/);
  if(m)return decodeURIComponent(m[1]);
  m=t.match(/\/([A-Za-z0-9]{10,})\s*$/);
  if(m)return m[1];
  return t;
}

function overlay(title,body,o){ o=o||{};
  var ov=el("div",{"class":"ov"+(o.ovcls?" "+o.ovcls:"")});
  ov.innerHTML='<div class="sheet'+(o.wide?" wide":"")+(o.cls?" "+o.cls:"")+'">'
    +'<div class="shead">'+(o.back?'<button class="backb" data-back>‹ Voltar</button>':"")
    +'<h3>'+esc(title)+'</h3>'+(o.head||"")+'<button class="x" aria-label="Fechar">✕</button></div>'
    +'<div class="sbodyscroll">'+body+'</div></div>';
  function close(){ ov.remove(); document.removeEventListener("keydown",k); }
  function k(e){ if(e.key==="Escape"){e.stopPropagation();close();} }
  ov.querySelector(".x").onclick=close;
  var bk=ov.querySelector("[data-back]");
  if(bk)bk.onclick=function(){ close(); o.back(); };
  ov.addEventListener("pointerdown",function(e){ if(e.target===ov)close(); });
  document.addEventListener("keydown",k);
  $("#layer").appendChild(ov); ov.close=close; flushEd(ov); applyEdit(); return ov;
}

  (function st(t){ var k=Math.min(1,((t||performance.now())-t0)/ms);
    a.volume=Math.max(0,Math.min(1,de+(para-de)*k)); if(k<1)requestAnimationFrame(st); else if(cb)cb(); })(); }

      var bt=$("#btnTrilha"); if(bt)bt.classList.remove("live");

/* ---------- indice de busca: tokens + fallback ---------- */
var IDXN=null;

function prepararIndice(){
  if(IDXN||!IDX||!IDX.pages)return IDXN;
  var pg=[],sq=[],tok={},i,j;
  for(i=0;i<IDX.pages.length;i++){
    var t=norm(IDX.pages[i].t||"");
    pg.push(t); sq.push(t.replace(/[^a-z0-9]+/g,""));
    var ws=t.split(/[^a-z0-9]+/), vis={};
    for(j=0;j<ws.length;j++){ var w=ws[j];
      if(w.length<2||vis[w])continue; vis[w]=1;

  }
  IDXN={pg:pg,sq:sq,tok:tok,keys:Object.keys(tok)};
  return IDXN;
}
function defineTermo(txt,t){
  try{ return new RegExp("(^|[.\\n;:»])\\s*"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[.:•]\\s+[a-zà-ÿA-Z(\"]","i").test(txt); }catch(e){ return false; }
}
function buscaDocs(q,fd,fc){
  if(!IDX||!IDX.pages||!IDX.pages.length)return [];
  var N=prepararIndice(); if(!N)return [];
  var k=norm(q).trim(); if(k.length<2)return [];
  var termos=k.split(/\s+/).filter(function(x){return x.length>=2;});

  var cat=CATS.filter(function(c){return c.id===fc;})[0], ab={};
  IDX.docs.forEach(function(d){ab[d.id]=d.abrev;});

  var SIN=(PUBD().sinonimos||{});
  function mapaDe(t,peso){
    var m={},w,key;
    if(N.tok[t])N.tok[t].forEach(function(i){ m[i]=peso; });
    if(t.length>=4){
      for(w=0;w<N.keys.length;w++){ key=N.keys[w];
        if(key.length>t.length&&key.indexOf(t)===0)
          N.tok[key].forEach(function(i){ if(!m[i])m[i]=Math.round(peso*0.65); }); }
    }
    if(!Object.keys(m).length){
      var sqt=t.replace(/[^a-z0-9]+/g,"");
      if(sqt.length>=4)for(w=0;w<N.sq.length;w++) if(N.sq[w].indexOf(sqt)>=0)m[w]=Math.round(peso*0.35);
    }
    return m;
  }
  var alt=SIN[k]||null;

  (alt||[]).forEach(function(sy){ var f=norm(sy); if(f.indexOf(" ")>0)frases.push(f); });
  termos.forEach(function(t){ (SIN[t]||[]).forEach(function(sy){ var f=norm(sy); if(f.indexOf(" ")>0&&frases.indexOf(f)<0)frases.push(f); }); });
  var mapas=termos.map(function(t){

    ex.forEach(function(sy){
      var sub=norm(sy).split(/\s+/), mm=null;
      sub.forEach(function(st){ var x=mapaDe(st,7);
        if(mm===null)mm=x; else { var u={}; Object.keys(x).forEach(function(i){ if(mm[i]!=null)u[i]=Math.min(mm[i],x[i]); }); mm=u; } });
      if(mm)Object.keys(mm).forEach(function(i){ if(m[i]==null)m[i]=mm[i]; });
    });

  var base=Object.keys(mapas[0]), out=[];

    if(!ok)return;

    var n=0,pp=txt.indexOf(termos[0]);

    sc+=fr;
    if(!fr&&termos.length>1){

    out.push({sc:sc,i:i,d:pgo.d,p:pgo.p,s:pgo.s,sn:trecho(pgo.t,termos[0])||String(pgo.t||"").replace(/\s+/g," ").slice(0,150),ab:ab[pgo.d]||pgo.d});
  });
  out.sort(function(a,b){return b.sc-a.sc;});

  var CAN=(PUBD().canonicas||{}), fix=CAN[k];

    }
  }

function upload(url,fd,onProg){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open("POST",url,true); x.withCredentials=true;
    var t=cookie("XSRF-TOKEN"); if(t)x.setRequestHeader("X-XSRF-TOKEN",t);
    if(x.upload)x.upload.onprogress=function(e){ if(e.lengthComputable&&onProg)onProg(e.loaded/e.total); };
    x.onload=function(){ var b=null; try{ b=JSON.parse(x.responseText); }catch(e){}
      if(x.status>=200&&x.status<300)res(b||{});
      else rej(new Error((b&&b.erro)||("HTTP "+x.status))); };
    x.onerror=function(){ rej(new Error("falha de rede")); };
    x.ontimeout=function(){ rej(new Error("tempo esgotado")); };
    x.send(fd);
  });
}
function mb(n){ n=+n||0; if(n<1024)return n+" B";
  if(n<1048576)return (n/1024).toFixed(0)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(1)+" MB";
  return (n/1073741824).toFixed(2)+" GB"; }
var ABREVS=[[/ordem paranormal rpg|livro b[aá]sico|livro de regras/i,"LB","Livro Básico"],
 [/sobrevivendo ao horror/i,"SH","Sobrevivendo ao Horror"],
 [/arquivos secretos 0*1/i,"AS01","Arquivos Secretos 01"],
 [/arquivos secretos 0*2/i,"AS02","Arquivos Secretos 02"],
 [/arquivos secretos 0*3/i,"AS03","Arquivos Secretos 03"],
 [/arquivos secretos 0*4/i,"AS04","Arquivos Secretos 04"],
 [/arquivos secretos 0*5/i,"AS05","Arquivos Secretos 05"],
 [/arquivos secretos 0*6/i,"AS06","Arquivos Secretos 06"],
 [/arquivos secretos 0*7/i,"AS07","Arquivos Secretos 07"]];
function abrevDe(nome){
  for(var i=0;i<ABREVS.length;i++) if(ABREVS[i][0].test(nome))return {ab:ABREVS[i][1],nome:ABREVS[i][2]};
  var base=nome.replace(/\.pdf$/i,"");
  var ab=norm(base).replace(/[^a-z0-9 ]+/g," ").trim().split(/\s+/)
    .map(function(w){return w[0];}).join("").toUpperCase().slice(0,5)||"DOC";
  return {ab:ab,nome:base};
}
function escolherArquivos(pasta,aceita){
  return new Promise(function(res){
    var inp=el("input",{type:"file"});
    if(pasta)inp.webkitdirectory=true; else inp.multiple=true;
    if(aceita)inp.accept=aceita;
    inp.style.display="none"; document.body.appendChild(inp);
    inp.onchange=function(){ var fs=Array.prototype.slice.call(inp.files||[]); inp.remove(); res(fs); };
    inp.click();
  });
}

function abrirReferencia(back){
  if(!GM){ toast("Só o mestre"); return; }
  var ref=JSON.parse(JSON.stringify(PUBD().referencia||[]));
  function corpo(){
    return ref.map(function(g,i){
      return '<div class="fld"><span class="flb">Grupo '+(i+1)+'</span>'
        +'<div class="addrow"><input class="inp" data-rt="'+i+'" placeholder="título do grupo" value="'+esc(g.t||"")+'">'
        +'<button class="tbtn d" data-rdel="'+i+'">remover</button></div>'
        +'<textarea class="inp" data-ri="'+i+'" rows="5" style="width:100%;margin-top:6px" '
        +'placeholder="uma linha por item">'+esc((g.itens||[]).join("\n"))+'</textarea></div>'; }).join("")
      +'<div class="addrow"><button class="btn sec" id="rfAdd">Adicionar grupo</button>'
      +'<button class="btn" id="rfGo">Salvar</button></div>';
  }
  var ov=overlay(Vm("referencia"),
    '<p class="lead">O resumo de regras que fica na aba '+esc(Vm("mesa"))
    +', visível para os jogadores. Nada aqui vem pronto: é a sua mesa que escreve.</p>'
    +'<div id="rfBody">'+corpo()+'</div>',{wide:true,back:back});
  function colher(){
    $$("[data-rt]",ov).forEach(function(i){ ref[+i.getAttribute("data-rt")].t=i.value; });
    $$("[data-ri]",ov).forEach(function(t){
      ref[+t.getAttribute("data-ri")].itens=(t.value||"").split("\n")
        .map(function(x){return x.trim();}).filter(Boolean); });
  }
  function ligar(){
    $("#rfAdd",ov).onclick=function(){ colher(); ref.push({t:"Novo grupo",itens:[]});
      $("#rfBody",ov).innerHTML=corpo(); ligar(); };
    $("#rfGo",ov).onclick=function(){ colher();
      D.campanha.referencia=ref.filter(function(g){return (g.t||"").trim()||(g.itens||[]).length;});
      save(); salvarMesa(); ov.close(); render(); toast("Consulta rápida salva"); };
    $$("[data-rdel]",ov).forEach(function(b){ b.onclick=function(){ colher();
      ref.splice(+b.getAttribute("data-rdel"),1); $("#rfBody",ov).innerHTML=corpo(); ligar(); }; });
  }
  ligar();

function temaWire(ov){
  function marca(){ $$("[data-tema]",ov).forEach(function(x){
    x.setAttribute("aria-pressed", x.getAttribute("data-tema")===temaAtivo()); }); }
  $$("[data-tema]",ov).forEach(function(b){ b.onclick=function(){
    var k=b.getAttribute("data-tema");
    try{ localStorage.setItem("grim_tema",k); }catch(e){}
    aplicarTema(k); marca(); }; });
  var tm=$("#temaMesa",ov); if(tm)tm.onclick=function(){
    MESA.tema=temaAtivo(); salvarMesa(); toast("Tema aplicado para a mesa inteira"); };
  var tl=$("#temaLimpa",ov); if(tl)tl.onclick=function(){
    try{ localStorage.removeItem("grim_tema"); }catch(e){}
    aplicarTema(temaAtivo()); marca(); toast("Voltou ao tema da mesa"); };
}

/* ---------- SESSOES: mover cena, criar, escolher, encerrar ---------- */
function idxCena(s,id){ for(var i=0;i<s.cenas.length;i++) if(s.cenas[i].id===id)return i; return -1; }
function moverCena(s,id,terrId,k){
  var i=idxCena(s,id); if(i<0)return;
  var c=s.cenas.splice(i,1)[0];
  c.territorio=terrId;
  var lista=s.cenas.filter(function(x){return x.territorio===terrId;});
  var destino;
  if(k>=lista.length) destino=lista.length?(s.cenas.indexOf(lista[lista.length-1])+1):s.cenas.length;
  else destino=s.cenas.indexOf(lista[k]);
  s.cenas.splice(destino,0,c);
  save(); render();
}

  h.push('<div class="addrow" style="margin-top:16px"><button class="btn" id="encOk">Encerrar e migrar</button>'
    +'<button class="btn sec" id="encNo">Cancelar</button></div>');
  var ov=overlay("Encerrar sessão "+s.numero,h.join(""));
  $("#encNo",ov).onclick=function(){ov.close();};
  $("#encOk",ov).onclick=function(){ ov.close(); aplicarEncerramento(s); };
}
function aplicarEncerramento(s){
  var ip=-1;
  for(var i=0;i<D.sessoes.length;i++) if(D.sessoes[i].numero===s.numero+1) ip=i;
  if(ip<0) ip=novaSessao(s.numero+1);
  var prox=D.sessoes[ip];
  var pend=s.cenas.filter(function(c){return !c.feito;});
  var movTerr=[],movNpc=[],movHo=[];
  pend.forEach(function(c){
    var t=(s.territorios||[]).filter(function(x){return x.id===c.territorio;})[0];
    if(t&&!prox.territorios.filter(function(x){return x.id===t.id;})[0]){
      prox.territorios.push({id:t.id,nome:t.nome,cor:t.cor});
      movTerr.push(t.nome);
    }
    var r=refsDaCena(c);
    (s.handouts||[]).forEach(function(ho){
      if(ho.img&&r.im.indexOf(ho.img)>=0&&!prox.handouts.filter(function(x){return x.nome===ho.nome;})[0]){
        prox.handouts.push(ho); movHo.push(ho.nome); } });
    (s.npcs||[]).forEach(function(n){
      if(n.img&&r.qi.indexOf(n.img)>=0&&!prox.npcs.filter(function(x){return x.nome===n.nome;})[0]){
        prox.npcs.push(n); movNpc.push(n.nome); } });
  });
  s.cenas=s.cenas.filter(function(c){return !!c.feito;});
  prox.cenas=prox.cenas.concat(pend);
  if(prox.territorios.length&&prox.territorios[0].nome==="TERRITÓRIO 1"&&!prox.cenas.filter(function(c){return c.territorio===prox.territorios[0].id;})[0])
    prox.territorios.shift();
  s.status="encerrada";
  save();
  S.view="sessao"; S.sessao=D.sessoes.indexOf(prox); S.vmode="canvas"; CV.init=false; render();
  var h=['<p class="lead">Sessão '+s.numero+' encerrada. Você está agora na Sessão '+prox.numero+'.</p>'];
  function bloco(t,l){ if(!l.length)return;
    h.push('<div class="fld" style="margin-top:12px"><span class="flb">'+t+' ('+l.length+')</span><ul class="fl">'
      +l.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'); }
  bloco("Cenas migradas",pend.map(function(c){return c.n+" · "+c.titulo;}));
  bloco("Territórios criados lá",movTerr);
  bloco("NPCs copiados",movNpc);
  bloco("Handouts copiados",movHo);
  if(!pend.length)h.push('<p class="sm muted">Nada precisou migrar.</p>');
  overlay("Migração concluída",h.join(""));
}

/* ---------- RENDER ---------- */
function renderTabs(){
  var t=$("#tabs"); t.innerHTML="";
  function tab(id,label,cur){ var b=el("button",{"class":"tab",text:label});
    b.setAttribute("aria-current",cur?"true":"false");
    function ir(){ if(id==="home"||id==="metodo"||id==="mesa"){S.view=id;}
      else {S.view="sessao";S.sessao=+id.split(":")[1];} render(); }
    b.addEventListener("pointerdown",function(e){ if(e.button===0){e.preventDefault();ir();} });
    b.addEventListener("click",function(e){ if(e.detail===0)ir(); });
    t.appendChild(b); }
  if(S.view==="semcampanha"||S.view==="escolher")return;
  if(!GM){ tab("mesa",Vm("mesa"),true); return; }
  tab("home",Vm("campanha"),S.view==="home");
  var cur=(S.view==="sessao")?D.sessoes[S.sessao]:null;
  var sb=el("button",{"class":"tab tabsel"});
  sb.innerHTML=(cur?esc("S"+cur.numero+" · "+cur.titulo):esc(Vm("sessoes")))+'<span class="caret">&#9662;</span>';
  sb.setAttribute("aria-current",S.view==="sessao"?"true":"false");
  sb.title="Escolher a "+V("sessao").toLowerCase();
  sb.addEventListener("pointerdown",function(e){ e.preventDefault(); e.stopPropagation(); abrirMenuSessoes(sb); });
  sb.addEventListener("click",function(e){ if(e.detail===0)abrirMenuSessoes(sb); });
  t.appendChild(sb);
  tab("metodo",Vm("metodo"),S.view==="metodo");
  tab("mesa",Vm("mesa"),S.view==="mesa");
}
function render(){
  REG={}; RN=0;
  try{fecharMenu();}catch(e){}
  renderTabs();
  var v=$("#view"), board=(GM&&S.view==="sessao"&&S.vmode==="canvas");
  document.body.classList.toggle("board",board);
  v.classList.toggle("board",board);
  document.documentElement.style.setProperty("--hh",($(".top").offsetHeight||56)+"px");
  if(S.view!=="semcampanha"&&S.view!=="escolher"&&!GM)S.view="mesa";
  document.body.classList.toggle("jogador",!GM&&!!CID);
  pintarMarca();
  try{
    if(S.view==="semcampanha")v.innerHTML=viewSemCampanha();
    else if(S.view==="escolher")v.innerHTML=viewEscolher();
    else if(S.view==="mesa")v.innerHTML=viewMesa();
    else if(S.view==="home")v.innerHTML=viewHome();
    else if(S.view==="metodo")v.innerHTML=viewMetodo();
    else v.innerHTML=viewSessao();
  }catch(err){
    v.innerHTML='<div class="panel" style="padding:18px;margin-top:20px"><h2 class="sec">Falhou ao montar esta aba</h2>'
      +'<p class="lead">'+esc(String((err&&err.message)||err))+'</p>'
      +'<p class="sm muted">'+esc(String((err&&err.stack)||"").split("\n").slice(0,4).join(" | "))+'</p></div>';
    try{toast("Erro ao abrir "+S.view+": "+((err&&err.message)||err));}catch(_){}
  }
  try{ flushEd(v); applyEdit();
    if(S.view==="semcampanha"||S.view==="escolher"){ hydrateCampanhas(v); }
    if(S.view==="mesa")hydrateMesa();
    if(S.view==="home"){ if(D.campanha)hydrateHome(); else hydrateVazio(); }
    if(S.view==="metodo"&&!D.campanha)hydrateVazio();
  }catch(err2){ try{toast("Erro ao ligar os controles: "+((err2&&err2.message)||err2));}catch(_){} }
  if(S.view==="sessao")try{
    var eb=$("#encBtn",v); if(eb)eb.onclick=function(){encerrarSessao();};
    var lb=$("#libBtn",v); if(lb)lb.onclick=function(){abrirLiberar();};
    $$("[data-vm]",v).forEach(function(b){b.onclick=function(){S.vmode=b.getAttribute("data-vm");render();};});
    hydrateCena(v);
    $$("details.scn",v).forEach(function(d){ d.addEventListener("toggle",function(){
      if(!d.open)return;
      $$("details.scn",v).forEach(function(o){ if(o!==d&&o.open)o.open=false; }); }); });
    $$(".railfloat details.rbox, aside.rail details.rbox",v).forEach(function(d){
      d.addEventListener("toggle",function(){ if(!d.open)return;
        var pai=d.parentNode;
        $$("details.rbox",pai).forEach(function(o){ if(o!==d&&o.open)o.open=false; }); }); });
    if(board)initCanvas(curSess());
  }catch(err3){ try{toast("Erro na sessão: "+((err3&&err3.message)||err3));}catch(_){} }
  try{ if(!board)window.scrollTo(0,0); }catch(_){}
}

/* ---------- BOOT ---------- */
window.addEventListener("error",function(e){ try{ if(e&&e.message)toast("Erro: "+e.message); }catch(_){} });
window.addEventListener("unhandledrejection",function(e){ try{ var r=e&&e.reason;
  toast("Falha: "+((r&&r.message)||r||"desconhecida")); }catch(_){} });
$("#btnBusca").onclick=function(){abrirBusca();};
$("#btnTrilha").onclick=function(){abrirTrilha();};
$("#nbName").onclick=function(){abrirTrilha();};
$("#nbPlay").onclick=function(){ if(!PL.cur)return; if(PL.cur.paused)PL.cur.play(); else PL.cur.pause(); playerUI(); };
$("#nbStop").onclick=function(){ parar(); };
$("#nbLoop").onclick=function(){ PL.loop=!PL.loop; if(PL.cur)PL.cur.loop=PL.loop; playerUI();
  var lp=$("#plLoop"); if(lp){lp.setAttribute("aria-pressed",PL.loop);lp.textContent="Loop "+(PL.loop?"ligado":"desligado");}
  toast(PL.loop?"Loop ligado":"Loop desligado"); };
$("#btnMenu").onclick=function(){abrirMenu();};
$("#btnEdit").onclick=function(){S.edit=!S.edit;applyEdit();toast(S.edit?"Modo edição ligado":"Modo edição desligado");};
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==="f"||e.key==="F")){ e.preventDefault(); e.stopPropagation(); abrirBusca(); return; }
  var tag=(e.target&&e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||e.target.isContentEditable)return;
  if($(".ov"))return;
  if(e.key==="e"||e.key==="E"){S.edit=!S.edit;applyEdit();}
},true);
window.addEventListener("resize",function(){
  document.documentElement.style.setProperty("--hh",($(".top").offsetHeight||56)+"px"); });
boot();
})();
</script>
