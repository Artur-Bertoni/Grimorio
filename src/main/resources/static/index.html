  var passos=passosTour(p), i=0, d=el("div",{"class":"tour",role:"dialog","aria-modal":"true","aria-label":"Tour guiado"});
  d.innerHTML='<div class="tourfoco"></div><div class="tourcard"><div class="tourlogo">'+logoCss("")+'</div>'
    +'<div class="tourtop"><span class="tourn"></span><button class="tbtn" data-t="pula">pular tour</button></div>'
    +'<h4></h4><p></p><div class="tourdots"></div>'
    +'<div class="tourft"><button class="btn sec" data-t="volta">‹ Voltar</button><button class="btn" data-t="vai">Próximo ›</button></div></div>';
  document.body.appendChild(d);
  var foco=$(".tourfoco",d), card=$(".tourcard",d), vez=0;
  TOUR={el:d,p:p,fim:fim};
  function alvo(){ var s=passos[i]; if(!s.a)return null; var e=$(s.a); if(!e)return null;
    var r=e.getBoundingClientRect(); return (r.width||r.height)?e:null; }
  function posiciona(){
    if(!TOUR||TOUR.el!==d)return;
    var e=alvo();
    if(!e){ d.classList.add("centro"); return; }
    d.classList.remove("centro");
    var r=e.getBoundingClientRect(), W=window.innerWidth, H=window.innerHeight, m=6;
    var fx=Math.max(4,r.left-m), fy=Math.max(4,r.top-m), fw=Math.min(W-fx-4,r.width+2*m), fh=Math.min(H-fy-4,r.height+2*m);
    foco.style.left=fx+"px"; foco.style.top=fy+"px"; foco.style.width=fw+"px"; foco.style.height=fh+"px";
    var cw=card.offsetWidth, ch=card.offsetHeight, g=14, top;
    if(fy+fh+g+ch<=H-8)top=fy+fh+g; else if(fy-g-ch>=8)top=fy-g-ch; else top=Math.max(8,H-ch-8);
    card.style.left=Math.min(Math.max(8,fx+fw/2-cw/2),W-cw-8)+"px"; card.style.top=top+"px";
  }
  function mostra(){
    var s=passos[i], minha=++vez;
    if(s.ir){ try{ s.ir(); }catch(x){} }
    $(".tourn",card).textContent=(i+1)+" de "+passos.length;
    $("h4",card).textContent=s.t; $("p",card).textContent=s.x;
    card.classList.toggle("comlogo",!!s.logo);
    $(".tourdots",card).innerHTML=passos.map(function(_,k){ return '<i'+(k===i?' class="on"':k<i?' class="ja"':'')+'></i>'; }).join("");
    $('[data-t="volta"]',card).disabled=(i===0);
    $('[data-t="vai"]',card).textContent=(i===passos.length-1)?"Concluir":"Próximo ›";
    card.classList.remove("entra"); void card.offsetWidth; card.classList.add("entra");
    d.setAttribute("data-falta","…");
    /* espera a tela nova montar antes de procurar o elemento e rolar ate ele */
    setTimeout(function(){
      if(minha!==vez)return;
      var e=alvo();
      if(e){ var r=e.getBoundingClientRect();
        if(r.top<60||r.bottom>window.innerHeight-20)e.scrollIntoView({block:"center"}); }
      posiciona();
      d.setAttribute("data-falta",(s.a&&!e)?s.a:"");
    },s.ir?420:40);
    som("abre");
  }
  function anda(n){ if(n<0&&i>0){ i--; mostra(); } else if(n>0){ if(i<passos.length-1){ i++; mostra(); } else fecharTour(); } }
  $$("[data-t]",card).forEach(function(b){ b.onclick=function(){ var t=b.getAttribute("data-t");
    if(t==="pula")fecharTour(); else anda(t==="vai"?1:-1); }; });
  /* o tour segura o teclado: nenhum atalho da pagina (busca com /, Esc das janelas) passa por baixo */
  TOUR.k=function(e){ if(e.key==="Tab")return; e.stopPropagation();
    if(e.key==="Escape"){ e.preventDefault(); fecharTour(); }
    else if(e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); anda(1); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); anda(-1); } };
  TOUR.rz=function(){ posiciona(); };
  document.addEventListener("keydown",TOUR.k,true);
  window.addEventListener("resize",TOUR.rz); window.addEventListener("scroll",TOUR.rz,true);
  mostra();
}
function fecharTour(silencio){
  if(!TOUR)return;
  var t=TOUR; TOUR=null;
  try{ localStorage.setItem(tourChave(t.p),"1"); }catch(e){}
  document.removeEventListener("keydown",t.k,true);
  window.removeEventListener("resize",t.rz); window.removeEventListener("scroll",t.rz,true);
  t.el.remove();
  if(silencio)return;
  /* volta para a tela de partida, que o tour pode ter trocado varias vezes */
  S.view=GM?"home":"mesa"; if(!GM)S.msec="resumos"; render();

/* ---------- SUPORTE E ARMAZENAMENTO CHEIO ----------
   O envio que esbarra no volume cheio volta 507; em vez de um erro generico, a pessoa ve o
   que aconteceu e um caminho para falar com o suporte, que ja abre com o assunto certo. */
var AVISO_CHEIO=0;
function avisoArmazenamento(){
  if(Date.now()-AVISO_CHEIO<4000)return; AVISO_CHEIO=Date.now();
  var ov=overlay("Armazenamento cheio",
    '<div class="cheio"><div class="cheioicone">'+logoCss("")+'</div>'
    +'<h4>O espaço do servidor acabou</h4>'
    +'<p>O armazenamento desta instância está cheio, então não dá para subir arquivos novos agora. '
    +'Nada do que já estava salvo foi perdido.</p>'
    +'<div class="addrow" style="justify-content:center;margin-top:.5rem"><button class="btn" id="chSup">Falar com o suporte</button>'
    +'<button class="btn sec" id="chOk">Entendi</button></div></div>',{cls:"cheiosheet"});
  $("#chOk",ov).onclick=function(){ ov.close(); };
  $("#chSup",ov).onclick=function(){ ov.close(); abrirSuporte(null,null,{assunto:"Armazenamento cheio",
    mensagem:"Tentei subir um arquivo e o servidor avisou que o armazenamento está cheio."}); };
  som("min");
}

  return [c&&c.nome?V("campanha")+": "+c.nome+" (#"+CID+", "+(GM?"mestre":"jogador")+")":"fora de campanha",
    "tela: "+S.view, "navegador: "+navigator.userAgent].join(" · ").slice(0,1000);

function abrirSuporte(back,mk,pre){

/* ---------- SONS ----------
   Nenhum arquivo: tudo e sintetizado na hora, e o timbre muda com o estilo do tema.
   Nasce ligado; quem desliga e a pessoa, em Ajustes > Aparencia. */
var SOM={ctx:null};
var TIMBRE={fantasia:{o:"triangle",f:1},terror:{o:"sawtooth",f:.5},misterio:{o:"sine",f:.75},
  investigacao:{o:"square",f:.6},ficcao:{o:"square",f:1.5}};
function somLigado(){ try{ return localStorage.getItem("grim_som")!=="0"; }catch(e){ return true; } }
function somVol(){ var v=NaN; try{ v=parseFloat(localStorage.getItem("grim_somvol")); }catch(e){}
  return isFinite(v)?Math.max(0,Math.min(1,v)):.5; }
function som(n){
  if(!somLigado())return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    var c=SOM.ctx||(SOM.ctx=new AC()); if(c.state==="suspended")c.resume();
    var t0=c.currentTime, vol=somVol()*.35;
    var tb=TIMBRE[document.documentElement.getAttribute("data-estilo")]||TIMBRE.terror;
    var nota=function(fr,ini,dur,v,tipo,ate){ var o=c.createOscillator(), g=c.createGain();
      o.type=tipo||tb.o; o.frequency.setValueAtTime(fr*tb.f,t0+ini);
      if(ate)o.frequency.exponentialRampToValueAtTime(ate*tb.f,t0+ini+dur);
      g.gain.setValueAtTime(.0001,t0+ini); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol*v),t0+ini+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+ini+dur);
      o.connect(g); g.connect(c.destination); o.start(t0+ini); o.stop(t0+ini+dur+.03); };
    var chiado=function(ini,dur,v,fq,filtro){ var q=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,q,c.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<q;i++)d[i]=(Math.random()*2-1)*(1-i/q);
      var s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain();
      s.buffer=b; fl.type=filtro||"bandpass"; fl.frequency.value=fq*tb.f; g.gain.value=vol*v;
      s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t0+ini); };
    if(n==="dado"){ for(var k=0;k<7;k++)chiado(k*.075+Math.random()*.02,.045,1.2,1800+Math.random()*1500); }
    else if(n==="cai"){ chiado(0,.09,1.4,700,"lowpass"); nota(220,0,.12,.6,"sine",110); }
    else if(n==="max"){ [523,659,784,1047].forEach(function(f,i){ nota(f,i*.09,.5,.8); }); }
    else if(n==="min"){ nota(196,0,.5,.9,null,82); nota(147,.12,.6,.7,null,61); }
    else if(n==="pagina"){ chiado(0,.28,.9,2600,"highpass"); }
    else if(n==="abre"){ nota(440,0,.14,.3,null,660); }
    else if(n==="fecha"){ nota(520,0,.12,.25,null,330); }
    else if(n==="revela"){ chiado(0,.35,.6,1200); [392,523,784].forEach(function(f,i){ nota(f,.1+i*.12,.6,.7); }); }
    else if(n==="capitulo"){ nota(98,0,1.4,.9,null,98); nota(196,.05,1.2,.5); nota(294,.3,1,.4); }
    else if(n==="pedido"){ nota(660,0,.15,.6); nota(880,.16,.25,.6); }
    else if(n==="vez"){ nota(330,0,.1,.5); nota(495,.1,.18,.5); }
  }catch(e){}
}

/* ---- importar ficha de PDF ----
   Primeiro os campos de formulario do PDF (ficha preenchivel entrega rotulo e valor prontos),
   depois o texto das paginas. Com IA configurada ela organiza; sem, a montagem e local. */
function lerPdfFicha(arq){
  return arq.arrayBuffer().then(function(buf){ return window.pdfjsLib.getDocument({data:buf}).promise; }).then(function(doc){
    var campos=[], linhas=[], n=Math.min(doc.numPages,8), ch=Promise.resolve();
    var pag=function(i){ return doc.getPage(i).then(function(p){
      return Promise.all([p.getAnnotations().catch(function(){ return []; }),
                          p.getTextContent().catch(function(){ return {items:[]}; })]).then(function(r){
        r[0].forEach(function(a){ if(a.subtype!=="Widget"||!a.fieldName)return;
          var v=a.fieldValue, ck=!!(a.checkBox||a.radioButton);
          if(ck){ if(!v||v==="Off")return; if(a.radioButton&&a.buttonValue!=null&&v!==a.buttonValue)return; v=a.checkBox?"1":String(v); }
          if(Array.isArray(v))v=v.join(", ");
          v=String(v==null?"":v).trim(); if(!v)return;
          var rot=String(a.alternativeText||a.fieldName).replace(/[_.\[\]]+/g," ").replace(/\s+/g," ").trim();
          if(rot)campos.push({rot:rot.slice(0,80),val:v,ck:!!a.checkBox}); });
        var ys={}; r[1].items.forEach(function(it){ if(!it.str||!it.str.trim())return;
          var y=Math.round(it.transform[5]/3); (ys[y]=ys[y]||[]).push(it); });
        Object.keys(ys).map(Number).sort(function(a,b){ return b-a; }).forEach(function(y){
          linhas.push(ys[y].sort(function(a,b){ return a.transform[4]-b.transform[4]; }).map(function(it){ return it.str; }).join(" ").replace(/\s+/g," ").trim()); });
      }); }); };
    for(var i=1;i<=n;i++)(function(k){ ch=ch.then(function(){ return pag(k); }); })(i);
    return ch.then(function(){ return {campos:campos,linhas:linhas,doc:doc}; });
  });
}
/* paginas do PDF desenhadas em JPEG, so o base64, para a IA ler */
function paginasEmImagem(doc,max){
  var out=[], ch=Promise.resolve(), n=Math.min(doc.numPages,max||3);
  for(var i=1;i<=n;i++)(function(k){ ch=ch.then(function(){ return doc.getPage(k).then(function(p){
    var v1=p.getViewport({scale:1}), vp=p.getViewport({scale:Math.min(2.5,1500/v1.width)});
    var cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    var cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height);
    return p.render({canvasContext:cx,viewport:vp}).promise.then(function(){
      out.push(cv.toDataURL("image/jpeg",.82).split(",")[1]); }); }); }); })(i);
  return ch.then(function(){ return out; });
}
function fichaDoLido(lido,nomeArq){
  var secDe={}; fichaModelo().forEach(function(m){ secDe[norm(m.rot)]=m; });
  var bruto=lido.campos.slice();
  if(!bruto.length)lido.linhas.forEach(function(l){ var m=/^(.{2,40}?)\s*:\s*(.{1,400})$/.exec(l); if(m)bruto.push({rot:m[1].trim(),val:m[2].trim()}); });
  var nome="", campos=[];
  bruto.slice(0,200).forEach(function(b){
    if(!nome&&/^(nome|name|personagem|character)\b/i.test(b.rot)&&b.val.length<80){ nome=b.val; return; }
    var m=secDe[norm(b.rot)], bar=/^(-?\d+)\s*\/\s*(\d+)$/.exec(b.val), tipo, val=b.val, max="";
    if(b.ck)tipo="check"; else if(bar){ tipo="barra"; val=bar[1]; max=bar[2]; }
    else if(/^[+-]?\d{1,4}$/.test(b.val))tipo="num"; else if(b.val.length>70||/\n/.test(b.val))tipo="area"; else tipo="texto";
    campos.push(fichaCampoLimpo({sec:m?m.sec:"Importado do PDF",rot:b.rot,tipo:tipo,val:val,max:max})); });
  return {nome:nome||String(nomeArq||"Ficha importada").replace(/\.pdf$/i,""),campos:campos};
}
function importarFichaPdf(arq){
  if(!window.pdfjsLib){ toast("Leitor de PDF indisponível"); return; }
  toast("Lendo o PDF…");
  lerPdfFicha(arq).then(function(lido){
    /* PDF que e so imagem (escaneado, ou ficha que e toda arte): as paginas vao desenhadas
       para a IA, que le o que esta impresso. Sem IA nesta instancia nao ha como ler. */
    var semTexto=!lido.campos.length&&lido.linhas.join("").replace(/\s/g,"").length<20;
    if(semTexto){
      if(!IACFG){ toast("Esse PDF é só imagem. Para ler ficha escaneada ou desenhada, a IA precisa estar configurada nesta instância."); return; }
      toast("O PDF é só imagem: a IA está lendo as páginas…");
      return paginasEmImagem(lido.doc,3).then(function(imgs){
        return api(cAPI("/fichas/importar"),{method:"POST",body:{texto:"",imagens:imgs}}); })
       .then(function(r){ if(typeof r==="string")r=JSON.parse(r);
         var cs=(r.campos||[]).map(fichaCampoLimpo).filter(function(x){ return x.rot; });
         if(!cs.length){ toast("A IA não achou campos nessa ficha."); return; }
         var vazios=cs.filter(function(x){ return !x.val; }).length;
         return criaFicha(String(r.nome||"").trim()||String(arq.name||"Ficha").replace(/\.pdf$/i,""),cs,true).then(function(f){
           if(f)toast("A IA leu "+cs.length+" campos"+(vazios===cs.length?" (ficha em branco: preencha os valores)":"")+". Confira e ajuste."); }); })
       .catch(function(e){ toast("A IA não conseguiu ler a imagem"+(e&&e.message?": "+e.message:"")); });
    }
    var local=function(){ return fichaDoLido(lido,arq.name); };
    var monta=IACFG
      ?api(cAPI("/fichas/importar"),{method:"POST",body:{texto:(lido.campos.map(function(c){ return c.rot+": "+c.val; }).join("\n")
            +"\n--- TEXTO DAS PAGINAS ---\n"+lido.linhas.join("\n")).slice(0,40000)}})
          .then(function(r){ if(typeof r==="string")r=JSON.parse(r);
            var cs=(r.campos||[]).map(fichaCampoLimpo).filter(function(x){ return x.rot; });
            if(!cs.length)throw new Error("vazio");
            return {nome:String(r.nome||"").trim()||local().nome,campos:cs}; })
          .catch(function(){ toast("A IA não respondeu; montei a ficha só com a leitura do PDF."); return local(); })
      :Promise.resolve(local());
    return monta.then(function(fi){
      if(!fi.campos.length){ toast("Li o PDF, mas não achei campos com rótulo e valor."); return; }
      return criaFicha(fi.nome,fi.campos,true).then(function(f){ if(f)toast("Li "+fi.campos.length+" campos do PDF. Confira e ajuste."); }); });
  }).catch(function(e){ toast("Não consegui ler esse PDF"+(e&&e.message?": "+e.message:"")); });
}

/* ---------- PAINEL DE ROLAGENS ----------
   As rolagens da mesa num painel solto, para nao encher o mural. Fica aberto entre
   telas (mora no body, nao no #view) e lembra lugar, tamanho e se estava aberto. */
var RP={iv:null};
function rpAberto(){ var p=$("#rolPainel"); return !!(p&&!p.hidden); }
function rpGeo(g){ try{ if(g===undefined)return JSON.parse(localStorage.getItem("grim_rolp_g")||"null");
  if(g)localStorage.setItem("grim_rolp_g",JSON.stringify(g)); else localStorage.removeItem("grim_rolp_g"); }catch(e){ return null; } }
function rpAplica(p,g){
  if(!g){ p.style.left=p.style.top=p.style.width=p.style.height=p.style.right=""; return; }
  var W=window.innerWidth, H=window.innerHeight, w=Math.max(220,Math.min(g.w,W-8)), h=Math.max(180,Math.min(g.h,H-8));
  p.style.width=w+"px"; p.style.height=h+"px"; p.style.right="auto";
  p.style.left=Math.max(0,Math.min(g.x,W-w))+"px"; p.style.top=Math.max(0,Math.min(g.y,H-h))+"px";
}
function painelRolagens(abrir){
  var p=$("#rolPainel");
  if(!p){
    p=el("aside",{"class":"rolpainel",id:"rolPainel","aria-label":"Rolagens da mesa"});
    p.hidden=true;
    p.innerHTML='<div class="rphd" id="rpHd">'+d20Svg("")+'<span>Rolagens da '+vl("mesa")+'</span>'
      +'<button class="x" id="rpX" aria-label="Fechar o painel">✕</button></div>'
      +'<div class="rpbody"><div class="ddfeed" id="rpFeed" aria-live="polite"></div></div>'
      +'<form class="rpform" id="rpForm"><input class="inp" id="rpF" placeholder="1d20+3" autocomplete="off" spellcheck="false" aria-label="Rolar daqui">'
      +'<button class="btn sec" id="rpGo">Rolar</button></form>'
      +'<span class="rpgrip" id="rpGrip" title="Arraste para redimensionar"></span>';
    document.body.appendChild(p);
    var hd=$("#rpHd",p), gp=$("#rpGrip",p);
    var atual=function(){ var r=p.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height}; };
    var arrastar=function(alvo,muda){ alvo.addEventListener("pointerdown",function(e){
      if(e.button!==0||e.target.closest(".x"))return; e.preventDefault();
      var g0=atual(), sx=e.clientX, sy=e.clientY;
      try{ alvo.setPointerCapture(e.pointerId); }catch(x){}
      var mv=function(ev){ rpAplica(p,muda(g0,ev.clientX-sx,ev.clientY-sy)); };
      var up=function(){ alvo.removeEventListener("pointermove",mv); alvo.removeEventListener("pointerup",up);
        alvo.removeEventListener("pointercancel",up); rpGeo(atual()); };
      alvo.addEventListener("pointermove",mv); alvo.addEventListener("pointerup",up); alvo.addEventListener("pointercancel",up); }); };
    arrastar(hd,function(g,dx,dy){ return {x:g.x+dx,y:g.y+dy,w:g.w,h:g.h}; });
    arrastar(gp,function(g,dx,dy){ return {x:g.x,y:g.y,w:g.w+dx,h:g.h+dy}; });
    hd.addEventListener("dblclick",function(){ rpGeo(null); rpAplica(p,null); });
    $("#rpX",p).onclick=function(){ painelRolagens(false); };
    $("#rpForm",p).onsubmit=function(e){ e.preventDefault(); var v=$("#rpF",p).value.trim(); if(v)rolarDireto({formula:v}); };
    window.addEventListener("resize",function(){ if(!p.hidden)rpAplica(p,rpGeo()); });
  }
  var lig=abrir===undefined?p.hidden:!!abrir;
  if(lig&&!CID)lig=false;
  p.hidden=!lig;
  try{ localStorage.setItem("grim_rolp",lig?"1":"0"); }catch(e){}
  var b=$("#btnRol"); if(b)b.classList.toggle("on",lig);
  clearInterval(RP.iv);
  if(lig){ rpAplica(p,rpGeo()); feedDados([]); puxaRolagens(false);
    RP.iv=setInterval(function(){ if(!document.hidden&&!(DADOS.ov&&document.body.contains(DADOS.ov)))puxaRolagens(false); },2500); }
}
/* rolar pelo painel nao abre a janela do dado: o resultado ja entra na lista */
function rolarDireto(c){
  if(DADOS.ov&&document.body.contains(DADOS.ov)&&DADOS.rola){ DADOS.rola(c); return; }
  som("dado");
  api(cAPI("/rolagens"),{method:"POST",body:{formula:c.formula||null,lados:c.lados||null,publica:GM?DADOS.pub:null,
      rotulo:c.rotulo||"",pedidoId:c.pedidoId||null}})
    .then(function(r){ if(r.id>DADOS.ult)DADOS.ult=r.id;
      poeNoHist(r);
      som(r.extremo>0?"max":r.extremo<0?"min":"cai"); telaCritica(r.extremo);
      var f=$("#rpF"); if(f)f.value=""; })
    .catch(function(e){ toast((e&&e.message)||"não deu para rolar"); });
}
/* ---------- DADOS ----------
   Quem sorteia e o servidor, e e ele quem decide quem ve: rolagem de jogador segue a regra
   da mesa (campanha.rolagensAbertas), a do mestre segue o que ele marcou na hora. A tela so
   anima ate o numero que voltou. */
var DADOS={hist:[],ult:0,pronto:false,pub:true,ov:null,t:null};
function rolaDado(l){ var a=new Uint32Array(1);
  try{ crypto.getRandomValues(a); }catch(e){ a[0]=Math.floor(Math.random()*4294967296); }
  return 1+(a[0]%l); }
function campAtual(){ return CAMPANHAS.filter(function(x){ return String(x.id)===String(CID); })[0]||{}; }
function rolagensAbertas(){ return campAtual().rolagensAbertas!==false; }
function zeraDados(){ DADOS.hist=[]; DADOS.ult=0; DADOS.pronto=false;
  try{ DADOS.pub=localStorage.getItem("grim_rolpub")!=="0"; }catch(e){ DADOS.pub=true; } }
function classeDado(r){ return r.extremo>0?"crit":r.extremo<0?"falha":""; }
function puxaRolagens(avisa){
  if(!CID)return Promise.resolve();
  var cid=CID;
  return api(cAPI("/rolagens?desde="+DADOS.ult)).then(function(l){
    if(cid!==CID||!l||!l.length){ DADOS.pronto=true; return; }
    var novas=l.filter(function(r){ return !DADOS.hist.some(function(h){ return h.id===r.id; }); });
    DADOS.hist=novas.concat(DADOS.hist).slice(0,40);
    l.forEach(function(r){ if(r.id>DADOS.ult)DADOS.ult=r.id; });
    /* a primeira leitura so marca onde a mesa esta: nao despeja rolagens antigas em aviso */
    if(DADOS.pronto)novas.slice().reverse().forEach(function(r){ if(r.minha)return;
      if(r.pedido){ avisaPedido(r); return; }
      if(avisa)avisaRolagem(r);
      if(r.publica)telaCritica(r.extremo); });
    DADOS.pronto=true;
    feedDados(novas);
  }).catch(function(){});
}
function avisaRolagem(r){
  $$(".toast.rol").forEach(function(x){ x.remove(); });
  var t=el("div",{"class":"toast rol"});
  t.innerHTML=d20Svg("")+'<span>'+esc(r.autor)+' rolou '+(r.rotulo?esc(r.rotulo)+' ('+esc(r.formula)+')':esc(r.formula))
    +': <b>'+r.valor+'</b>'+(r.publica?"":" · fechada")+'</span>';

   cadastros (elenco) e secoes livres. A conversao roda no cliente e NAO apaga os

var MIGROU=false;
function porNome(l,nome){ var k=norm(nome); return (l||[]).filter(function(x){return norm(x.nome)===k;})[0]||null; }
function normalizaSessao(s){
  if(!s||typeof s!=="object")return;
  if(!s.id)s.id=uid("s");
  if(!Array.isArray(s.territorios))s.territorios=[];
  if(!Array.isArray(s.cenas))s.cenas=[];
  s.cenas.forEach(function(c){ if(!c.id)c.id=uid("c"); if(!Array.isArray(c.blocos))c.blocos=[]; });
  if(!s.prep||typeof s.prep!=="object")s.prep={};
  ["terPronto","mecanicas"].forEach(function(k){ if(!Array.isArray(s.prep[k]))s.prep[k]=[]; });
  if(!s.eventosFixos||typeof s.eventosFixos!=="object")s.eventosFixos={};
  if(typeof s.eventosFixos.intro!=="string")s.eventosFixos.intro="";
  if(!Array.isArray(s.eventosFixos.lista))s.eventosFixos.lista=[];
  ["npcIds","localIds","pistaIds"].forEach(function(k){ if(!Array.isArray(s[k]))s[k]=[]; });
  ["plantado","resumo","titulo"].forEach(function(k){ if(typeof s[k]!=="string")s[k]=(s[k]==null?"":String(s[k])); });
}
function normalizaCampanha(){
  var c=D&&D.campanha; if(!c)return;
  ["titulo","sistema"].forEach(function(k){ if(typeof c[k]!=="string")c[k]=""; });
  if(!Array.isArray(c.indiceAS))c.indiceAS=[];
  if(!Array.isArray(c.referencia))c.referencia=[];
  if(!c.sinonimos||typeof c.sinonimos!=="object")c.sinonimos={};
  if(!c.canonicas||typeof c.canonicas!=="object")c.canonicas={};
  if(!Array.isArray(c.categoriasBusca))c.categoriasBusca=[];
  if(!c.vocab||typeof c.vocab!=="object")c.vocab={};
  if(!Array.isArray(D.sessoes))D.sessoes=[];
  if(!Array.isArray(D.trilhaCategorias))D.trilhaCategorias=[];
  if(!Array.isArray(D.galeria))D.galeria=[];
  if(!D.elenco||typeof D.elenco!=="object")D.elenco={};
  ["personagens","npcs","locais","pistas"].forEach(function(k){ if(!Array.isArray(D.elenco[k]))D.elenco[k]=[]; });
  if((Number(D.versao)||0)<3)migrarV3(c);
  if(typeof c.apresentacao!=="string")c.apresentacao="";
  if(!Array.isArray(c.secoes))c.secoes=[];
  c.secoes.forEach(function(s){ if(!s.id)s.id=uid("q"); if(!s.tipo)s.tipo="texto";
    if(!Array.isArray(s.itens))s.itens=[]; if(typeof s.texto!=="string")s.texto=""; if(typeof s.titulo!=="string")s.titulo=""; });
  D.elenco.personagens.forEach(function(p){ if(!Array.isArray(p.fichas))p.fichas=[]; });
  D.sessoes.forEach(normalizaSessao);
}
function migrarV3(c){
  var e=D.elenco;
  function txt(x){ return typeof x==="string"?x.trim():(x==null?"":String(x).trim()); }
  function lst(x){ return Array.isArray(x)?x.filter(function(y){return typeof y==="string"&&y.trim();}):[]; }
  if(c.conceitoTexto==null&&c.hexatombeTexto!=null)c.conceitoTexto=c.hexatombeTexto;
  if(c.regrasDeOuro==null&&c.hexatombeRegras!=null)c.regrasDeOuro=c.hexatombeRegras;

  (Array.isArray(c.corpos)?c.corpos:[]).forEach(function(p){ if(!p||typeof p!=="object")return;
    var notas=[];
    if(txt(p.dificuldade))notas.push("Dificuldade: "+txt(p.dificuldade));
    if(!txt(p.agente)&&txt(p.agenteNota)&&txt(p.agenteNota)!=="a definir")notas.push(txt(p.agenteNota));
    e.personagens.push({id:uid("p"),nome:txt(p.assassino),subtitulo:txt(p.alcunha),jogador:txt(p.agente),
      img:txt(p.pc),imgAlt:txt(p.mask),etiquetas:txt(p.termos),notas:notas.join("\n"),ref:txt(p.as),fichas:lst(p.fichas)}); });

  var sec=[];
  function poe(t,tipo,texto,itens){ if(!txt(texto)&&!(itens&&itens.length))return;
    sec.push({id:uid("q"),titulo:t,tipo:tipo,texto:txt(texto),itens:itens||[]}); }
  if(!txt(c.apresentacao))c.apresentacao=txt(c.verdadeIntro);
  poe("Sobre os "+V("personagens").toLowerCase(),"texto",c.sacrificio);
  var ps=(c.preSessao&&typeof c.preSessao==="object")?c.preSessao:{};
  poe(txt(ps.titulo)||("Antes da primeira "+V("sessao").toLowerCase()),"texto",
    [txt(ps.intro),txt(ps.textoAbertura)].filter(Boolean).join("\n\n"));
  poe(txt(ps.perguntasTitulo)||"Perguntas para a mesa","lista","",lst(ps.perguntas));
  poe(txt(ps.metodoTitulo)||"Como usar as respostas","lista","",lst(ps.metodo));
  var ad=(c.adaptacao&&typeof c.adaptacao==="object")?c.adaptacao:{};
  poe(txt(ad.titulo)||"Adaptações","lista","",lst(ad.itens));
  poe(txt(c.conceitoTitulo)||"O conceito","texto",c.conceitoTexto);
  poe(txt(c.regrasDeOuroTitulo)||"Regras de ouro","lista","",lst(c.regrasDeOuro));
  var met=(Array.isArray(c.metodo)?c.metodo:[]).filter(function(m){return m&&(txt(m.t)||txt(m.d));})
    .map(function(m){return {t:txt(m.t),d:txt(m.d)};});
  poe("Método de mesa","cartoes",c.metodoNota,met);
  c.secoes=(Array.isArray(c.secoes)?c.secoes:[]).concat(sec);

  /* o "mapa das sessoes" era uma lista a parte, ligada ao roteiro por numero digitado
     a mao. Agora a linha planejada e a propria sessao. */
  (Array.isArray(c.episodios)?c.episodios:[]).forEach(function(ep){ if(!ep||typeof ep!=="object")return;
    var n=Number(ep.n)||0, s=D.sessoes.filter(function(x){return x&&x.numero===n;})[0];
    if(!s){ if(txt(ep.nome)||txt(ep.resumo))novaSessao(n,txt(ep.nome),txt(ep.resumo)); }
    else if(!txt(s.resumo))s.resumo=txt(ep.resumo); });

  /* NPC, local e evidencia moravam dentro de cada sessao. Sobem para o elenco,
     sem duplicar por nome, e a sessao passa a apontar para eles. */
  D.sessoes.forEach(function(s){ if(!s||typeof s!=="object")return;
    function sobe(arr,dest,pre,mk){ var ids=[];
      (Array.isArray(arr)?arr:[]).forEach(function(x){ if(!x||!txt(x.nome))return;
        var a=porNome(dest,x.nome); if(!a){ a=mk(x); a.id=uid(pre); dest.push(a); }
        if(ids.indexOf(a.id)<0)ids.push(a.id); });
      return ids; }
    s.npcIds=sobe(s.npcs,e.npcs,"n",function(x){return {nome:txt(x.nome),img:txt(x.img),desc:txt(x.desc),segredo:txt(x.segredo)};});
    s.localIds=sobe(s.locais,e.locais,"l",function(x){return {nome:txt(x.nome),img:txt(x.img),desc:txt(x.desc)};});
    s.pistaIds=sobe(s.handouts,e.pistas,"k",function(x){return {nome:txt(x.nome),img:txt(x.img),texto:txt(x.texto)};});
  });
  D.versao=3; MIGROU=true;
}

      {k:"n",rot:"Rótulo curto",ph:"ex.: Cena 3, Abertura",dica:"Aparece no card do quadro e na lista."},

      {k:"forcado",rot:"Obrigatória: acontece de qualquer jeito",tipo:"check"}],

      {k:"nome",rot:"Nome",obrig:true,ph:"um lugar, um ato, um grupo de cenas"},
      {k:"cor",rot:"Cor",tipo:"sel",ops:ops}],

/* ---------- CANVAS ---------- */
var CV={z:.62,x:10,y:10,init:false};
/* quanto a raiz cresceu em relacao aos 16px: o quadro e desenhado em px e compensa no zoom */
function escalaRaiz(){ return (parseFloat(getComputedStyle(document.documentElement).fontSize)||16)/16; }
function initCanvas(s){
  var wrap=$("#cvwrap"),cv=$("#cv"),svg=$("#cvsvg"); if(!wrap)return;
  function apply(){ var tr="translate("+CV.x+"px,"+CV.y+"px) scale("+CV.z+")";
    cv.style.transform=tr; svg.style.transform=tr; }
  function links(){ var ps=s.territorios.map(function(t,i){var p=tpos(s,i);return {x:p.x+122,y:p.y+40};}),d="";
    for(var i=0;i<ps.length-1;i++){ var A=ps[i],B=ps[i+1],mx=(A.x+B.x)/2;
      d+='<path d="M'+A.x+' '+A.y+' C '+mx+' '+A.y+', '+mx+' '+B.y+', '+B.x+' '+B.y+'" fill="none" stroke="#48313a" stroke-width="1.4" stroke-dasharray="5 6"/>'; }
    svg.innerHTML=d; }
  links(); apply();
  var drag=null, supClick=false, linha=null;
  function limparLinha(){ if(linha&&linha.parentNode)linha.parentNode.removeChild(linha); }
  function marcarAlvo(x,y){
    if(!linha){ linha=document.createElement("div"); linha.className="dropline"; }
    var sob=document.elementFromPoint(x,y);
    var terr=(sob&&sob.closest)?sob.closest(".terr"):null;
    if(!terr){ limparLinha(); drag.alvo=null; return; }
    var cards=Array.prototype.slice.call(terr.querySelectorAll(".card")).filter(function(n){return n!==drag.node;});
    var k=cards.length;
    for(var i=0;i<cards.length;i++){ var r=cards[i].getBoundingClientRect();
      if(y<r.top+r.height/2){ k=i; break; } }
    drag.alvo={terr:terr.getAttribute("data-terr"),k:k};
    if(k<cards.length)terr.insertBefore(linha,cards[k]);
    else { var ar=terr.querySelector(".addrow"); if(ar)terr.insertBefore(linha,ar); else terr.appendChild(linha); }
  }
  wrap.addEventListener("pointerdown",function(e){
    if(e.target.closest(".railfloat")||e.target.closest(".cvtools"))return;
    if(e.target.isContentEditable)return;
    if(e.target.closest("button")||e.target.closest("select")||e.target.closest("input"))return;
    var card=e.target.closest(".card");
    var t=e.target.closest(".terr");
    if(card){
      drag={m:"c",node:card,id:card.getAttribute("data-scn"),sx:e.clientX,sy:e.clientY,moved:false,alvo:null};
      return; }
    if(t&&!card){
      var id=t.getAttribute("data-terr"),k=s.territorios.map(function(x){return x.id;}).indexOf(id);
      if(k>=0){ var tp=tpos(s,k);
        drag={m:"t",k:k,sx:e.clientX,sy:e.clientY,ox:tp.x,oy:tp.y,node:t,moved:false};
        e.preventDefault();
        try{wrap.setPointerCapture(e.pointerId);}catch(err){}
        return; } }
    drag={m:"p",sx:e.clientX,sy:e.clientY,ox:CV.x,oy:CV.y,lim:!!card,moved:false};
    if(!card){ e.preventDefault(); try{wrap.setPointerCapture(e.pointerId);}catch(err){} }
  });
  wrap.addEventListener("pointermove",function(e){ if(!drag)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(drag.m==="c"){
      if(!drag.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        drag.moved=true; e.preventDefault();
        try{wrap.setPointerCapture(e.pointerId);}catch(err){}
        drag.node.classList.add("dragging"); drag.node.style.pointerEvents="none";
      }
      drag.node.style.transform="translate("+(dx/CV.z)+"px,"+(dy/CV.z)+"px)";
      marcarAlvo(e.clientX,e.clientY); return; }
    if(drag.m==="p"){
      if(drag.lim&&!drag.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        drag.moved=true; try{wrap.setPointerCapture(e.pointerId);}catch(err){} }
      CV.x=drag.ox+dx; CV.y=drag.oy+dy; apply(); }
    else { if(!drag.moved&&Math.abs(dx)<4&&Math.abs(dy)<4)return;
      drag.moved=true;
      var t=s.territorios[drag.k]; t.x=Math.round(drag.ox+dx/CV.z); t.y=Math.round(drag.oy+dy/CV.z);
      drag.node.style.left=t.x+"px"; drag.node.style.top=t.y+"px"; links(); } });
  wrap.addEventListener("pointerup",function(e){
    if(drag&&drag.m==="c"){
      drag.node.classList.remove("dragging"); drag.node.style.transform=""; drag.node.style.pointerEvents="";
      limparLinha();
      if(drag.moved){ supClick=true; setTimeout(function(){supClick=false;},60);
        if(drag.alvo)moverCena(s,drag.id,drag.alvo.terr,drag.alvo.k); }
    } else if(drag&&drag.m==="t"){ if(drag.moved)save(); }
    else if(drag&&drag.m==="p"&&drag.lim&&drag.moved){ supClick=true; setTimeout(function(){supClick=false;},60); }
    drag=null;
    try{wrap.releasePointerCapture(e.pointerId);}catch(err){} });
  wrap.addEventListener("pointercancel",function(){ if(drag&&drag.m==="c"){
      drag.node.classList.remove("dragging"); drag.node.style.transform=""; drag.node.style.pointerEvents=""; limparLinha(); }
    drag=null; });
  wrap.addEventListener("wheel",function(e){
    if(e.target.closest&&(e.target.closest(".railfloat")||e.target.closest(".cvtools")))return;
    e.preventDefault();
    var r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    var nz=Math.min(2.2*escalaRaiz(),Math.max(.22,CV.z*(e.deltaY<0?1.12:.89)));
    CV.x=mx-(mx-CV.x)*(nz/CV.z); CV.y=my-(my-CV.y)*(nz/CV.z); CV.z=nz; apply(); },{passive:false});
  $$("[data-z]",wrap).forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-z");
    if(k==="+")CV.z=Math.min(2.2*escalaRaiz(),CV.z*1.2); else if(k==="-")CV.z=Math.max(.22,CV.z/1.2);
    else enquadrar(); apply(); }; });
  function enquadrar(){
    var maxX=0,maxY=0;
    $$(".terr",cv).forEach(function(t){ maxX=Math.max(maxX,t.offsetLeft+t.offsetWidth); maxY=Math.max(maxY,t.offsetTop+t.offsetHeight); });
    var r=wrap.getBoundingClientRect(), pad=20;
    /* o painel pode estar em qualquer canto: desconta do lado em que ele esta */
    var rf=$("#railFloat"), rw=0, rr=0;
    if(rf&&!rf.hidden){ if(rf.offsetLeft+rf.offsetWidth/2<r.width/2)rw=rf.offsetLeft+rf.offsetWidth+16-pad;
      else rr=r.width-rf.offsetLeft+16-pad; }
    var av=Math.max(240,r.width-pad*2-rw-rr), ah=Math.max(200,r.height-pad*2);
    CV.z=Math.max(.16,Math.min(1.6*escalaRaiz(),Math.min(av/(maxX||1),ah/(maxY||1))));
    CV.x=pad+rw+Math.max(0,(av-(maxX||0)*CV.z)/2);
    CV.y=pad+Math.max(0,(ah-(maxY||0)*CV.z)/2);
    apply();
  }
  CV.fit=enquadrar;
  if(!CV.init){ CV.init=true; setTimeout(enquadrar,30); }
  $$(".card",cv).forEach(function(card){ card.addEventListener("click",function(e){
    if(supClick)return;
    if(e.target.closest("[data-act]"))return; abrirCenaModal(card.getAttribute("data-scn")); }); });
  painelMovel(wrap);
  var rb=$("#railBtn"); if(rb)rb.onclick=function(){ S.rail=!S.rail; $("#railFloat").hidden=!S.rail; rb.classList.toggle("on",S.rail); if(CV.fit)CV.fit(); };
}

/* Posicao e tamanho do painel do quadro. Fica no navegador (conveniencia de quem usa,
   nao dado da campanha), em px relativos ao quadro. */
function painelMovel(wrap){
  var rf=$("#railFloat"), hd=$("#rfHd"), gp=$("#rfGrip"); if(!rf||!hd||!gp)return;
  function ler(){ try{ return JSON.parse(localStorage.getItem("grim_painel")||"null"); }catch(e){ return null; } }
  function gravar(g){ try{ if(g)localStorage.setItem("grim_painel",JSON.stringify(g)); else localStorage.removeItem("grim_painel"); }catch(e){} }
  function aplicar(g){
    if(!g){ rf.style.left=rf.style.top=rf.style.width=rf.style.height=rf.style.bottom=""; return; }
    var W=wrap.clientWidth, H=wrap.clientHeight;
    var w=Math.max(200,Math.min(g.w,W-8)), h=Math.max(140,Math.min(g.h,H-8));
    rf.style.width=w+"px"; rf.style.height=h+"px"; rf.style.bottom="auto";
    rf.style.left=Math.max(0,Math.min(g.x,W-w))+"px"; rf.style.top=Math.max(0,Math.min(g.y,H-h))+"px";
  }
  function atual(){ return {x:rf.offsetLeft,y:rf.offsetTop,w:rf.offsetWidth,h:rf.offsetHeight}; }
  aplicar(ler());
  function arrastar(el,muda){
    el.addEventListener("pointerdown",function(e){
      if(e.button!==0)return;
      e.preventDefault(); e.stopPropagation();
      var g0=atual(), sx=e.clientX, sy=e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      function mv(ev){ aplicar(muda(g0,ev.clientX-sx,ev.clientY-sy)); }
      function up(){ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up);
        el.removeEventListener("pointercancel",up); gravar(atual()); if(CV.fit)CV.fit(); }
      el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
    });
  }
  arrastar(hd,function(g,dx,dy){ return {x:g.x+dx,y:g.y+dy,w:g.w,h:g.h}; });
  arrastar(gp,function(g,dx,dy){ return {x:g.x,y:g.y,w:g.w+dx,h:g.h+dy}; });
  hd.addEventListener("dblclick",function(){ gravar(null); aplicar(null); if(CV.fit)CV.fit(); });
}

/* Indice dos livros: atalhos para paginas do PDF, escritos como linhas de texto.
   Sem prefixo e um grupo; "-" e um item do grupo; "--" e um subitem. */
function indiceParaLinhas(d){ var l=[];
  function ln(pre,o){ l.push(pre+o.t+(o.p?" | "+o.p:"")); }
  (d.grupos||[]).forEach(function(g){ ln("",g);

/* ---------- ESCOLHER IMAGEM ---------- */
/* Devolve o caminho relativo ("img/x.webp"), "" para tirar a imagem, ou null
   se a pessoa fechou sem escolher. Guardamos o caminho relativo e nao a URL:
   e isso que o IMG() sabe resolver, e e isso que o pacote carrega. */
function escolherImagem(atual){
  return new Promise(function(res){
    var escolhido=null, resolvido=false;
    var ov=overlay("Escolher imagem",
      '<p class="sm muted" style="margin:0 0 .625rem">As imagens da '+esc(V("campanha").toLowerCase())
        +'. Envie uma nova se a que você quer ainda não está aqui.</p>'
      +'<div id="eiList"><p class="muted sm">carregando…</p></div>'
      +'<div class="addrow" style="margin-top:.875rem">'
      +'<button class="btn" id="eiUp">Enviar imagem nova</button>'
      +'<button class="btn sec" id="eiClr">Deixar sem imagem</button></div>',
      {wide:true});
    var fechar=ov.close;
    ov.close=function(){ if(!resolvido){ resolvido=true; res(escolhido); } fechar(); };
    function pinta(figs){
      var alvo=$("#eiList",ov);
      if(!figs.length){ alvo.innerHTML='<p class="empty">Nenhuma imagem nesta '+esc(V("campanha").toLowerCase())+' ainda.</p>'; return; }
      alvo.innerHTML='<div class="eigrid">'+figs.map(function(x){
        var rel=x.arquivo||("img/"+x.nome);
        return '<button type="button" data-pick="'+esc(rel)+'"'+(rel===atual?' class="on"':'')+'>'
          +'<img src="'+esc(x.url)+'" alt="" loading="lazy">'
          +'<span class="cap">'+esc(x.nome)+'</span></button>';
      }).join("")+'</div>';
      $$("[data-pick]",ov).forEach(function(b){ b.onclick=function(){
        escolhido=b.getAttribute("data-pick"); ov.close();
      };});
    }
    function carrega(){
      api(cAPI("/midia")).then(function(c){ pinta((c&&c.imagens)||[]); })
        .catch(function(e){ $("#eiList",ov).innerHTML='<p class="empty">'+esc((e&&e.message)||"não deu para listar")+'</p>'; });
    }
    carrega();
    $("#eiClr",ov).onclick=function(){ escolhido=""; ov.close(); };
    $("#eiUp",ov).onclick=function(){
      escolherArquivos(false,"image/*").then(function(fs){
        if(!fs.length)return;
        var b=$("#eiUp",ov); b.disabled=true; b.textContent="Enviando…";
        var ultimo=null;
        fs.reduce(function(fila,f){
          return fila.then(function(){ return subirImagem(f).then(function(r){ ultimo=r&&r.arquivo; }); });
        },Promise.resolve()).then(function(){
          b.disabled=false; b.textContent="Enviar imagem nova";
          recarregaCatalogo();
          if(fs.length===1&&ultimo){ escolhido=ultimo; ov.close(); return; }
          carrega(); toast(fs.length+" imagens enviadas");
        }).catch(function(e){
          b.disabled=false; b.textContent="Enviar imagem nova";
          toast((e&&e.message)||"não deu para enviar");
        });
      });
    };
  });
}
function subirImagem(f){
  var fd=new FormData();
  fd.append("nome",f.name.replace(/\.[^.]+$/,""));
  fd.append("arquivo",f);
  return upload(cAPI("/midia/img"),fd);
}

/* ---------- OVERLAY ---------- */
/* Quem fecha uma janela conta com ela fora do DOM na hora (o Voltar testa isso), entao a de
   verdade sai de uma vez e quem some devagar e uma copia inerte, sem id e sem clique. */
var OVT=0;
function fantasma(ov){
  OVT=Date.now(); som("fecha");
  var f=$("#fantasmas");
  if(!f||!fxLigado()||ov.querySelector("canvas,iframe,audio,video"))return;
  var g=ov.cloneNode(true), a=$$(".sbodyscroll",ov);
  g.className="ovg"; g.inert=true;
  $$("[id]",g).forEach(function(x){ x.removeAttribute("id"); });
  f.appendChild(g);
  $$(".sbodyscroll",g).forEach(function(x,i){ if(a[i])x.scrollTop=a[i].scrollTop; });
  setTimeout(function(){ g.remove(); },220);
}
function overlay(title,body,o){ o=o||{};
  var ov=el("div",{"class":"ov"+(o.ovcls?" "+o.ovcls:"")});
  /* janela que abre no lugar de outra que acabou de fechar (Voltar, trocar de ficha) nao
     repete a entrada: seria uma piscada a cada passo */
  if(Date.now()-OVT<80){ ov.classList.add("seco"); var fz=$("#fantasmas"); if(fz)fz.innerHTML=""; } else som("abre");
  ov.innerHTML='<div class="sheet'+(o.wide?" wide":"")+(o.cls?" "+o.cls:"")+'">'
    +'<div class="shead">'+(o.back?'<button class="backb" data-back>‹ Voltar</button>':"")
    +'<h3>'+esc(title)+'</h3>'+(o.head||"")+'<button class="x" aria-label="Fechar">✕</button></div>'
    +'<div class="sbodyscroll">'+body+'</div></div>';
  function close(){ if(document.body.contains(ov))fantasma(ov); ov.remove(); document.removeEventListener("keydown",k); }
  /* com janelas empilhadas (formulario + seletor de imagem), Esc fecha so a de cima.
     Quem chama pode trocar ov.close; por isso X, Esc e fundo passam sempre por ele. */
  function k(e){ if(e.key!=="Escape")return;

var PDFC={};
async function carregaPdf(ab){ if(PDFC[ab])return PDFC[ab];

  var d=LIB.docs[ab]; if(!d)return null;

async function abrirPdf(ab,page,back){
  ab=String(ab||"").toUpperCase();
  await carregaCatalogo();
  if(!LIB.docs[ab]){ var o0=overlay("Abrir documento",
      '<div class="libbox"><p>O PDF de <b>'+esc(nomeDoc(ab))+'</b> ainda não está no servidor.</p>'
      +(GM?'<button class="btn" id="lc2">Enviar arquivos</button>'
          :'<p class="sm muted">Fala com o mestre para ele subir esse livro.</p>')+'</div>',{back:back});
    var b0=$("#lc2",o0); if(b0)b0.onclick=function(){ o0.close(); abrirArquivos(); }; return; }
  if(!window.pdfjsLib){ toast("Visor de PDF indisponível"); return; }
  var ov=overlay(nomeDoc(ab),'<div class="pdfwrap"><div class="pdfbar">'
    +'<span class="pnum">Página <input id="pNum" type="number" min="1" value="'+(page||1)+'"> de <b id="pTot">?</b></span>'
    +'<button class="btn sec" id="pOut">−</button><button class="btn sec" id="pIn">+</button>'
    +'<button class="btn sec" id="pFs">Tela cheia</button>'
    +'<button class="btn sec" id="pFit">Ajustar</button>'
    +'<button class="btn sec" id="pTxt">Texto da página</button>'
    +'<span class="muted sm">setas ou scroll mudam de página</span></div>'
    +'<div class="pdfstage"><button class="pdfnav l" id="pPrev" aria-label="Anterior">‹</button>'
    +'<div class="pdfcanvas" id="pCanvas"><p class="empty">Abrindo o PDF…</p></div>'
    +'<button class="pdfnav r" id="pNext" aria-label="Próxima">›</button></div></div>',
    {wide:true,cls:"pdfsheet",ovcls:"pdfov",back:back});
  var sheet=ov.querySelector(".sheet");
  var st={p:page||1,z:1,pdf:null,busy:false};
  try{ st.pdf=await carregaPdf(ab); }catch(e){ $("#pCanvas",ov).innerHTML='<p class="empty">Falha ao abrir o PDF.</p>'; return; }
  if(!st.pdf)return;
  ov.querySelector("h3").textContent=st.pdf.nome;
  $("#pTot",ov).textContent=st.pdf.doc.numPages;
  async function draw(dir){
    if(st.busy)return; st.busy=true;
    st.p=Math.max(1,Math.min(st.pdf.doc.numPages,st.p));
    $("#pNum",ov).value=st.p;
    try{
      var pg=await st.pdf.doc.getPage(st.p), box=$("#pCanvas",ov);
      /* o padding cresce com a raiz: descontar um numero fixo deixava a pagina 4px maior que a
         caixa no ultrawide, e isso acendia a barra de rolagem */
      var cs=getComputedStyle(box);
      var w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2,
          h=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2;
      var v1=pg.getViewport({scale:1});
      var fit=Math.min((w>80?w:900)/v1.width,(h>80?h:1200)/v1.height);
      var vp=pg.getViewport({scale:Math.max(.2,fit*st.z)});
      var dpr=Math.min(2,window.devicePixelRatio||1);
      var cv=document.createElement("canvas");
      cv.width=Math.round(vp.width*dpr); cv.height=Math.round(vp.height*dpr);
      cv.style.width=Math.round(vp.width)+"px"; cv.style.height=Math.round(vp.height)+"px";
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
      var velho=$("canvas:not(.sai)",box);
      if(dir&&velho&&fxLigado()){
        /* a velha fica na mesma celula ate a animacao do tema acabar; zoom e resize passam sem dir */
        $$("canvas.sai",box).forEach(function(x){ x.remove(); });
        velho.className="sai"; cv.className="vem";
        box.classList.add("virando"); box.setAttribute("data-dir",dir>0?"f":"b");
        box.style.setProperty("--dir",dir>0?1:-1);
        box.appendChild(cv);
        clearTimeout(st.vt);
        st.vt=setTimeout(function(){ $$("canvas.sai",box).forEach(function(x){ x.remove(); });
          $$("canvas.vem",box).forEach(function(x){ x.className=""; }); box.classList.remove("virando"); },650);
      } else { box.innerHTML=""; box.appendChild(cv); box.classList.remove("virando"); }
    }catch(e){}
    st.busy=false;
  }
  function vai(d){ var n=Math.max(1,Math.min(st.pdf.doc.numPages,st.p+d)); if(n===st.p)return; st.p=n; som("pagina"); draw(d); }
  $("#pPrev",ov).onclick=function(){vai(-1);};
  $("#pNext",ov).onclick=function(){vai(1);};
  $("#pNum",ov).onchange=function(){ var a=st.p; st.p=+$("#pNum",ov).value; draw(st.p>a?1:st.p<a?-1:0); };
  $("#pIn",ov).onclick=function(){st.z=Math.min(4,st.z*1.18);draw();};
  $("#pFit",ov).onclick=function(){st.z=1;draw();};
  var pt=$("#pTxt",ov); if(pt)pt.onclick=function(){ var n2=st.p; ov.close(); abrirPagina(ab,n2,"",back); };
  $("#pOut",ov).onclick=function(){st.z=Math.max(.4,st.z/1.18);draw();};
  $("#pFs",ov).onclick=function(){
    if(document.fullscreenElement){document.exitFullscreen();sheet.classList.remove("fs");}
    else{ var r=sheet.requestFullscreen&&sheet.requestFullscreen();
      sheet.classList.add("fs"); if(r&&r.catch)r.catch(function(){toast("Tela cheia não permitida aqui");});
      setTimeout(draw,220); } };
  document.addEventListener("fullscreenchange",function(){ if(!document.fullscreenElement)sheet.classList.remove("fs"); setTimeout(draw,180); });
  var kh=function(e){ if(!document.body.contains(ov))return;
    if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();vai(1);}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();vai(-1);} };
  document.addEventListener("keydown",kh);
  var acc=0;
  $("#pCanvas",ov).addEventListener("wheel",function(e){
    if(e.ctrlKey)return; e.preventDefault(); acc+=e.deltaY;
    if(Math.abs(acc)>120){ vai(acc>0?1:-1); acc=0; } },{passive:false});
  var rt=null, rz=function(){ clearTimeout(rt); rt=setTimeout(draw,160); };
  window.addEventListener("resize",rz);
  var mo=new MutationObserver(function(){ if(!document.body.contains(ov)){
    document.removeEventListener("keydown",kh); window.removeEventListener("resize",rz); mo.disconnect();} });
  mo.observe($("#layer"),{childList:true});
  setTimeout(draw,60);
}

/* ---------- indice de busca: tokens + fallback ---------- */
var IDXN=null;
function invalidaIndice(){ IDXN=null; }
function prepararIndice(){
  if(IDXN||!IDX||!IDX.pages)return IDXN;
  var pg=[],sq=[],tok={},i,j;
  for(i=0;i<IDX.pages.length;i++){
    var t=norm(IDX.pages[i].t||"");
    pg.push(t); sq.push(t.replace(/[^a-z0-9]+/g,""));
    var ws=t.split(/[^a-z0-9]+/), vis={};
    for(j=0;j<ws.length;j++){ var w=ws[j];
      if(w.length<2||vis[w])continue; vis[w]=1;
      (tok[w]||(tok[w]=[])).push(i); }
  }
  IDXN={pg:pg,sq:sq,tok:tok,keys:Object.keys(tok)};
  return IDXN;
}
function defineTermo(txt,t){
  try{ return new RegExp("(^|[.\\n;:»])\\s*"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[.:•]\\s+[a-zà-ÿA-Z(\"]","i").test(txt); }catch(e){ return false; }
}
function buscaDocs(q,fd,fc){
  if(!IDX||!IDX.pages||!IDX.pages.length)return [];
  var N=prepararIndice(); if(!N)return [];
  var k=norm(q).trim(); if(k.length<2)return [];
  var termos=k.split(/\s+/).filter(function(x){return x.length>=2;});
  if(!termos.length)return [];
  var cat=catsBusca().filter(function(c){return c.id===fc;})[0], ab={};
  IDX.docs.forEach(function(d){ab[d.id]=d.abrev;});

  var SIN=(PUBD().sinonimos||{});
  function mapaDe(t,peso){
    var m={},w,key;
    if(N.tok[t])N.tok[t].forEach(function(i){ m[i]=peso; });
    if(t.length>=4){
      for(w=0;w<N.keys.length;w++){ key=N.keys[w];
        if(key.length>t.length&&key.indexOf(t)===0)
          N.tok[key].forEach(function(i){ if(!m[i])m[i]=Math.round(peso*0.65); }); }
    }
    if(!Object.keys(m).length){
      var sqt=t.replace(/[^a-z0-9]+/g,"");
      if(sqt.length>=4)for(w=0;w<N.sq.length;w++) if(N.sq[w].indexOf(sqt)>=0)m[w]=Math.round(peso*0.35);
    }
    return m;
  }
  var alt=SIN[k]||null;
  var frases=[]; if(termos.length>1)frases.push(termos.join(" "));
  (alt||[]).forEach(function(sy){ var f=norm(sy); if(f.indexOf(" ")>0)frases.push(f); });
  termos.forEach(function(t){ (SIN[t]||[]).forEach(function(sy){ var f=norm(sy); if(f.indexOf(" ")>0&&frases.indexOf(f)<0)frases.push(f); }); });
  var mapas=termos.map(function(t){
    var m=mapaDe(t,t.length<=3?8:14);
    var ex=(alt&&termos.length===1)?alt:(SIN[t]||[]);
    ex.forEach(function(sy){
      var sub=norm(sy).split(/\s+/), mm=null;
      sub.forEach(function(st){ var x=mapaDe(st,7);
        if(mm===null)mm=x; else { var u={}; Object.keys(x).forEach(function(i){ if(mm[i]!=null)u[i]=Math.min(mm[i],x[i]); }); mm=u; } });
      if(mm)Object.keys(mm).forEach(function(i){ if(m[i]==null)m[i]=mm[i]; });
    });
    return m;
  });

  var base=Object.keys(mapas[0]), out=[];
  base.forEach(function(ix){
    var i=+ix, sc=0, ok=true;
    for(var z=0;z<mapas.length;z++){ if(mapas[z][i]==null){ok=false;break;} sc+=mapas[z][i]; }
    if(!ok)return;
    var pgo=IDX.pages[i];
    if(fd&&fd!=="todos"&&pgo.d!==fd)return;
    var txt=N.pg[i], sec=norm(pgo.s||"");
    /* indice extraido pelo servidor nao tem titulo de secao: o comeco da pagina faz as vezes */
    if(cat&&cat.termos&&!cat.termos.some(function(t){return sec.indexOf(t)>=0||txt.slice(0,260).indexOf(t)>=0;}))return;
    var emTit=0; termos.forEach(function(t){ if(sec.indexOf(t)>=0)emTit++; });
    if(emTit===termos.length)sc+=70; else if(emTit)sc+=32;
    var pos=txt.indexOf(termos[0]);
    if(pos>=0&&pos<320)sc+=20;
    else if(pos>=0&&txt.length&&pos<txt.length*0.15)sc+=10;
    var n=0,pp=txt.indexOf(termos[0]);
    while(pp>=0&&n<6){n++;pp=txt.indexOf(termos[0],pp+termos[0].length);}
    sc+=Math.min(4,n-1)*2;
    if(defineTermo(txt,termos[0]))sc+=70;
    var fr=0;
    for(var fi=0;fi<frases.length;fi++){ var fp=txt.indexOf(frases[fi]);
      if(fp>=0){ fr=Math.max(fr,55); if(fp<320)fr=Math.max(fr,75); if(defineTermo(txt,frases[fi]))fr=Math.max(fr,95); } }
    sc+=fr;
    if(!fr&&termos.length>1){
      var a=txt.indexOf(termos[0]), b2=txt.indexOf(termos[1]);
      if(a>=0&&b2>=0&&Math.abs(a-b2)<120)sc+=20;
    }
    if(/indice remissivo|sumario|creditos|folha de rosto|sobrecapa/.test(sec))sc-=120;
    out.push({sc:sc,i:i,d:pgo.d,p:pgo.p,s:pgo.s,sn:trecho(pgo.t,termos[0])||String(pgo.t||"").replace(/\s+/g," ").slice(0,150),ab:ab[pgo.d]||pgo.d});
  });
  out.sort(function(a,b){return b.sc-a.sc;});

  var CAN=(PUBD().canonicas||{}), fix=CAN[k];
  if(fix&&fix.length){
    var pin=[],vistos={};
    fix.forEach(function(e){
      var abv=String(e[0]).toUpperCase(), num=e[1], rot=e[2]||"";
      if(fd&&fd!=="todos"&&String(ab[fd]||"").toUpperCase()!==abv)return;
      for(var i=0;i<IDX.pages.length;i++){ var pgo=IDX.pages[i];
        if(pgo.p!==num)continue;
        if(String(ab[pgo.d]||pgo.d).toUpperCase()!==abv)continue;
        var ch=abv+":"+num; if(vistos[ch])return; vistos[ch]=1;
        pin.push({sc:9999,i:i,d:pgo.d,p:num,s:rot||pgo.s,ab:abv,canon:true,
          sn:trecho(pgo.t,termos[0])||String(pgo.t||"").replace(/\s+/g," ").slice(0,150)});
        return; }
    });
    if(pin.length){
      var fora={}; pin.forEach(function(x){fora[x.ab+":"+x.p]=1;});
      out=pin.concat(out.filter(function(x){return !fora[x.ab+":"+x.p];}));
    }
  }
  return out.slice(0,50);
}

function upload(url,fd,onProg,repetido){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open("POST",url,true); x.withCredentials=true;
    var t=cookie("XSRF-TOKEN"); if(t)x.setRequestHeader("X-XSRF-TOKEN",t);
    if(x.upload)x.upload.onprogress=function(e){ if(e.lengthComputable&&onProg)onProg(e.loaded/e.total); };
    x.onload=function(){ var b=null; try{ b=JSON.parse(x.responseText); }catch(e){}
      if(x.status>=200&&x.status<300)res(b||{});
      else if(x.status===403&&b&&b.codigo==="csrf"&&!repetido){
        renovaCsrf().then(function(){ return upload(url,fd,onProg,true); }).then(res,rej); }
      else { if(x.status===507)avisoArmazenamento();
        var er=new Error((b&&b.erro)||("HTTP "+x.status)); er.status=x.status; rej(er); } };
    x.onerror=function(){ rej(new Error("falha de rede")); };
    x.ontimeout=function(){ rej(new Error("tempo esgotado")); };
    x.send(fd);
  });
}
function mb(n){ n=+n||0; if(n<1024)return n+" B";
  if(n<1048576)return (n/1024).toFixed(0)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(1)+" MB";
  return (n/1073741824).toFixed(2)+" GB"; }
function abrevDe(nome){
  var base=nome.replace(/\.pdf$/i,"");
  var ab=norm(base).replace(/[^a-z0-9 ]+/g," ").trim().split(/\s+/)
    .map(function(w){return /^\d+$/.test(w)?w:w[0];}).join("").toUpperCase().slice(0,8)||"DOC";
  return {ab:ab,nome:base};
}
function escolherArquivos(pasta,aceita){
  return new Promise(function(res){
    var inp=el("input",{type:"file"});
    if(pasta)inp.webkitdirectory=true; else inp.multiple=true;
    if(aceita)inp.accept=aceita;
    inp.style.display="none"; document.body.appendChild(inp);
    inp.onchange=function(){ var fs=Array.prototype.slice.call(inp.files||[]); inp.remove(); res(fs); };
    inp.click();
  });
}

function abrirReferencia(back,mk){
  if(!GM){ toast("Só o mestre"); return; }
  var ref=JSON.parse(JSON.stringify(PUBD().referencia||[]));
  function corpo(){
    return ref.map(function(g,i){
      return '<div class="fld"><span class="flb">Grupo '+(i+1)+'</span>'
        +'<div class="addrow"><input class="inp" data-rt="'+i+'" placeholder="título do grupo" value="'+esc(g.t||"")+'">'
        +'<button class="tbtn d" data-rdel="'+i+'">remover</button></div>'
        +'<textarea class="inp" data-ri="'+i+'" rows="5" style="width:100%;margin-top:.375rem" '
        +'placeholder="uma linha por item">'+esc((g.itens||[]).join("\n"))+'</textarea></div>'; }).join("")
      +'<div class="addrow"><button class="btn sec" id="rfAdd">Adicionar grupo</button>'
      +'<button class="btn" id="rfGo">Salvar</button></div>';
  }
  var ov=(mk||overlay)(Vm("referencia"),
    '<p class="lead">O resumo de regras que fica na aba '+esc(Vm("mesa"))
    +', visível para os jogadores. Nada aqui vem pronto: é a sua mesa que escreve.</p>'
    +'<div id="rfBody">'+corpo()+'</div>',{wide:true,back:back});
  function colher(){
    $$("[data-rt]",ov).forEach(function(i){ ref[+i.getAttribute("data-rt")].t=i.value; });
    $$("[data-ri]",ov).forEach(function(t){
      ref[+t.getAttribute("data-ri")].itens=(t.value||"").split("\n")
        .map(function(x){return x.trim();}).filter(Boolean); });
  }
  function ligar(){
    $("#rfAdd",ov).onclick=function(){ colher(); ref.push({t:"Novo grupo",itens:[]});
      $("#rfBody",ov).innerHTML=corpo(); ligar(); };
    $("#rfGo",ov).onclick=function(){ colher();
      D.campanha.referencia=ref.filter(function(g){return (g.t||"").trim()||(g.itens||[]).length;});
      save(); salvarMesa(); ov.close(); render(); toast("Consulta rápida salva"); };
    $$("[data-rdel]",ov).forEach(function(b){ b.onclick=function(){ colher();
      ref.splice(+b.getAttribute("data-rdel"),1); $("#rfBody",ov).innerHTML=corpo(); ligar(); }; });
  }
  ligar();
}

   A copia e achada pelo id; as liberadas antes da v3 so tem nome. */
function snapDe(tp,x){
  return tp==="pistas"?{id:x.id,nome:x.nome,img:x.img||"",texto:x.texto||""}
                      :{id:x.id,nome:x.nome,img:x.img||"",desc:x.desc||""};

function achaLib(tp,x){ var l=MESA[EL[tp].lib]||[];
  for(var i=0;i<l.length;i++){ if(l[i].id?l[i].id===x.id:l[i].nome===x.nome)return i; }
  return -1; }
function jaLib(tp,x){ return !!(x&&EL[tp]&&EL[tp].lib)&&achaLib(tp,x)>=0; }
function liberar(tp,x){ var k=EL[tp].lib; MESA[k]=MESA[k]||[];
  var i=achaLib(tp,x); if(i>=0)MESA[k][i]=snapDe(tp,x); else MESA[k].push(snapDe(tp,x)); }
function tirar(tp,x){ var i=achaLib(tp,x); if(i>=0)MESA[EL[tp].lib].splice(i,1); }
function alternaLib(tp,x){ var on=jaLib(tp,x); if(on)tirar(tp,x); else liberar(tp,x); salvarMesa(); return !on; }

function sincLib(tp,x){ if(jaLib(tp,x)){ liberar(tp,x); salvarMesa(); } }

/* data do resumo: dd/mm/aaaa, com mascara enquanto digita e conferida ao salvar */
function mascaraData(inp){
  inp.setAttribute("inputmode","numeric"); inp.setAttribute("maxlength","10"); inp.setAttribute("autocomplete","off");
  inp.addEventListener("input",function(){
    var d=inp.value.replace(/\D/g,"").slice(0,8), o=d.slice(0,2);
    if(d.length>2)o+="/"+d.slice(2,4); if(d.length>4)o+="/"+d.slice(4);
    inp.value=o; });
}
function dataValida(s){ var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||"")); if(!m)return false;
  var d=new Date(+m[3],+m[2]-1,+m[1]);
  return d.getFullYear()===+m[3]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[1]; }
function dataNum(s){ var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||"")); return m?(+m[3])*10000+(+m[2])*100+(+m[1]):0; }
function hojeBr(){ var d=new Date(), p=function(n){ return (n<10?"0":"")+n; };
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear(); }
function editarResumo(i,pre){
  var novo=(i<0), prox=(MESA.resumos||[]).reduce(function(m,x){ return Math.max(m,+x.n||0); },0)+1;

function ligaTamNota(t){
  try{ var g=JSON.parse(localStorage.getItem("grim_notas_tam")||"null");
    if(g&&g.w&&g.h){ t.style.width=g.w+"px"; t.style.height=g.h+"px"; } }catch(e){}
  if(window.ResizeObserver){ var ro=new ResizeObserver(function(){
    if(!document.body.contains(t)){ ro.disconnect(); return; }
    if(!t.offsetWidth||!t.style.width&&!t.style.height&&!t.dataset.mexeu)return;
    try{ localStorage.setItem("grim_notas_tam",JSON.stringify({w:t.offsetWidth,h:t.offsetHeight})); }catch(e){} });
    ro.observe(t); }
  /* so grava depois que a pessoa puxa o canto: sem isso a caixa padrao viraria "tamanho escolhido" */
  t.addEventListener("pointerdown",function(){ t.dataset.mexeu="1"; });
  var r=$("#mNotaTam"); if(r)r.onclick=function(){ t.style.width=t.style.height=""; delete t.dataset.mexeu;
    try{ localStorage.removeItem("grim_notas_tam"); }catch(e){} };
}

  var destino;

function aplicarEncerramento(s){

  if(pend.length){

    hydrateCena(v); iniLigar(v,curSess());
    /* cena e caixa do painel lembram se estavam abertas: editar um bloco redesenha a
       tela, e sem isso a cena em que a pessoa estava fechava na cara dela */
    $$("details.scn",v).forEach(function(d){ d.addEventListener("toggle",function(){
      var id=d.id.replace(/^scn-/,"");
      if(!d.open){ if(S.aberta===id)S.aberta=null; return; }
      S.aberta=id;
      $$("details.scn",v).forEach(function(o){ if(o!==d&&o.open)o.open=false; }); }); });
    $$(".railfloat details.rbox, aside.rail details.rbox",v).forEach(function(d){
      d.addEventListener("toggle",function(){ var k=d.getAttribute("data-rb");
        if(!d.open){ if((S.rbox||"obrig")===k)S.rbox="-"; return; }
        S.rbox=k;
        $$("details.rbox",d.parentNode).forEach(function(o){ if(o!==d&&o.open)o.open=false; }); }); });
    if(board)initCanvas(curSess());
  }catch(err3){ try{toast("Erro na sessão: "+((err3&&err3.message)||err3));}catch(_){} }
  var ba=$("#btnAjustes"); if(ba)ba.classList.toggle("on",S.view==="ajustes");
  try{ if(!board)window.scrollTo(0,mesma?y:0); }catch(_){}
}

/* ---------- BOOT ---------- */
window.addEventListener("error",function(e){ try{ if(e&&e.message)toast("Erro: "+e.message); }catch(_){} });
window.addEventListener("unhandledrejection",function(e){ try{ var r=e&&e.reason;
  toast("Falha: "+((r&&r.message)||r||"desconhecida")); }catch(_){} });
$("#btnBusca").onclick=function(){abrirBusca();};
$("#btnTrilha").onclick=function(){abrirTrilha();};
$("#btnDados").onclick=function(){abrirDados();};
$("#btnRol").onclick=function(){ painelRolagens(); };
$("#nbName").onclick=function(){abrirTrilha();};
$("#nbPlay").onclick=function(){ if(!PL.cur)return; if(PL.cur.paused)PL.cur.play(); else PL.cur.pause(); playerUI(); };
$("#nbStop").onclick=function(){ parar(); };
$("#nbLoop").onclick=function(){ PL.loop=!PL.loop; if(PL.cur)PL.cur.loop=PL.loop; playerUI();
  var lp=$("#plLoop"); if(lp){lp.setAttribute("aria-pressed",PL.loop);lp.textContent="Loop "+(PL.loop?"ligado":"desligado");}
  toast(PL.loop?"Loop ligado":"Loop desligado"); };
$("#btnAjustes").onclick=function(){
  if(S.view==="ajustes"){
    S.view=S.antes||(CID?(GM?"home":"mesa"):(CAMPANHAS.length?"escolher":"semcampanha")); }
  else { S.antes=S.view; S.view="ajustes"; }
  render(); };
/* Ctrl+F fica com o navegador: sequestrar a busca da pagina surpreendia.
   A busca do app abre com "/" (fora de campo de texto) ou Ctrl+K. */
document.addEventListener("keydown",function(e){
  /* mesmo no da captura que o tour e registrado antes dele: precisa ceder por conta propria */
  if(!CID||TOUR)return;
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); e.stopPropagation(); abrirBusca(); return; }
  var tag=(e.target&&e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||(e.target&&e.target.isContentEditable))return;
  if($(".ov")||$(".proj"))return;
  if(e.key==="/"&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); abrirBusca(); }
},true);
var bh=document.getElementById("brandHome");
  if(bh){
    bh.onclick=function(){ if(PRONTO||CID)trocarCampanha(); };
    bh.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); bh.onclick(); } };
  }
  window.addEventListener("resize",function(){
  document.documentElement.style.setProperty("--hh",($(".top").offsetHeight||56)+"px"); });
boot();
})();
</script>
