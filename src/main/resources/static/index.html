<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Grimório</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0708'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%23b3122a' stroke-width='2.5'/%3E%3Cpath d='M12 12l8 8M20 12l-8 8' stroke='%23c9a227' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fontes.css">
<style>
/* Layout: barra fixa de ritual no topo, trilho lateral de contexto, canvas de territorios ao centro */
:root{
  --bg:#0a0708; --bg2:#130d0f; --bg3:#1c1416; --bg4:#241a1d;
  --line:#322328; --line2:#48313a;
  --fg:#ece4d9; --fg2:#b7a9a2; --fg3:#7d6e6b;
  --blood:#b3122a; --blood2:#e23048; --blood-dim:#5e0f1c;
  --gold:#c9a227; --gold2:#e8c45a; --sobre-gold:#140e02;
  --ok:#7ba36f; --warn:#d08a2c;
  --t-abertura:#8e7cc3; --t-despertares:#c2458a; --t-saopaulo:#c9a227; --t-galpao:#c0392b; --t-gancho:#4a8fa8;
  --disp:"Cinzel", Georgia, serif;
  --body:"Spectral", Georgia, "Times New Roman", serif;
  --ui:"Barlow Condensed", "Arial Narrow", sans-serif;
  --r:.25rem; --maxw:100%; --gut:clamp(1rem,1.6vw,3rem);
  color-scheme:dark;
}
*{box-sizing:border-box}
/* A raiz cresce com a largura da tela e todo o resto esta em rem: texto, botao, espaco e
   coluna de grade sobem juntos. Ate ~1400px fica nos 16px de sempre; num ultrawide chega a 24px.
   O quadro de cenas e a excecao: ele tem zoom proprio e as posicoes sao gravadas em px. */
html{font-size:clamp(16px,calc(11px + .36vw),24px)}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); margin:0;
  font-family:var(--body); font-size:1rem; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#070506}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{width:.625rem;height:.625rem}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:.3125rem}

.ui{font-family:var(--ui);letter-spacing:.06em;text-transform:uppercase}
.disp{font-family:var(--disp);letter-spacing:.04em}
.gutter{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.prose{max-width:92ch}

/* ---------- TOPO ---------- */
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:linear-gradient(var(--bg2),var(--bg) 70%,transparent);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(.375rem);
}
.topin{display:flex;align-items:center;gap:.875rem;max-width:var(--maxw);margin:0 auto;padding-block:.5625rem;
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:.5625rem;flex:0 0 auto;cursor:pointer}
.brand:hover #brandNome{color:var(--gold)}
.sigil{width:1.625rem;height:1.8125rem;flex:0 0 auto}
.brand b{font-family:var(--disp);font-weight:800;font-size:1.02rem;letter-spacing:.14em;line-height:1}
.brand span{display:block;font-family:var(--ui);font-size:.63rem;letter-spacing:.22em;color:var(--fg3);margin-top:2px}
nav.tabs{display:flex;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--ui);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);
  padding:.4375rem .75rem;border:1px solid transparent;border-radius:var(--r);white-space:nowrap}
.tab:hover{color:var(--fg2);background:var(--bg2)}
.tab[aria-current="true"]{color:var(--fg);background:var(--bg3);border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--blood)}
.acts{display:flex;gap:.375rem;flex:0 0 auto}
.ibtn{font-family:var(--ui);font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2);
  border:1px solid var(--line);border-radius:var(--r);padding:.4375rem .625rem;display:flex;align-items:center;gap:.375rem;background:var(--bg2)}
.ibtn:hover{border-color:var(--line2);color:var(--fg);background:var(--bg3)}
.ibtn.on{border-color:var(--gold);color:var(--gold)}
.ibtn.live{border-color:var(--blood);color:var(--blood2)}
.ibtn svg{width:.875rem;height:.875rem;flex:0 0 auto}
.kbd{font-family:var(--ui);font-size:.66rem;border:1px solid var(--line2);border-radius:.1875rem;padding:1px .25rem;color:var(--fg3)}

/* widget de trilha tocando */
.nowbar{display:flex;align-items:center;gap:.4375rem;flex:0 0 auto;max-width:20.625rem;
  border:1px solid var(--blood-dim,#5a1620);border-radius:62.4375rem;background:rgba(179,18,42,.10);padding:.1875rem .25rem .1875rem .6875rem}
.nowbar[hidden]{display:none}
.nowbar .nbdot{width:.4375rem;height:.4375rem;border-radius:50%;background:var(--blood2);flex:0 0 auto;animation:nbp 1.6s ease-in-out infinite}
@keyframes nbp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.nowbar .nbdot{animation:none}}
.nowbar .nbname{font-family:var(--ui);font-size:.76rem;letter-spacing:.07em;color:var(--fg);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:11.25rem;min-width:0;text-align:left}
.nowbar .nbname:hover{color:var(--gold)}
.nbb{width:1.625rem;height:1.625rem;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:0 0 auto;border:1px solid transparent}
.nbb:hover{color:var(--fg);background:var(--bg3);border-color:var(--line2)}
.nbb svg{width:.75rem;height:.75rem}
.nbb.off{color:var(--fg3);opacity:.5}
.nbb.off:hover{opacity:1}
@media (max-width:1100px){.nowbar .nbname{max-width:6.875rem}}
@media (max-width:760px){.nowbar .nbname{display:none}}

main{max-width:var(--maxw);margin:0 auto;padding-block:1.375rem 4rem;
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

/* ---------- TIPOGRAFIA ---------- */
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
h1.page{font-family:var(--disp);font-weight:800;font-size:clamp(1.9rem,5vw,2.9rem);letter-spacing:.06em;line-height:1.05}
.eyebrow{font-family:var(--ui);font-size:.74rem;letter-spacing:.26em;color:var(--blood2);text-transform:uppercase}
h2.sec{font-family:var(--disp);font-size:1.18rem;letter-spacing:.09em;text-transform:uppercase;
  display:flex;align-items:center;gap:.75rem;color:var(--fg)}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.lead{color:var(--fg2);max-width:68ch}
.muted{color:var(--fg3)}
.sm{font-size:.9rem}

/* ---------- CARTOES ---------- */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;gap:.875rem}
.sec-wrap{display:flex;flex-direction:column;gap:.875rem;margin-top:2.125rem}
/* Tela larga: as secoes viram colunas em vez de uma tira estreita com metade da tela vazia.
   Coluna de texto (e nao grade) porque secao tem altura muito desigual e a grade deixaria buraco.
   O respiro e padding, nao margem: margem no topo de coluna some depois da quebra. */
.seccols{columns:44rem;column-gap:1.5rem;margin-top:2rem}
/* Lado a lado, secao sem moldura vira um texto corrido so: cada uma ganha cartao proprio,
   com a faixa no topo marcando onde comeca. */
.seccols>.sec-wrap{break-inside:avoid;margin:0 0 1.5rem;padding:1.125rem 1.375rem 1.375rem;
  background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--blood);border-radius:var(--r)}
.seccols>.sec-wrap h2.sec{font-size:1.4rem;color:var(--gold)}
.seccols>.sec-wrap h2.sec::after{display:none}
.seccols>.sec-wrap .sechd{padding-bottom:.75rem;border-bottom:1px solid var(--line)}
.seccols .ep,.seccols .passo,.seccols .met .c{background:var(--bg3)}

/* PCs */
.pcs{grid-template-columns:repeat(auto-fit,minmax(11.25rem,1fr))}
.pc{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pc .por{position:relative;aspect-ratio:1/1;background:#000;overflow:hidden}
.pc .por img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:opacity .35s}
.pc .por img.mk{position:absolute;inset:0;opacity:0}
.pc:hover .por img.mk{opacity:1}
.pc:hover .por img:not(.mk){opacity:0}
.pc .por:not(:has(img.mk)) img{opacity:1!important}
.pc .bd{padding:.625rem .75rem .75rem;display:flex;flex-direction:column;gap:.3125rem;flex:1}
.pc .semfoto{width:100%;height:100%;display:grid;place-items:center;background:var(--bg3);color:var(--fg3);font:600 .72rem/1 var(--ui);letter-spacing:.14em;text-transform:uppercase}
.eigrid{display:flex;flex-wrap:wrap;gap:.5rem}
.eigrid button{padding:0;border:2px solid transparent;background:none;cursor:pointer;line-height:0;border-radius:.25rem}
.eigrid button.on{border-color:var(--gold)}
.eigrid img{width:4.875rem;height:4.875rem;object-fit:cover;border-radius:.1875rem;display:block}
.eigrid .cap{display:block;max-width:4.875rem;font-size:.62rem;color:var(--fg3);line-height:1.2;word-break:break-all;padding-top:2px}
.pc b{font-family:var(--disp);font-size:.98rem;letter-spacing:.03em}
.pc .alc{font-family:var(--ui);font-size:.74rem;letter-spacing:.14em;color:var(--blood2);text-transform:uppercase}
.pc .termos{font-size:.82rem;color:var(--fg3);line-height:1.4}
.pc .row{display:flex;gap:.375rem;margin-top:auto;padding-top:.5rem;flex-wrap:wrap}

.chip{font-family:var(--ui);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:62.4375rem;padding:2px .5625rem;color:var(--fg2);white-space:nowrap}
.chip.b{border-color:var(--blood);color:var(--blood2)}
.chip.g{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.btn:hover{background:var(--bg4);color:var(--fg);cursor:pointer}

/* segredo */
.segredo{border-left:2px solid var(--blood);background:linear-gradient(90deg,rgba(179,18,42,.09),transparent 60%);
  padding:.5625rem .75rem;border-radius:0 var(--r) var(--r) 0}
.segredo .lb{font-family:var(--ui);font-size:.68rem;letter-spacing:.18em;color:var(--blood2);text-transform:uppercase;display:block;margin-bottom:.1875rem}
.blur{filter:blur(.3125rem);cursor:pointer;transition:filter .2s;user-select:none}
.blur:hover{filter:blur(.1875rem)}
.blur.rev{filter:none;cursor:auto}

/* episodios */
.eps{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ep{display:grid;grid-template-columns:2.75rem 1fr;gap:.75rem;background:var(--bg2);padding:.625rem .8125rem;align-items:baseline}
.ep:hover{background:var(--bg3)}
.ep .n{font-family:var(--disp);font-weight:800;font-size:1.05rem;color:var(--blood);text-align:right}
.ep.done .n{color:var(--ok)}
.ep b{font-family:var(--disp);font-size:.97rem;letter-spacing:.04em}
.ep p{margin:2px 0 0;font-size:.88rem;color:var(--fg3)}

/* metodo */
.met{grid-template-columns:repeat(auto-fit,minmax(15.625rem,1fr))}
.met .c{background:var(--bg2);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:.75rem .875rem}
.met .c b{font-family:var(--disp);font-size:.95rem;display:block;margin-bottom:.25rem}
.met .c p{margin:0;font-size:.89rem;color:var(--fg2)}

/* indice AS */
.idx{grid-template-columns:repeat(auto-fit,minmax(17.5rem,1fr));align-items:start}
.idx .doc{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:.75rem .875rem}
.idx .doc>b{font-family:var(--disp);font-size:.95rem;letter-spacing:.06em;display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.idx ul{list-style:none;margin:0;padding:0;font-size:.88rem}
.idx li{padding:1px 0}
.idx .g{color:var(--fg);font-weight:600}
.idx .s{padding-left:.75rem;color:var(--fg2)}
.idx .s2{padding-left:1.5rem;color:var(--fg3);font-size:.85rem}
.pg{font-family:var(--ui);font-size:.72rem;color:var(--gold);letter-spacing:.06em;cursor:pointer;border-bottom:1px dotted var(--gold)}
.pg:hover{color:var(--gold2)}
</style>
<style>
/* ---------- SESSAO ---------- */
.sess{display:grid;grid-template-columns:16.875rem 1fr;gap:1.125rem;align-items:start}
.rail{display:flex;flex-direction:column;gap:.75rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.875rem);max-height:calc(100vh - 5.625rem);overflow:auto;padding-right:2px}
.rbox{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.rbox>summary{font-family:var(--ui);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);
  padding:.5625rem .75rem;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.rbox>summary::-webkit-details-marker{display:none}
.rbox>summary::after{content:"+";color:var(--fg3);font-family:var(--ui)}
.rbox[open]>summary::after{content:"−"}
.rbox[open]>summary{border-bottom:1px solid var(--line);color:var(--fg)}
.rbody{padding:.625rem .75rem;font-size:.88rem;display:flex;flex-direction:column;gap:.5rem}
.rbody ul{margin:0;padding-left:1rem;display:flex;flex-direction:column;gap:.3125rem}
.rbody li{color:var(--fg2)}
.npcrow{display:flex;gap:.5625rem;align-items:flex-start;cursor:pointer;padding:.25rem;border-radius:var(--r)}
.npcrow:hover{background:var(--bg3)}
.npcrow img{width:2.375rem;height:2.375rem;border-radius:2px;object-fit:cover;object-position:top center;border:1px solid var(--line2);flex:0 0 auto}
.npcrow b{font-size:.9rem;display:block;font-family:var(--disp)}
.npcrow p{margin:1px 0 0;font-size:.8rem;color:var(--fg3);line-height:1.35}

.sesshead{display:flex;align-items:flex-end;justify-content:space-between;gap:.875rem;flex-wrap:wrap;margin-bottom:1rem}
.vmodes{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--bg2)}
.vmodes button{font-family:var(--ui);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;padding:.375rem .75rem;border-radius:2px;color:var(--fg3)}
.vmodes button[aria-pressed="true"]{background:var(--bg4);color:var(--fg)}

/* progresso */
.prog{display:flex;align-items:center;gap:.5rem;font-family:var(--ui);font-size:.74rem;letter-spacing:.1em;color:var(--fg3)}
.bar{width:5.625rem;height:.1875rem;background:var(--bg4);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood);transition:width .3s}

/* ---------- CANVAS ---------- */
.cvwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:
  radial-gradient(circle at 30% 10%,rgba(179,18,42,.07),transparent 55%),
  linear-gradient(var(--bg2),var(--bg));overflow:hidden;height:min(74vh,47.5rem);touch-action:none}
.cvtools{position:absolute;right:.625rem;top:.625rem;z-index:5;display:flex;flex-direction:column;gap:.3125rem}
.cvtools button{width:1.875rem;height:1.875rem;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg3);
  color:var(--fg2);font-family:var(--ui);font-size:.9rem;display:grid;place-items:center}
.cvtools button:hover{color:var(--fg);background:var(--bg4)}
.cvhint{position:absolute;left:.75rem;bottom:.625rem;z-index:5;font-family:var(--ui);font-size:.68rem;letter-spacing:.1em;color:var(--fg3);pointer-events:none}
.cv{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.cvsvg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.terr{position:absolute;border:1.5px solid;border-radius:14px;padding:30px 12px 12px;background:rgba(10,7,8,.45)}
.terr>.tl{position:absolute;top:-11px;left:14px;font-family:var(--ui);font-size:11.84px;letter-spacing:.2em;
  text-transform:uppercase;padding:1px 9px;background:var(--bg);border:1px solid;border-radius:3px}
.card{position:relative;width:100%;margin-bottom:8px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);
  padding:8px 10px;cursor:pointer;transition:border-color .15s,transform .1s;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.card:hover{border-color:var(--fg3);transform:translateY(-1px)}
.card.done{opacity:.52}
.card.done .ct{text-decoration:line-through;text-decoration-color:var(--blood)}
.card .chd{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.card .cn{font-family:var(--ui);font-size:10.88px;letter-spacing:.12em;color:var(--fg3);text-transform:uppercase}
.card .ct{font-family:var(--disp);font-size:13.44px;line-height:1.25;letter-spacing:.02em}
.card .cfoot{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
.card .thumbs{display:flex;gap:3px;margin-top:7px}
.card .thumbs img{width:30px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:2px}
.ckbox{width:.9375rem;height:.9375rem;border:1px solid var(--line2);border-radius:2px;display:grid;place-items:center;flex:0 0 auto;background:var(--bg)}
.ckbox[aria-pressed="true"]{background:var(--blood);border-color:var(--blood)}
.ckbox svg{width:.625rem;height:.625rem;opacity:0}
.ckbox[aria-pressed="true"] svg{opacity:1}
.mini{font-family:var(--ui);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);
  border:1px solid var(--line);border-radius:62.4375rem;padding:0 .375rem}
.mini.f{border-color:var(--blood);color:var(--blood2)}

/* ---------- ROTEIRO ---------- */
.roteiro{display:flex;flex-direction:column;gap:.75rem}
.scn{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scn>summary{display:flex;align-items:center;gap:.625rem;padding:.6875rem .8125rem;cursor:pointer;list-style:none}
.scn>summary::-webkit-details-marker{display:none}
.scn[open]>summary{border-bottom:1px solid var(--line);background:var(--bg3)}
.scn .sn{font-family:var(--ui);font-size:.7rem;letter-spacing:.12em;color:var(--fg3);text-transform:uppercase;flex:0 0 auto}
.scn .st{font-family:var(--disp);font-size:.98rem;letter-spacing:.02em;flex:1;min-width:0}
.scn.done>summary .st{opacity:.5;text-decoration:line-through;text-decoration-color:var(--blood)}
.sbody{padding:.875rem .9375rem 1.0625rem;columns:40rem;column-gap:2rem}
.sbody>*{break-inside:avoid;margin-bottom:.875rem}
.sbody>.addrow,.sbody>:last-child{margin-bottom:0}
.sbody>.addrow{column-span:all}
/* bloco da cena: mesma ideia dos cartoes da Campanha, mais escuro que o fundo da cena */
.sbody>.blk{background:var(--bg);border:1px solid var(--line2);border-top:3px solid var(--blood);
  border-radius:var(--r);padding:.75rem 1rem 1rem;gap:.625rem}
.sbody>.blk>.blkhd{padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.sbody>.blk>.blkhd .flb{font-family:var(--disp);font-size:1.08rem;letter-spacing:.08em;color:var(--gold);font-weight:600}
.sbody>.blk>.blkhd .flb::after{display:none}

.fld{display:flex;flex-direction:column;gap:.375rem}
.flb{font-family:var(--ui);font-size:.73rem;letter-spacing:.17em;text-transform:uppercase;color:var(--fg2);
  display:flex;align-items:center;gap:.5rem}
.flb::after{content:"";flex:1;height:1px;background:var(--line)}
.leitura{font-size:1.09rem;line-height:1.68;color:var(--fg);background:var(--bg3);border-left:2px solid var(--blood);
  padding:.8125rem 1rem;border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap;max-width:112ch}
.dlg,.segredo{max-width:112ch}
.quem{max-width:116ch}
ul.fl>li{max-width:112ch}
.leitura .hint{display:block;font-family:var(--ui);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:.4375rem}
ul.fl{margin:0;padding-left:1.0625rem;display:flex;flex-direction:column;gap:.375rem;color:var(--fg2)}
ul.fl ul{margin:.3125rem 0 0;padding-left:1.0625rem;gap:.25rem;color:var(--fg3);font-size:.93rem}
ul.fl li::marker{color:var(--blood)}
ul.fl li.q{list-style:none}

   cadastros (elenco) e secoes livres. A conversao roda no cliente e NAO apaga os
   campos antigos: eles ficam no JSON, parados, para dar para voltar atras. */
var MIGROU=false;
function porNome(l,nome){ var k=norm(nome); return (l||[]).filter(function(x){return norm(x.nome)===k;})[0]||null; }
function normalizaSessao(s){
  if(!s||typeof s!=="object")return;
  if(!s.id)s.id=uid("s");
  if(!Array.isArray(s.territorios))s.territorios=[];
  if(!Array.isArray(s.cenas))s.cenas=[];
  s.cenas.forEach(function(c){ if(!c.id)c.id=uid("c"); if(!Array.isArray(c.blocos))c.blocos=[]; });
  if(!s.prep||typeof s.prep!=="object")s.prep={};
  ["terPronto","mecanicas"].forEach(function(k){ if(!Array.isArray(s.prep[k]))s.prep[k]=[]; });
  if(!s.eventosFixos||typeof s.eventosFixos!=="object")s.eventosFixos={};
  if(typeof s.eventosFixos.intro!=="string")s.eventosFixos.intro="";
  if(!Array.isArray(s.eventosFixos.lista))s.eventosFixos.lista=[];
  ["npcIds","localIds","pistaIds"].forEach(function(k){ if(!Array.isArray(s[k]))s[k]=[]; });
  ["plantado","resumo","titulo"].forEach(function(k){ if(typeof s[k]!=="string")s[k]=(s[k]==null?"":String(s[k])); });
}
function normalizaCampanha(){
  var c=D&&D.campanha; if(!c)return;
  ["titulo","sistema"].forEach(function(k){ if(typeof c[k]!=="string")c[k]=""; });
  if(!Array.isArray(c.indiceAS))c.indiceAS=[];
  if(!Array.isArray(c.referencia))c.referencia=[];
  if(!c.sinonimos||typeof c.sinonimos!=="object")c.sinonimos={};
  if(!c.canonicas||typeof c.canonicas!=="object")c.canonicas={};
  if(!Array.isArray(c.categoriasBusca))c.categoriasBusca=[];
  if(!c.vocab||typeof c.vocab!=="object")c.vocab={};
  if(!Array.isArray(D.sessoes))D.sessoes=[];
  if(!Array.isArray(D.trilhaCategorias))D.trilhaCategorias=[];
  if(!Array.isArray(D.galeria))D.galeria=[];
  if(!D.elenco||typeof D.elenco!=="object")D.elenco={};
  ["personagens","npcs","locais","pistas"].forEach(function(k){ if(!Array.isArray(D.elenco[k]))D.elenco[k]=[]; });
  if((Number(D.versao)||0)<3)migrarV3(c);
  if(typeof c.apresentacao!=="string")c.apresentacao="";
  if(!Array.isArray(c.secoes))c.secoes=[];
  c.secoes.forEach(function(s){ if(!s.id)s.id=uid("q"); if(!s.tipo)s.tipo="texto";
    if(!Array.isArray(s.itens))s.itens=[]; if(typeof s.texto!=="string")s.texto=""; if(typeof s.titulo!=="string")s.titulo=""; });
  D.elenco.personagens.forEach(function(p){ if(!Array.isArray(p.fichas))p.fichas=[]; });
  D.sessoes.forEach(normalizaSessao);
}
function migrarV3(c){
  var e=D.elenco;
  function txt(x){ return typeof x==="string"?x.trim():(x==null?"":String(x).trim()); }
  function lst(x){ return Array.isArray(x)?x.filter(function(y){return typeof y==="string"&&y.trim();}):[]; }
  if(c.conceitoTexto==null&&c.hexatombeTexto!=null)c.conceitoTexto=c.hexatombeTexto;
  if(c.regrasDeOuro==null&&c.hexatombeRegras!=null)c.regrasDeOuro=c.hexatombeRegras;

  (Array.isArray(c.corpos)?c.corpos:[]).forEach(function(p){ if(!p||typeof p!=="object")return;
    var notas=[];
    if(txt(p.dificuldade))notas.push("Dificuldade: "+txt(p.dificuldade));
    if(!txt(p.agente)&&txt(p.agenteNota)&&txt(p.agenteNota)!=="a definir")notas.push(txt(p.agenteNota));
    e.personagens.push({id:uid("p"),nome:txt(p.assassino),subtitulo:txt(p.alcunha),jogador:txt(p.agente),
      img:txt(p.pc),imgAlt:txt(p.mask),etiquetas:txt(p.termos),notas:notas.join("\n"),ref:txt(p.as),fichas:lst(p.fichas)}); });

  var sec=[];
  function poe(t,tipo,texto,itens){ if(!txt(texto)&&!(itens&&itens.length))return;
    sec.push({id:uid("q"),titulo:t,tipo:tipo,texto:txt(texto),itens:itens||[]}); }
  if(!txt(c.apresentacao))c.apresentacao=txt(c.verdadeIntro);
  poe("Sobre os "+V("personagens").toLowerCase(),"texto",c.sacrificio);
  var ps=(c.preSessao&&typeof c.preSessao==="object")?c.preSessao:{};
  poe(txt(ps.titulo)||("Antes da primeira "+V("sessao").toLowerCase()),"texto",
    [txt(ps.intro),txt(ps.textoAbertura)].filter(Boolean).join("\n\n"));
  poe(txt(ps.perguntasTitulo)||"Perguntas para a mesa","lista","",lst(ps.perguntas));
  poe(txt(ps.metodoTitulo)||"Como usar as respostas","lista","",lst(ps.metodo));
  var ad=(c.adaptacao&&typeof c.adaptacao==="object")?c.adaptacao:{};
  poe(txt(ad.titulo)||"Adaptações","lista","",lst(ad.itens));
  poe(txt(c.conceitoTitulo)||"O conceito","texto",c.conceitoTexto);
  poe(txt(c.regrasDeOuroTitulo)||"Regras de ouro","lista","",lst(c.regrasDeOuro));
  var met=(Array.isArray(c.metodo)?c.metodo:[]).filter(function(m){return m&&(txt(m.t)||txt(m.d));})
    .map(function(m){return {t:txt(m.t),d:txt(m.d)};});
  poe("Método de mesa","cartoes",c.metodoNota,met);
  c.secoes=(Array.isArray(c.secoes)?c.secoes:[]).concat(sec);

  /* o "mapa das sessoes" era uma lista a parte, ligada ao roteiro por numero digitado
     a mao. Agora a linha planejada e a propria sessao. */
  (Array.isArray(c.episodios)?c.episodios:[]).forEach(function(ep){ if(!ep||typeof ep!=="object")return;
    var n=Number(ep.n)||0, s=D.sessoes.filter(function(x){return x&&x.numero===n;})[0];
    if(!s){ if(txt(ep.nome)||txt(ep.resumo))novaSessao(n,txt(ep.nome),txt(ep.resumo)); }
    else if(!txt(s.resumo))s.resumo=txt(ep.resumo); });

  /* NPC, local e evidencia moravam dentro de cada sessao. Sobem para o elenco,
     sem duplicar por nome, e a sessao passa a apontar para eles. */
  D.sessoes.forEach(function(s){ if(!s||typeof s!=="object")return;
    function sobe(arr,dest,pre,mk){ var ids=[];
      (Array.isArray(arr)?arr:[]).forEach(function(x){ if(!x||!txt(x.nome))return;
        var a=porNome(dest,x.nome); if(!a){ a=mk(x); a.id=uid(pre); dest.push(a); }
        if(ids.indexOf(a.id)<0)ids.push(a.id); });
      return ids; }
    s.npcIds=sobe(s.npcs,e.npcs,"n",function(x){return {nome:txt(x.nome),img:txt(x.img),desc:txt(x.desc),segredo:txt(x.segredo)};});
    s.localIds=sobe(s.locais,e.locais,"l",function(x){return {nome:txt(x.nome),img:txt(x.img),desc:txt(x.desc)};});
    s.pistaIds=sobe(s.handouts,e.pistas,"k",function(x){return {nome:txt(x.nome),img:txt(x.img),texto:txt(x.texto)};});
  });
  D.versao=3; MIGROU=true;
}

function pget(o,p){ var ks=String(p).split("."); for(var i=0;i<ks.length;i++){ if(o==null)return undefined; o=o[ks[i]]; } return o; }
function pset(o,p,v){ var ks=String(p).split("."); for(var i=0;i<ks.length-1;i++)o=o[ks[i]]; o[ks[ks.length-1]]=v; }

/* campos: [{k, rot, tipo, dica, ph, obrig, ops, linhas, um, novo, campos}]
   tipo: texto (padrao) | area | linhas | num | sel | check | faixa | img | imgs | grupo
   Trabalha numa copia; o original so muda em o.salvar(copia). */
function formulario(titulo,campos,valor,o){
  o=o||{};
  var w=JSON.parse(JSON.stringify(valor||{})), ini="", fechando=false, GR={}, ov;
  function campoHtml(c,pre){
    var p=pre+c.k, v=pget(w,p), dica=c.dica?'<span class="dica">'+esc(c.dica)+'</span>':"";
    var ph=c.ph?' placeholder="'+esc(c.ph)+'"':"";
    if(c.tipo==="area")return '<label>'+esc(c.rot)+'<textarea data-f="'+p+'" rows="'+(c.linhas||5)+'"'+ph+'>'+esc(v||"")+'</textarea>'+dica+'</label>';
    if(c.tipo==="linhas")return '<label>'+esc(c.rot)+'<textarea data-f="'+p+'" data-t="linhas" rows="'+(c.linhas||5)+'"'+ph+'>'
      +esc((Array.isArray(v)?v:[]).join("\n"))+'</textarea><span class="dica">'+esc(c.dica||"Um item por linha.")+'</span></label>';
    if(c.tipo==="num")return '<label>'+esc(c.rot)+'<input data-f="'+p+'" data-t="num" type="number" step="1" value="'+esc(v==null?"":v)+'">'+dica+'</label>';
    if(c.tipo==="sel")return '<label>'+esc(c.rot)+'<select data-f="'+p+'">'+c.ops.map(function(op){
        return '<option value="'+esc(op[0])+'"'+(String(op[0])===String(v==null?"":v)?" selected":"")+'>'+esc(op[1])+'</option>';}).join("")
      +'</select>'+dica+'</label>';
    if(c.tipo==="check")return '<label class="ck"><input type="checkbox" data-f="'+p+'" data-t="check"'+(v?" checked":"")+'>'+esc(c.rot)+'</label>';
    if(c.tipo==="faixa")return '<label>'+esc(c.rot)+'<input data-f="'+p+'" list="dlFaixas" value="'+esc(v||"")+'"'+ph+'>'+dica+'</label>';
    if(c.tipo==="img")return '<div class="fgrp"><span class="frot">'+esc(c.rot)+'</span><div class="pick">'
      +(v?'<img src="'+esc(IMG(v))+'" alt="">':'<span class="semimg">sem imagem</span>')
      +'<button type="button" class="btn sec" data-pk="'+p+'">'+(v?"Trocar":"Escolher imagem")+'</button>'
      +(v?'<button type="button" class="tbtn d" data-pkx="'+p+'">tirar</button>':"")+'</div>'+dica+'</div>';
    if(c.tipo==="imgs")return '<div class="fgrp"><span class="frot">'+esc(c.rot)+'</span><div class="pick">'
      +(Array.isArray(v)?v:[]).map(function(x,i){ return '<span class="pkit"><img src="'+esc(IMG(x))+'" alt="">'
          +'<span class="addrow" style="gap:.1875rem;margin-top:.1875rem">'
          +'<button type="button" class="tbtn" data-mvr="'+p+':'+i+':-1" title="antes">←</button>'
          +'<button type="button" class="tbtn" data-mvr="'+p+':'+i+':1" title="depois">→</button>'
          +'<button type="button" class="tbtn d" data-rmr="'+p+':'+i+'" title="tirar">✕</button></span></span>'; }).join("")
      +'<button type="button" class="btn sec" data-pka="'+p+'">+ imagem</button></div>'+dica+'</div>';
    if(c.tipo==="grupo"){ GR[p]=c;
      return '<div class="fgrp"><span class="frot">'+esc(c.rot)+'</span>'+dica
        +(Array.isArray(v)?v:[]).map(function(x,i){ return '<div class="rowed"><div class="rowhd"><span>'+esc(c.um||"item")+' '+(i+1)+'</span>'
            +'<button type="button" class="tbtn" data-mvr="'+p+':'+i+':-1" title="subir">↑</button>'
            +'<button type="button" class="tbtn" data-mvr="'+p+':'+i+':1" title="descer">↓</button>'
            +'<button type="button" class="tbtn d" data-rmr="'+p+':'+i+'">remover</button></div>'
            +c.campos.map(function(sc){return campoHtml(sc,p+"."+i+".");}).join("")+'</div>'; }).join("")
        +(c.fixo?'':'<div class="addrow"><button type="button" class="btn sec" data-addr="'+p+'">+ '+esc(c.um||"item")+'</button></div>')+'</div>'; }
    return '<label>'+esc(c.rot)+'<input data-f="'+p+'" value="'+esc(v==null?"":v)+'"'+ph+(c.ro?' readonly tabindex="-1"':'')+'>'+dica+'</label>';
  }
  function corpo(){ GR={};
    return '<div class="form">'+(o.intro?'<div class="aviso">'+o.intro+'</div>':'')+campos.map(function(c){return campoHtml(c,"");}).join("")
      +'<div class="formft"><button type="button" class="btn" data-ok>'+esc(o.rotSalvar||"Salvar")+'</button>'
      +'<button type="button" class="btn sec" data-no>Cancelar</button><span class="esp"></span>'
      +(o.remover?'<button type="button" class="btn dang" data-del>'+esc(o.rotRemover||"Remover")+'</button>':"")+'</div></div>'
      +'<datalist id="dlFaixas">'+Object.keys(LIB.faixas||{}).map(function(k){
          return '<option value="'+esc(LIB.faixas[k].nome)+'"></option>';}).join("")+'</datalist>'; }
  function colher(){ $$("[data-f]",ov).forEach(function(n){
    var t=n.getAttribute("data-t"), p=n.getAttribute("data-f"), v;
    if(t==="check")v=n.checked;
    else if(t==="num")v=(n.value===""?0:(Number(n.value)||0));
    else if(t==="linhas")v=String(n.value||"").split("\n").map(function(x){return x.trim();}).filter(Boolean);
    else v=n.value;
    pset(w,p,v); }); }
  function lista(p){ var a=pget(w,p); if(!Array.isArray(a)){ a=[]; pset(w,p,a); } return a; }
  function repinta(foco){ var sc=$(".sbodyscroll",ov), y=sc?sc.scrollTop:0;
    $("#fmBody",ov).innerHTML=corpo(); liga(); if(sc)sc.scrollTop=y;
    if(foco){ var n=$('[data-f^="'+foco+'"]',ov); if(n){ n.focus(); if(n.scrollIntoView)n.scrollIntoView({block:"nearest"}); } } }
  function liga(){
    $("[data-ok]",ov).onclick=function(){ colher();
      var falta=campos.filter(function(c){return c.obrig&&!String(pget(w,c.k)==null?"":pget(w,c.k)).trim();})[0];
      if(falta){ toast("Preencha: "+falta.rot); var n=$('[data-f="'+falta.k+'"]',ov); if(n)n.focus(); return; }
      fechando=true; ov.close(); o.salvar(w); };
    $("[data-no]",ov).onclick=function(){ ov.close(); };
    var d=$("[data-del]",ov); if(d)d.onclick=function(){ fechando=true; ov.close(); o.remover(); };
    $$("[data-pk]",ov).forEach(function(b){ b.onclick=function(){ colher(); var p=b.getAttribute("data-pk");
      escolherImagem(pget(w,p)||"").then(function(rel){ if(rel===null)return; pset(w,p,rel); repinta(); }); }; });
    $$("[data-pkx]",ov).forEach(function(b){ b.onclick=function(){ colher(); pset(w,b.getAttribute("data-pkx"),""); repinta(); }; });
    $$("[data-pka]",ov).forEach(function(b){ b.onclick=function(){ colher(); var p=b.getAttribute("data-pka");
      escolherImagem("").then(function(rel){ if(!rel)return; lista(p).push(rel); repinta(); }); }; });
    $$("[data-addr]",ov).forEach(function(b){ b.onclick=function(){ colher(); var p=b.getAttribute("data-addr"), c=GR[p], a=lista(p);
      a.push(c&&c.novo?c.novo():{}); repinta(p+"."+(a.length-1)+"."); }; });
    $$("[data-rmr]",ov).forEach(function(b){ b.onclick=function(){ colher(); var pr=b.getAttribute("data-rmr").split(":");
      lista(pr[0]).splice(+pr[1],1); repinta(); }; });
    $$("[data-mvr]",ov).forEach(function(b){ b.onclick=function(){ colher(); var pr=b.getAttribute("data-mvr").split(":");
      var a=lista(pr[0]), i=+pr[1], j=i+(+pr[2]); if(j<0||j>=a.length)return;
      var t=a[i]; a[i]=a[j]; a[j]=t; repinta(); }; });
  }
  ov=overlay(titulo,'<div id="fmBody">'+corpo()+'</div>',{wide:!!o.wide,firme:true});
  var fecha=ov.close;
  ov.close=function(){
    if(!fechando){ colher(); if(JSON.stringify(w)!==ini&&!confirm("Descartar o que você mudou?"))return; }
    fecha(); };
  liga(); colher(); ini=JSON.stringify(w);
  ov.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); $("[data-ok]",ov).click(); } });
  setTimeout(function(){ var p=$("#fmBody input:not([type=checkbox]),#fmBody textarea",ov); if(p)p.focus(); },40);
  return ov;
}

      {k:"f",rot:"Resultados",tipo:"linhas",linhas:3,
       dica:"Um por linha. Comece com o número para destacar, ex.: 15 · acha a porta escondida"}]}];

function novoBloco(tipo){

      return '<div class="teste">'+(t.p?'<span class="per">'+esc(t.p)+'</span>':"")+'<div class="itbody">'+esc(t.t)
        +((t.f&&t.f.length)?'<div>'+t.f.map(function(f){
            var m=/^(\d+\+?)\s*[·:\-]\s*([\s\S]*)$/.exec(f);
            return '<span class="faixa">'+(m?'<b>'+esc(m[1])+'</b>'+esc(m[2]):esc(f))+'</span>';}).join("")+'</div>':"")
        +'</div></div>';}).join("")+'</div>');
  } else if(b.tipo==="trilha"){

function abrirCenaModal(id){
  var s=curSess(); if(!s)return;
  var c=null,i; for(i=0;i<s.cenas.length;i++) if(s.cenas[i].id===id)c=s.cenas[i];
  if(!c)return;
  var k=s.cenas.indexOf(c);
  var head='<button class="ibtn" id="cmPrev" title="Cena anterior"'+(k<=0?" disabled":"")+'>&#8249;</button>'
    +'<span class="sm muted" style="white-space:nowrap">'+(k+1)+'/'+s.cenas.length+'</span>'
    +'<button class="ibtn" id="cmNext" title="Próxima cena"'+(k>=s.cenas.length-1?" disabled":"")+'>&#8250;</button>';
  if(CMODAL&&CMODAL.ov&&document.body.contains(CMODAL.ov))CMODAL.ov.close();
  var ov=overlay(c.n+" · "+c.titulo,'<div id="cmBody">'+cenaModalBody(s,c)+'</div>',{wide:true,cls:"cenasheet",head:head});
  CMODAL={id:c.id,ov:ov};
  hydrateCena(ov);
  var pv=$("#cmPrev",ov); if(pv&&k>0)pv.onclick=function(){ abrirCenaModal(s.cenas[k-1].id); };
  var nx=$("#cmNext",ov); if(nx&&k<s.cenas.length-1)nx.onclick=function(){ abrirCenaModal(s.cenas[k+1].id); };
  var kh=function(e){ if(!document.body.contains(ov)){document.removeEventListener("keydown",kh);return;}
    if(e.target&&(e.target.isContentEditable||/input|textarea|select/i.test(e.target.tagName)))return;
    if(e.key==="ArrowLeft"&&k>0){e.preventDefault();abrirCenaModal(s.cenas[k-1].id);}
    else if(e.key==="ArrowRight"&&k<s.cenas.length-1){e.preventDefault();abrirCenaModal(s.cenas[k+1].id);} };
  document.addEventListener("keydown",kh);
}
function refreshCenaModal(){
  if(!CMODAL)return;

function editarTerr(s,tid){

      {k:"nome",rot:"Nome",obrig:true,ph:"um lugar, um ato, um grupo de cenas"},
      {k:"cor",rot:"Cor",tipo:"sel",ops:ops}],
    {nome:t.nome,cor:t.cor},

  if(a==="el-ver"){ var x=elDe(tp,id); if(x)abrirItem(tp,x,null,s); return; }

  switch(a){
    case "scn-add":{
      if(!s.territorios.length)s.territorios.push({id:uid("t"),nome:Vm("territorio")+" 1",cor:CORES_T[0][0],padrao:true});

    case "scn-up": case "scn-dn":{ if(!c)break; var k=s.cenas.indexOf(c),n2=k+(a==="scn-up"?-1:1);
      if(n2>=0&&n2<s.cenas.length){ s.cenas.splice(n2,0,s.cenas.splice(k,1)[0]); done(); } break; }
    case "blk-add":{ if(!c)break; var sel=b.parentNode.querySelector("select");
      editarBloco(c,-1,novoBloco(sel?sel.value:"lista")); break; }
    case "blk-ed": if(c)editarBloco(c,bi); break;
    case "blk-up": case "blk-dn":{ if(!c)break; var n3=bi+(a==="blk-up"?-1:1);
      if(n3>=0&&n3<c.blocos.length){ c.blocos.splice(n3,0,c.blocos.splice(bi,1)[0]); done(); } break; }
    case "terr-add": editarTerr(s,null); break;
    case "terr-ed": editarTerr(s,b.getAttribute("data-t")); break;

    case "el-add": adicionarNaSessao(s,tp); break;

/* ---------- CANVAS ---------- */
var CV={z:.62,x:10,y:10,init:false};
/* quanto a raiz cresceu em relacao aos 16px: o quadro e desenhado em px e compensa no zoom */
function escalaRaiz(){ return (parseFloat(getComputedStyle(document.documentElement).fontSize)||16)/16; }
function initCanvas(s){
  var wrap=$("#cvwrap"),cv=$("#cv"),svg=$("#cvsvg"); if(!wrap)return;
  function apply(){ var tr="translate("+CV.x+"px,"+CV.y+"px) scale("+CV.z+")";
    cv.style.transform=tr; svg.style.transform=tr; }
  function links(){ var ps=s.territorios.map(function(t,i){var p=tpos(s,i);return {x:p.x+122,y:p.y+40};}),d="";
    for(var i=0;i<ps.length-1;i++){ var A=ps[i],B=ps[i+1],mx=(A.x+B.x)/2;
      d+='<path d="M'+A.x+' '+A.y+' C '+mx+' '+A.y+', '+mx+' '+B.y+', '+B.x+' '+B.y+'" fill="none" stroke="#48313a" stroke-width="1.4" stroke-dasharray="5 6"/>'; }
    svg.innerHTML=d; }
  links(); apply();
  var drag=null, supClick=false, linha=null;
  function limparLinha(){ if(linha&&linha.parentNode)linha.parentNode.removeChild(linha); }
  function marcarAlvo(x,y){
    if(!linha){ linha=document.createElement("div"); linha.className="dropline"; }
    var sob=document.elementFromPoint(x,y);
    var terr=(sob&&sob.closest)?sob.closest(".terr"):null;
    if(!terr){ limparLinha(); drag.alvo=null; return; }
    var cards=Array.prototype.slice.call(terr.querySelectorAll(".card")).filter(function(n){return n!==drag.node;});
    var k=cards.length;
    for(var i=0;i<cards.length;i++){ var r=cards[i].getBoundingClientRect();
      if(y<r.top+r.height/2){ k=i; break; } }
    drag.alvo={terr:terr.getAttribute("data-terr"),k:k};
    if(k<cards.length)terr.insertBefore(linha,cards[k]);
    else { var ar=terr.querySelector(".addrow"); if(ar)terr.insertBefore(linha,ar); else terr.appendChild(linha); }
  }
  wrap.addEventListener("pointerdown",function(e){
    if(e.target.closest(".railfloat")||e.target.closest(".cvtools"))return;
    if(e.target.isContentEditable)return;
    if(e.target.closest("button")||e.target.closest("select")||e.target.closest("input"))return;
    var card=e.target.closest(".card");
    var t=e.target.closest(".terr");
    if(card){
      drag={m:"c",node:card,id:card.getAttribute("data-scn"),sx:e.clientX,sy:e.clientY,moved:false,alvo:null};
      return; }
    if(t&&!card){
      var id=t.getAttribute("data-terr"),k=s.territorios.map(function(x){return x.id;}).indexOf(id);
      if(k>=0){ var tp=tpos(s,k);
        drag={m:"t",k:k,sx:e.clientX,sy:e.clientY,ox:tp.x,oy:tp.y,node:t,moved:false};
        e.preventDefault();
        try{wrap.setPointerCapture(e.pointerId);}catch(err){}
        return; } }
    drag={m:"p",sx:e.clientX,sy:e.clientY,ox:CV.x,oy:CV.y,lim:!!card,moved:false};
    if(!card){ e.preventDefault(); try{wrap.setPointerCapture(e.pointerId);}catch(err){} }
  });
  wrap.addEventListener("pointermove",function(e){ if(!drag)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(drag.m==="c"){
      if(!drag.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        drag.moved=true; e.preventDefault();
        try{wrap.setPointerCapture(e.pointerId);}catch(err){}
        drag.node.classList.add("dragging"); drag.node.style.pointerEvents="none";
      }
      drag.node.style.transform="translate("+(dx/CV.z)+"px,"+(dy/CV.z)+"px)";
      marcarAlvo(e.clientX,e.clientY); return; }
    if(drag.m==="p"){
      if(drag.lim&&!drag.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        drag.moved=true; try{wrap.setPointerCapture(e.pointerId);}catch(err){} }
      CV.x=drag.ox+dx; CV.y=drag.oy+dy; apply(); }
    else { if(!drag.moved&&Math.abs(dx)<4&&Math.abs(dy)<4)return;
      drag.moved=true;
      var t=s.territorios[drag.k]; t.x=Math.round(drag.ox+dx/CV.z); t.y=Math.round(drag.oy+dy/CV.z);
      drag.node.style.left=t.x+"px"; drag.node.style.top=t.y+"px"; links(); } });
  wrap.addEventListener("pointerup",function(e){
    if(drag&&drag.m==="c"){
      drag.node.classList.remove("dragging"); drag.node.style.transform=""; drag.node.style.pointerEvents="";
      limparLinha();
      if(drag.moved){ supClick=true; setTimeout(function(){supClick=false;},60);
        if(drag.alvo)moverCena(s,drag.id,drag.alvo.terr,drag.alvo.k); }
    } else if(drag&&drag.m==="t"){ if(drag.moved)save(); }
    else if(drag&&drag.m==="p"&&drag.lim&&drag.moved){ supClick=true; setTimeout(function(){supClick=false;},60); }
    drag=null;
    try{wrap.releasePointerCapture(e.pointerId);}catch(err){} });
  wrap.addEventListener("pointercancel",function(){ if(drag&&drag.m==="c"){
      drag.node.classList.remove("dragging"); drag.node.style.transform=""; drag.node.style.pointerEvents=""; limparLinha(); }
    drag=null; });
  wrap.addEventListener("wheel",function(e){
    if(e.target.closest&&(e.target.closest(".railfloat")||e.target.closest(".cvtools")))return;
    e.preventDefault();
    var r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    var nz=Math.min(2.2*escalaRaiz(),Math.max(.22,CV.z*(e.deltaY<0?1.12:.89)));
    CV.x=mx-(mx-CV.x)*(nz/CV.z); CV.y=my-(my-CV.y)*(nz/CV.z); CV.z=nz; apply(); },{passive:false});
  $$("[data-z]",wrap).forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-z");
    if(k==="+")CV.z=Math.min(2.2*escalaRaiz(),CV.z*1.2); else if(k==="-")CV.z=Math.max(.22,CV.z/1.2);
    else enquadrar(); apply(); }; });
  function enquadrar(){
    var maxX=0,maxY=0;
    $$(".terr",cv).forEach(function(t){ maxX=Math.max(maxX,t.offsetLeft+t.offsetWidth); maxY=Math.max(maxY,t.offsetTop+t.offsetHeight); });
    var r=wrap.getBoundingClientRect(), pad=20;
    /* o painel pode estar em qualquer canto: desconta do lado em que ele esta */
    var rf=$("#railFloat"), rw=0, rr=0;
    if(rf&&!rf.hidden){ if(rf.offsetLeft+rf.offsetWidth/2<r.width/2)rw=rf.offsetLeft+rf.offsetWidth+16-pad;
      else rr=r.width-rf.offsetLeft+16-pad; }
    var av=Math.max(240,r.width-pad*2-rw-rr), ah=Math.max(200,r.height-pad*2);
    CV.z=Math.max(.16,Math.min(1.6*escalaRaiz(),Math.min(av/(maxX||1),ah/(maxY||1))));
    CV.x=pad+rw+Math.max(0,(av-(maxX||0)*CV.z)/2);
    CV.y=pad+Math.max(0,(ah-(maxY||0)*CV.z)/2);
    apply();
  }
  CV.fit=enquadrar;
  if(!CV.init){ CV.init=true; setTimeout(enquadrar,30); }
  $$(".card",cv).forEach(function(card){ card.addEventListener("click",function(e){
    if(supClick)return;
    if(e.target.closest("[data-act]"))return; abrirCenaModal(card.getAttribute("data-scn")); }); });
  painelMovel(wrap);
  var rb=$("#railBtn"); if(rb)rb.onclick=function(){ S.rail=!S.rail; $("#railFloat").hidden=!S.rail; rb.classList.toggle("on",S.rail); if(CV.fit)CV.fit(); };
}

/* Posicao e tamanho do painel do quadro. Fica no navegador (conveniencia de quem usa,
   nao dado da campanha), em px relativos ao quadro. */
function painelMovel(wrap){
  var rf=$("#railFloat"), hd=$("#rfHd"), gp=$("#rfGrip"); if(!rf||!hd||!gp)return;
  function ler(){ try{ return JSON.parse(localStorage.getItem("grim_painel")||"null"); }catch(e){ return null; } }
  function gravar(g){ try{ if(g)localStorage.setItem("grim_painel",JSON.stringify(g)); else localStorage.removeItem("grim_painel"); }catch(e){} }
  function aplicar(g){
    if(!g){ rf.style.left=rf.style.top=rf.style.width=rf.style.height=rf.style.bottom=""; return; }
    var W=wrap.clientWidth, H=wrap.clientHeight;
    var w=Math.max(200,Math.min(g.w,W-8)), h=Math.max(140,Math.min(g.h,H-8));
    rf.style.width=w+"px"; rf.style.height=h+"px"; rf.style.bottom="auto";
    rf.style.left=Math.max(0,Math.min(g.x,W-w))+"px"; rf.style.top=Math.max(0,Math.min(g.y,H-h))+"px";
  }
  function atual(){ return {x:rf.offsetLeft,y:rf.offsetTop,w:rf.offsetWidth,h:rf.offsetHeight}; }
  aplicar(ler());
  function arrastar(el,muda){
    el.addEventListener("pointerdown",function(e){
      if(e.button!==0)return;
      e.preventDefault(); e.stopPropagation();
      var g0=atual(), sx=e.clientX, sy=e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      function mv(ev){ aplicar(muda(g0,ev.clientX-sx,ev.clientY-sy)); }
      function up(){ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up);
        el.removeEventListener("pointercancel",up); gravar(atual()); if(CV.fit)CV.fit(); }
      el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
    });
  }
  arrastar(hd,function(g,dx,dy){ return {x:g.x+dx,y:g.y+dy,w:g.w,h:g.h}; });
  arrastar(gp,function(g,dx,dy){ return {x:g.x,y:g.y,w:g.w+dx,h:g.h+dy}; });
  hd.addEventListener("dblclick",function(){ gravar(null); aplicar(null); if(CV.fit)CV.fit(); });
}

            +porCat[ct].map(function(f){ return '<div class="arow"><div style="flex:1;min-width:10rem"><b>'+esc(f.nome)+'</b> '
              +'<span class="muted sm">'+mb(f.tamanho)+'</span></div>'

              +'<button class="tbtn" data-toca="'+esc(f.nome)+'">tocar</button>'
              +'<button class="tbtn d" data-del="'+f.id+'" data-nome="'+esc(f.nome)+'">remover</button></div>'; }).join("")
            +'</div></div>'; }).join("")
          :'<p class="empty">Nenhuma faixa ainda.</p>'; }

        alvo.innerHTML=figs.length?('<p class="sm muted">'+figs.length+' imagens</p><div class="eigrid">'+figs.map(function(x){
          return '<span class="pkit"><img src="'+esc(x.url)+'" alt="" loading="lazy" data-ver="'+esc(x.arquivo||("img/"+x.nome))+'" '
            +'data-cap="'+esc(x.nome)+'" style="cursor:zoom-in"><span class="cap">'+esc(x.nome)+'</span>'

    }).catch(function(e){ sc.disabled=false; sc.textContent="Reescanear o volume"; toast((e&&e.message)||"não deu"); }); };
}

/* Indice dos livros: atalhos para paginas do PDF, escritos como linhas de texto.
   Sem prefixo e um grupo; "-" e um item do grupo; "--" e um subitem. */
function indiceParaLinhas(d){ var l=[];
  function ln(pre,o){ l.push(pre+o.t+(o.p?" | "+o.p:"")); }
  (d.grupos||[]).forEach(function(g){ ln("",g);
    (g.itens||[]).forEach(function(it){ ln("- ",it); (it.sub||[]).forEach(function(s){ ln("-- ",s); }); }); });
  return l; }
function linhasParaIndice(l){ var gs=[],g=null,it=null;
  (l||[]).forEach(function(x){ var m=/^(-{0,2})\s*(.*?)\s*(?:\|\s*p?\.?\s*(\d+))?\s*$/.exec(x); if(!m||!m[2])return;
    var o={t:m[2]}; if(m[3])o.p=+m[3];
    if(m[1]==="--"&&it){ (it.sub=it.sub||[]).push(o); }
    else if(m[1]&&g){ it=o; g.itens.push(o); }
    else { g=o; g.itens=[]; it=null; gs.push(g); } });
  return gs; }
function editarIndice(){
  var c=D.campanha, abs=Object.keys(LIB.docs||{});
  formulario("Índice dos livros",[{k:"titulo",rot:"Título da seção"},

        {k:"linhas",rot:"Entradas",tipo:"linhas",linhas:10,
         dica:"Uma por linha: Título | página. Comece com - para um item dentro do anterior e com -- para um subitem."}]}],

     livros:c.indiceAS.map(function(d){return {doc:d.doc,nome:d.nome,linhas:indiceParaLinhas(d)};})},
    {wide:true,salvar:function(w){
      c.indiceTitulo=String(w.titulo||"").trim()||"Índice dos livros";
      c.indiceAS=(w.livros||[]).filter(function(l){return String(l.doc||"").trim();}).map(function(l){

}

  var reg=(D.trilhaCategorias||[]).filter(function(x){return x.id===nome;})[0];

  if(reg&&reg.cor&&!ops.some(function(o){return o[0]===reg.cor;}))ops.push([reg.cor,"cor atual"]);

    {nome:nome,cor:reg?reg.cor:""},{salvar:function(w){

/* ---------- ESCOLHER IMAGEM ---------- */
/* Devolve o caminho relativo ("img/x.webp"), "" para tirar a imagem, ou null
   se a pessoa fechou sem escolher. Guardamos o caminho relativo e nao a URL:
   e isso que o IMG() sabe resolver, e e isso que o pacote carrega. */
function escolherImagem(atual){
  return new Promise(function(res){
    var escolhido=null, resolvido=false;
    var ov=overlay("Escolher imagem",
      '<p class="sm muted" style="margin:0 0 .625rem">As imagens da '+esc(V("campanha").toLowerCase())
        +'. Envie uma nova se a que você quer ainda não está aqui.</p>'
      +'<div id="eiList"><p class="muted sm">carregando…</p></div>'
      +'<div class="addrow" style="margin-top:.875rem">'
      +'<button class="btn" id="eiUp">Enviar imagem nova</button>'
      +'<button class="btn sec" id="eiClr">Deixar sem imagem</button></div>',
      {wide:true});
    var fechar=ov.close;
    ov.close=function(){ if(!resolvido){ resolvido=true; res(escolhido); } fechar(); };
    function pinta(figs){
      var alvo=$("#eiList",ov);
      if(!figs.length){ alvo.innerHTML='<p class="empty">Nenhuma imagem nesta '+esc(V("campanha").toLowerCase())+' ainda.</p>'; return; }
      alvo.innerHTML='<div class="eigrid">'+figs.map(function(x){
        var rel=x.arquivo||("img/"+x.nome);
        return '<button type="button" data-pick="'+esc(rel)+'"'+(rel===atual?' class="on"':'')+'>'
          +'<img src="'+esc(x.url)+'" alt="" loading="lazy">'
          +'<span class="cap">'+esc(x.nome)+'</span></button>';
      }).join("")+'</div>';
      $$("[data-pick]",ov).forEach(function(b){ b.onclick=function(){
        escolhido=b.getAttribute("data-pick"); ov.close();
      };});
    }
    function carrega(){
      api(cAPI("/midia")).then(function(c){ pinta((c&&c.imagens)||[]); })
        .catch(function(e){ $("#eiList",ov).innerHTML='<p class="empty">'+esc((e&&e.message)||"não deu para listar")+'</p>'; });
    }
    carrega();
    $("#eiClr",ov).onclick=function(){ escolhido=""; ov.close(); };
    $("#eiUp",ov).onclick=function(){
      escolherArquivos(false,"image/*").then(function(fs){
        if(!fs.length)return;
        var b=$("#eiUp",ov); b.disabled=true; b.textContent="Enviando…";
        var ultimo=null;
        fs.reduce(function(fila,f){
          return fila.then(function(){ return subirImagem(f).then(function(r){ ultimo=r&&r.arquivo; }); });
        },Promise.resolve()).then(function(){
          b.disabled=false; b.textContent="Enviar imagem nova";
          recarregaCatalogo();
          if(fs.length===1&&ultimo){ escolhido=ultimo; ov.close(); return; }
          carrega(); toast(fs.length+" imagens enviadas");
        }).catch(function(e){
          b.disabled=false; b.textContent="Enviar imagem nova";
          toast((e&&e.message)||"não deu para enviar");
        });
      });
    };
  });
}
function subirImagem(f){
  var fd=new FormData();
  fd.append("nome",f.name.replace(/\.[^.]+$/,""));
  fd.append("arquivo",f);
  return upload(cAPI("/midia/img"),fd);
}

  var kh=function(e){ if(!document.body.contains(ov))return;

    document.removeEventListener("keydown",kh); window.removeEventListener("resize",rz); mo.disconnect();} });
  mo.observe($("#layer"),{childList:true});

/* ---------- indice de busca: tokens + fallback ---------- */
var IDXN=null;
function invalidaIndice(){ IDXN=null; }
function prepararIndice(){
  if(IDXN||!IDX||!IDX.pages)return IDXN;
  var pg=[],sq=[],tok={},i,j;
  for(i=0;i<IDX.pages.length;i++){
    var t=norm(IDX.pages[i].t||"");
    pg.push(t); sq.push(t.replace(/[^a-z0-9]+/g,""));
    var ws=t.split(/[^a-z0-9]+/), vis={};
    for(j=0;j<ws.length;j++){ var w=ws[j];
      if(w.length<2||vis[w])continue; vis[w]=1;
      (tok[w]||(tok[w]=[])).push(i); }
  }
  IDXN={pg:pg,sq:sq,tok:tok,keys:Object.keys(tok)};
  return IDXN;
}
function defineTermo(txt,t){
  try{ return new RegExp("(^|[.\\n;:»])\\s*"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[.:•]\\s+[a-zà-ÿA-Z(\"]","i").test(txt); }catch(e){ return false; }
}
function buscaDocs(q,fd,fc){
  if(!IDX||!IDX.pages||!IDX.pages.length)return [];
  var N=prepararIndice(); if(!N)return [];
  var k=norm(q).trim(); if(k.length<2)return [];
  var termos=k.split(/\s+/).filter(function(x){return x.length>=2;});
  if(!termos.length)return [];
  var cat=catsBusca().filter(function(c){return c.id===fc;})[0], ab={};
  IDX.docs.forEach(function(d){ab[d.id]=d.abrev;});

  var SIN=(PUBD().sinonimos||{});
  function mapaDe(t,peso){
    var m={},w,key;
    if(N.tok[t])N.tok[t].forEach(function(i){ m[i]=peso; });
    if(t.length>=4){
      for(w=0;w<N.keys.length;w++){ key=N.keys[w];
        if(key.length>t.length&&key.indexOf(t)===0)
          N.tok[key].forEach(function(i){ if(!m[i])m[i]=Math.round(peso*0.65); }); }
    }
    if(!Object.keys(m).length){
      var sqt=t.replace(/[^a-z0-9]+/g,"");
      if(sqt.length>=4)for(w=0;w<N.sq.length;w++) if(N.sq[w].indexOf(sqt)>=0)m[w]=Math.round(peso*0.35);
    }
    return m;
  }
  var alt=SIN[k]||null;
  var frases=[]; if(termos.length>1)frases.push(termos.join(" "));
  (alt||[]).forEach(function(sy){ var f=norm(sy); if(f.indexOf(" ")>0)frases.push(f); });
  termos.forEach(function(t){ (SIN[t]||[]).forEach(function(sy){ var f=norm(sy); if(f.indexOf(" ")>0&&frases.indexOf(f)<0)frases.push(f); }); });
  var mapas=termos.map(function(t){
    var m=mapaDe(t,t.length<=3?8:14);
    var ex=(alt&&termos.length===1)?alt:(SIN[t]||[]);
    ex.forEach(function(sy){
      var sub=norm(sy).split(/\s+/), mm=null;
      sub.forEach(function(st){ var x=mapaDe(st,7);
        if(mm===null)mm=x; else { var u={}; Object.keys(x).forEach(function(i){ if(mm[i]!=null)u[i]=Math.min(mm[i],x[i]); }); mm=u; } });
      if(mm)Object.keys(mm).forEach(function(i){ if(m[i]==null)m[i]=mm[i]; });
    });
    return m;
  });

  var base=Object.keys(mapas[0]), out=[];
  base.forEach(function(ix){
    var i=+ix, sc=0, ok=true;
    for(var z=0;z<mapas.length;z++){ if(mapas[z][i]==null){ok=false;break;} sc+=mapas[z][i]; }
    if(!ok)return;
    var pgo=IDX.pages[i];
    if(fd&&fd!=="todos"&&pgo.d!==fd)return;
    var txt=N.pg[i], sec=norm(pgo.s||"");
    /* indice extraido pelo servidor nao tem titulo de secao: o comeco da pagina faz as vezes */
    if(cat&&cat.termos&&!cat.termos.some(function(t){return sec.indexOf(t)>=0||txt.slice(0,260).indexOf(t)>=0;}))return;
    var emTit=0; termos.forEach(function(t){ if(sec.indexOf(t)>=0)emTit++; });
    if(emTit===termos.length)sc+=70; else if(emTit)sc+=32;
    var pos=txt.indexOf(termos[0]);
    if(pos>=0&&pos<320)sc+=20;
    else if(pos>=0&&txt.length&&pos<txt.length*0.15)sc+=10;
    var n=0,pp=txt.indexOf(termos[0]);
    while(pp>=0&&n<6){n++;pp=txt.indexOf(termos[0],pp+termos[0].length);}
    sc+=Math.min(4,n-1)*2;
    if(defineTermo(txt,termos[0]))sc+=70;
    var fr=0;
    for(var fi=0;fi<frases.length;fi++){ var fp=txt.indexOf(frases[fi]);
      if(fp>=0){ fr=Math.max(fr,55); if(fp<320)fr=Math.max(fr,75); if(defineTermo(txt,frases[fi]))fr=Math.max(fr,95); } }
    sc+=fr;
    if(!fr&&termos.length>1){
      var a=txt.indexOf(termos[0]), b2=txt.indexOf(termos[1]);
      if(a>=0&&b2>=0&&Math.abs(a-b2)<120)sc+=20;
    }
    if(/indice remissivo|sumario|creditos|folha de rosto|sobrecapa/.test(sec))sc-=120;
    out.push({sc:sc,i:i,d:pgo.d,p:pgo.p,s:pgo.s,sn:trecho(pgo.t,termos[0])||String(pgo.t||"").replace(/\s+/g," ").slice(0,150),ab:ab[pgo.d]||pgo.d});
  });
  out.sort(function(a,b){return b.sc-a.sc;});

  var CAN=(PUBD().canonicas||{}), fix=CAN[k];
  if(fix&&fix.length){
    var pin=[],vistos={};
    fix.forEach(function(e){
      var abv=String(e[0]).toUpperCase(), num=e[1], rot=e[2]||"";
      if(fd&&fd!=="todos"&&String(ab[fd]||"").toUpperCase()!==abv)return;
      for(var i=0;i<IDX.pages.length;i++){ var pgo=IDX.pages[i];
        if(pgo.p!==num)continue;
        if(String(ab[pgo.d]||pgo.d).toUpperCase()!==abv)continue;
        var ch=abv+":"+num; if(vistos[ch])return; vistos[ch]=1;
        pin.push({sc:9999,i:i,d:pgo.d,p:num,s:rot||pgo.s,ab:abv,canon:true,
          sn:trecho(pgo.t,termos[0])||String(pgo.t||"").replace(/\s+/g," ").slice(0,150)});
        return; }
    });
    if(pin.length){
      var fora={}; pin.forEach(function(x){fora[x.ab+":"+x.p]=1;});
      out=pin.concat(out.filter(function(x){return !fora[x.ab+":"+x.p];}));
    }
  }
  return out.slice(0,50);
}

/* ---------- leitor de pagina (texto extraido) ---------- */
function paginaDe(doc,num){
  if(!IDX||!IDX.pages)return null;
  for(var i=0;i<IDX.pages.length;i++){ var p2=IDX.pages[i];
    if(p2.p===num&&(p2.d===doc||(p2.d||"").toUpperCase()===String(doc).toUpperCase()))return p2; }
  return null;
}
function docIdPorAbrev(ab){ var r=null;
  (IDX&&IDX.docs||[]).forEach(function(d){ if((d.abrev||"").toUpperCase()===String(ab).toUpperCase())r=d.id; });
  return r||ab; }
function abrirResultado(ab,num,q,back){
  var abv=String(ab).toUpperCase();
  if(LIB.ok&&LIB.docs[abv]){ abrirPdf(abv,num,back); return; }
  abrirPagina(ab,num,q,back);
}
function abrirPagina(ab,num,q,back){

  var temPdf=!!(LIB.ok&&LIB.docs[String(ab).toUpperCase()]);
  var corpo=String(pg.t||"").replace(/­/g,"").split(/\n{2,}/).map(function(b){
    return '<p>'+(q?marca(b.replace(/\s*\n\s*/g," "),q):esc(b.replace(/\s*\n\s*/g," ")))+'</p>'; }).join("");
  var head='<button class="ibtn" id="pgPrev" title="Página anterior">&#8249;</button>'
    +'<span class="sm muted">'+esc(refDoc(ab,num))+'</span>'
    +'<button class="ibtn" id="pgNext" title="Próxima página">&#8250;</button>';
  var ov=overlay(pg.s||"Página "+num,
    '<div class="pgtxt">'+corpo+'</div>'
    +'<div class="addrow" style="margin-top:1rem">'
    +(temPdf?'<button class="btn" id="pgPdf">Abrir o PDF nesta página</button>':'<span class="sm muted">Conecte a pasta da campanha para ver a página original do PDF.</span>')
    +'</div><p class="sm muted" style="margin-top:.625rem">Texto extraído do PDF. Tabelas e colunas podem sair embaralhadas; o livro manda.</p>',
    {wide:true,cls:"pgsheet",back:back,head:head});
  var pp=$("#pgPrev",ov); if(pp)pp.onclick=function(){ ov.close(); abrirPagina(ab,num-1,q,back); };
  var pn=$("#pgNext",ov); if(pn)pn.onclick=function(){ ov.close(); abrirPagina(ab,num+1,q,back); };
  var kp=function(e){ if(!document.body.contains(ov)){document.removeEventListener("keydown",kp);return;}
    if(e.target&&(e.target.isContentEditable||/input|textarea|select/i.test(e.target.tagName)))return;
    if(e.key==="ArrowLeft"){e.preventDefault();ov.close();abrirPagina(ab,num-1,q,back);}
    else if(e.key==="ArrowRight"){e.preventDefault();ov.close();abrirPagina(ab,num+1,q,back);} };
  document.addEventListener("keydown",kp);
  var pf=$("#pgPdf",ov); if(pf)pf.onclick=function(){ ov.close(); abrirPdf(String(ab).toUpperCase(),num,function(){abrirPagina(ab,num,q,back);}); };
}

function abrirBusca(){
  var ov=overlay("Buscar",'<div class="sfield">'
    +'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>'

    +'<div class="askrow"><button class="btn sec" id="askAI" hidden></button></div>'
    +'<div id="bf"></div><div class="res" id="br"></div>',{wide:true});
  var inp=$("#bq",ov);
  var SEL=-1;
  function ritens(){ return $$(".rit",$("#br",ov)); }
  function selMark(){ var L=ritens(); L.forEach(function(b,i){b.classList.toggle("sel",i===SEL);});
    if(SEL>=0&&L[SEL]&&L[SEL].scrollIntoView)L[SEL].scrollIntoView({block:"nearest"}); }
  function selInit(){ SEL=ritens().length?0:-1; selMark(); }
  function selMov(d){ var L=ritens(); if(!L.length)return;
    SEL=(SEL<0?(d>0?-1:0):SEL)+d; if(SEL<0)SEL=L.length-1; if(SEL>=L.length)SEL=0; selMark(); }
  ov.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){e.preventDefault();selMov(1);}
    else if(e.key==="ArrowUp"){e.preventDefault();selMov(-1);}
    else if(e.key==="Enter"){ var L=ritens(), b=L[SEL>=0?SEL:0]; if(b){e.preventDefault();b.click();} } });
  $("#br",ov).addEventListener("pointerover",function(e){

  function filtros(){ var f=$("#bf",ov);

    var cs=catsBusca(); if(!cs.some(function(c){return c.id===BUSCA.fcat;}))BUSCA.fcat="tudo";

      +'</div>'+(cs.length>1?'<div class="fchips"><span class="flbl">Assunto</span>'

    $$("[data-fd]",f).forEach(function(b){b.onclick=function(){BUSCA.fdoc=b.getAttribute("data-fd");filtros();run();};});
    $$("[data-fc]",f).forEach(function(b){b.onclick=function(){BUSCA.fcat=b.getAttribute("data-fc");filtros();run();};}); }

  function grupo(box,titulo,extra){
    var d=el("div",{"class":"grp"});
    d.innerHTML='<div class="grph"><span>'+esc(titulo)+'</span>'+(extra||"")+'</div>';
    box.appendChild(d); return d; }
  function item(pai,src,classe,ti,sub,sn,q,go){
    var b=el("button",{"class":"rit"});
    b.innerHTML='<span class="rsrc '+classe+'">'+esc(src)+'</span><span><span class="rti">'+marca(ti,q)+'</span>'
      +(sub?'<span class="rsub">'+esc(sub)+'</span>':"")+(sn?'<div class="rsn">'+marca(sn,q)+'</div>':"")+'</span>';
    b.onclick=go; pai.appendChild(b); return b; }

  var TRECHOS=[];
  var ai=$("#askAI",ov), aiPronto=false;
  if(ai){ ai.textContent=iaPergunta();
    aiPronto=true; ai.hidden=!(inp.value.trim().length>=2);
    ai.onclick=function(){ var qq=inp.value.trim(); if(qq.length<2){inp.focus();return;}
      ov.close(); perguntarClaude(qq,TRECHOS,voltarBusca); }; }
  function run(){ BUSCA.q=inp.value.trim(); var q=BUSCA.q, box=$("#br",ov);
    if(ai&&aiPronto)ai.hidden=!(q.length>=2);
    TRECHOS=[];
    if(q.length<2){ box.innerHTML='<p class="empty">Digite ao menos 2 letras. A busca varre a campanha, a consulta rápida e '
      +((IDX&&IDX.pages&&IDX.pages.length)||0)+' páginas dos livros de uma vez.</p>'; SEL=-1; return; }
    box.innerHTML="";
    var achouAlgo=false;

    (PUBD().referencia||[]).forEach(function(g){ (g.itens||[]).forEach(function(x){

    if(rg.length){ achouAlgo=true;
      var g1=grupo(box,"Consulta rápida");

        function(){ ov.close(); S.view="mesa"; S.msec="regras"; render(); }); }); }

    var g3=grupo(box,"Nos livros",'<span class="grpn" id="bn">…</span>');

        +'</p>'; }
      else {
        r.forEach(function(x){ item(g3,refDoc(x.ab,x.p),x.canon?"canon":"",x.s||"(sem seção)",

          function(){ ov.close(); abrirResultado(x.ab,x.p,q,voltarBusca); }); });

      if(!achouAlgo&&!r.length)box.innerHTML='<p class="empty">Nada encontrado.</p>';

    selInit();

  var t=null; inp.oninput=function(){clearTimeout(t);t=setTimeout(run,200);};
  carregaIndice().then(filtros);
  run(); setTimeout(function(){inp.focus();inp.select();},30);
}

function upload(url,fd,onProg){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open("POST",url,true); x.withCredentials=true;
    var t=cookie("XSRF-TOKEN"); if(t)x.setRequestHeader("X-XSRF-TOKEN",t);
    if(x.upload)x.upload.onprogress=function(e){ if(e.lengthComputable&&onProg)onProg(e.loaded/e.total); };
    x.onload=function(){ var b=null; try{ b=JSON.parse(x.responseText); }catch(e){}
      if(x.status>=200&&x.status<300)res(b||{});
      else rej(new Error((b&&b.erro)||("HTTP "+x.status))); };
    x.onerror=function(){ rej(new Error("falha de rede")); };
    x.ontimeout=function(){ rej(new Error("tempo esgotado")); };
    x.send(fd);
  });
}
function mb(n){ n=+n||0; if(n<1024)return n+" B";
  if(n<1048576)return (n/1024).toFixed(0)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(1)+" MB";
  return (n/1073741824).toFixed(2)+" GB"; }
function abrevDe(nome){
  var base=nome.replace(/\.pdf$/i,"");
  var ab=norm(base).replace(/[^a-z0-9 ]+/g," ").trim().split(/\s+/)
    .map(function(w){return /^\d+$/.test(w)?w:w[0];}).join("").toUpperCase().slice(0,8)||"DOC";
  return {ab:ab,nome:base};
}
function escolherArquivos(pasta,aceita){
  return new Promise(function(res){
    var inp=el("input",{type:"file"});
    if(pasta)inp.webkitdirectory=true; else inp.multiple=true;
    if(aceita)inp.accept=aceita;
    inp.style.display="none"; document.body.appendChild(inp);
    inp.onchange=function(){ var fs=Array.prototype.slice.call(inp.files||[]); inp.remove(); res(fs); };
    inp.click();
  });
}

function pistaPorImg(src){ return ((D.elenco&&D.elenco.pistas)||[]).filter(function(h){return h.img&&h.img===src;})[0]||null; }
/* A mesa guarda uma copia do que foi liberado, porque o jogador nao le o guia.
   A copia e achada pelo id; as liberadas antes da v3 so tem nome. */
function snapDe(tp,x){
  return tp==="pistas"?{id:x.id,nome:x.nome,img:x.img||"",texto:x.texto||""}
                      :{id:x.id,nome:x.nome,img:x.img||"",desc:x.desc||""};
}
function achaLib(tp,x){ var l=MESA[EL[tp].lib]||[];
  for(var i=0;i<l.length;i++){ if(l[i].id?l[i].id===x.id:l[i].nome===x.nome)return i; }
  return -1; }
function jaLib(tp,x){ return !!(x&&EL[tp]&&EL[tp].lib)&&achaLib(tp,x)>=0; }
function liberar(tp,x){ var k=EL[tp].lib; MESA[k]=MESA[k]||[];
  var i=achaLib(tp,x); if(i>=0)MESA[k][i]=snapDe(tp,x); else MESA[k].push(snapDe(tp,x)); }
function tirar(tp,x){ var i=achaLib(tp,x); if(i>=0)MESA[EL[tp].lib].splice(i,1); }
function alternaLib(tp,x){ var on=jaLib(tp,x); if(on)tirar(tp,x); else liberar(tp,x); salvarMesa(); return !on; }
/* editou algo que ja esta liberado: a copia da mesa acompanha */
function sincLib(tp,x){ if(jaLib(tp,x)){ liberar(tp,x); salvarMesa(); } }

function idxCena(s,id){ for(var i=0;i<s.cenas.length;i++) if(s.cenas[i].id===id)return i; return -1; }
function moverCena(s,id,terrId,k){
  var i=idxCena(s,id); if(i<0)return;
  var c=s.cenas.splice(i,1)[0];
  c.territorio=terrId;
  var lista=s.cenas.filter(function(x){return x.territorio===terrId;});
  var destino;
  if(k>=lista.length) destino=lista.length?(s.cenas.indexOf(lista[lista.length-1])+1):s.cenas.length;
  else destino=s.cenas.indexOf(lista[k]);
  s.cenas.splice(destino,0,c);
  save(); render();
}

function aplicarEncerramento(s){
  var pend=s.cenas.filter(function(c){return !c.feito;}), prox=null, movTerr=[];
  if(pend.length){
    prox=D.sessoes.filter(function(x){return x.numero===s.numero+1;})[0];
    if(!prox)prox=D.sessoes[novaSessao(s.numero+1)];
    pend.forEach(function(c){
      var t=(s.territorios||[]).filter(function(x){return x.id===c.territorio;})[0];
      if(t&&!prox.territorios.filter(function(x){return x.id===t.id;})[0]){
        prox.territorios.push({id:t.id,nome:t.nome,cor:t.cor}); movTerr.push(t.nome); } });
    ["npcIds","localIds","pistaIds"].forEach(function(k){
      (s[k]||[]).forEach(function(id){ if(prox[k].indexOf(id)<0)prox[k].push(id); }); });
    s.cenas=s.cenas.filter(function(c){return !!c.feito;});
    prox.cenas=prox.cenas.concat(pend);
    /* o territorio que a sessao nova ganhou ao nascer sai se ficou vazio */
    if(prox.territorios.length>1&&prox.territorios[0].padrao
       &&!prox.cenas.some(function(c){return c.territorio===prox.territorios[0].id;}))prox.territorios.shift();
  }

    h.push('<div class="fld" style="margin-top:.75rem"><span class="flb">'+t+' ('+l.length+')</span><ul class="fl">'
      +l.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'); }
  bloco(Vm("cenas")+" que passaram adiante",pend.map(function(c){return c.n+" · "+c.titulo;}));

  $("#encDep",ov).onclick=function(){ ov.close(); };
  $("#encRes",ov).onclick=function(){ ov.close();
    var hoje=""; try{ hoje=new Date().toLocaleDateString("pt-BR"); }catch(e){}
    editarResumo(-1,{n:s.numero,titulo:s.titulo,data:hoje,texto:""}); };
}

/* ---------- RENDER ---------- */
function renderTabs(){
  var t=$("#tabs"); t.innerHTML="";
  function tab(id,label,cur){ var b=el("button",{"class":"tab",text:label});
    b.setAttribute("aria-current",cur?"true":"false");
    b.onclick=function(){ S.view=id; render(); };
    t.appendChild(b); }
  if(!CID||S.view==="semcampanha"||S.view==="escolher")return;
  if(!GM){ tab("mesa",Vm("mesa"),S.view==="mesa"); return; }
  tab("home",Vm("campanha"),S.view==="home");
  tab("sessoes",Vm("sessoes"),S.view==="sessoes"||S.view==="sessao");
  tab("elenco","Elenco",S.view==="elenco");
  tab("biblioteca","Biblioteca",S.view==="biblioteca");
  tab("mesa",Vm("mesa"),S.view==="mesa");
}
/* Redesenhar a mesma tela nao pode jogar a rolagem para o topo: era isso que fazia
   cada "adicionar" levar a pessoa de volta ao comeco da pagina. */
var ULT="";
function render(){
  if(CID&&!GM&&S.view!=="ajustes")S.view="mesa";
  if(S.view==="sessao"&&!curSess())S.view="sessoes";
  renderTabs();
  var v=$("#view"), board=(GM&&S.view==="sessao"&&S.vmode==="canvas");
  document.body.classList.toggle("board",board);
  v.classList.toggle("board",board);
  document.body.classList.toggle("jogador",!GM&&!!CID);
  document.body.classList.toggle("fora",!CID);
  document.documentElement.style.setProperty("--hh",($(".top").offsetHeight||56)+"px");
  pintarMarca();
  var chave=[S.view,S.view==="sessao"?S.sessao+S.vmode:"",S.view==="elenco"?S.el:"",S.view==="biblioteca"?S.bib:"",
    S.view==="ajustes"?S.aj:"",S.view==="mesa"?S.msec:"",CID].join("|");
  var y=window.scrollY||0, mesma=(chave===ULT); ULT=chave;
  try{
    if(S.view==="semcampanha")v.innerHTML=viewSemCampanha();
    else if(S.view==="escolher")v.innerHTML=viewEscolher();
    else if(S.view==="ajustes")v.innerHTML=viewAjustes();
    else if(S.view==="mesa")v.innerHTML=viewMesa();
    else if(S.view==="home")v.innerHTML=viewHome();
    else if(S.view==="sessoes")v.innerHTML=viewSessoes();
    else if(S.view==="elenco")v.innerHTML=viewElenco();
    else if(S.view==="biblioteca")v.innerHTML=viewBiblioteca();
    else v.innerHTML=viewSessao();
  }catch(err){
    v.innerHTML='<div class="panel" style="padding:1.125rem;margin-top:1.25rem"><h2 class="sec">Falhou ao montar esta aba</h2>'
      +'<p class="lead">'+esc(String((err&&err.message)||err))+'</p>'
      +'<p class="sm muted">'+esc(String((err&&err.stack)||"").split("\n").slice(0,4).join(" | "))+'</p></div>';
    try{toast("Erro ao abrir "+S.view+": "+((err&&err.message)||err));}catch(_){}
  }
  try{
    if(S.view==="semcampanha"||S.view==="escolher")hydrateCampanhas(v);
    else if(S.view==="ajustes")hydrateAjustes(v);
    else if(S.view==="mesa")hydrateMesa();
    else if(S.view==="home")hydrateHome(v);
    else if(S.view==="sessoes")ligarSessoes(v);
    else if(S.view==="elenco")hydrateElenco(v);
    else if(S.view==="biblioteca")hydrateBiblioteca(v);
  }catch(err2){ try{toast("Erro ao ligar os controles: "+((err2&&err2.message)||err2));}catch(_){} }
  if(S.view==="sessao")try{
    var eb=$("#encBtn",v); if(eb)eb.onclick=function(){encerrarSessao();};
    var lb=$("#libBtn",v); if(lb)lb.onclick=function(){abrirLiberar();};
    var se=$("#sesEd",v); if(se)se.onclick=function(){editarSessao(curSess());};
    var sv=$("#sesVolta",v); if(sv)sv.onclick=function(){ S.view="sessoes"; render(); };
    $$("[data-vm]",v).forEach(function(b){b.onclick=function(){S.vmode=b.getAttribute("data-vm");render();};});
    hydrateCena(v);
    /* cena e caixa do painel lembram se estavam abertas: editar um bloco redesenha a
       tela, e sem isso a cena em que a pessoa estava fechava na cara dela */
    $$("details.scn",v).forEach(function(d){ d.addEventListener("toggle",function(){
      var id=d.id.replace(/^scn-/,"");
      if(!d.open){ if(S.aberta===id)S.aberta=null; return; }
      S.aberta=id;
      $$("details.scn",v).forEach(function(o){ if(o!==d&&o.open)o.open=false; }); }); });
    $$(".railfloat details.rbox, aside.rail details.rbox",v).forEach(function(d){
      d.addEventListener("toggle",function(){ var k=d.getAttribute("data-rb");
        if(!d.open){ if((S.rbox||"obrig")===k)S.rbox="-"; return; }
        S.rbox=k;
        $$("details.rbox",d.parentNode).forEach(function(o){ if(o!==d&&o.open)o.open=false; }); }); });
    if(board)initCanvas(curSess());
  }catch(err3){ try{toast("Erro na sessão: "+((err3&&err3.message)||err3));}catch(_){} }
  var ba=$("#btnAjustes"); if(ba)ba.classList.toggle("on",S.view==="ajustes");
  try{ if(!board)window.scrollTo(0,mesma?y:0); }catch(_){}
}

/* ---------- BOOT ---------- */
window.addEventListener("error",function(e){ try{ if(e&&e.message)toast("Erro: "+e.message); }catch(_){} });
window.addEventListener("unhandledrejection",function(e){ try{ var r=e&&e.reason;
  toast("Falha: "+((r&&r.message)||r||"desconhecida")); }catch(_){} });
$("#btnBusca").onclick=function(){abrirBusca();};
$("#btnTrilha").onclick=function(){abrirTrilha();};
$("#nbName").onclick=function(){abrirTrilha();};
$("#nbPlay").onclick=function(){ if(!PL.cur)return; if(PL.cur.paused)PL.cur.play(); else PL.cur.pause(); playerUI(); };
$("#nbStop").onclick=function(){ parar(); };
$("#nbLoop").onclick=function(){ PL.loop=!PL.loop; if(PL.cur)PL.cur.loop=PL.loop; playerUI();
  var lp=$("#plLoop"); if(lp){lp.setAttribute("aria-pressed",PL.loop);lp.textContent="Loop "+(PL.loop?"ligado":"desligado");}
  toast(PL.loop?"Loop ligado":"Loop desligado"); };
$("#btnAjustes").onclick=function(){
  if(S.view==="ajustes"){
    S.view=S.antes||(CID?(GM?"home":"mesa"):(CAMPANHAS.length?"escolher":"semcampanha")); }
  else { S.antes=S.view; S.view="ajustes"; }
  render(); };
/* Ctrl+F fica com o navegador: sequestrar a busca da pagina surpreendia.
   A busca do app abre com "/" (fora de campo de texto) ou Ctrl+K. */
document.addEventListener("keydown",function(e){
  if(!CID)return;
  if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); e.stopPropagation(); abrirBusca(); return; }
  var tag=(e.target&&e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||(e.target&&e.target.isContentEditable))return;
  if($(".ov")||$(".proj"))return;
  if(e.key==="/"&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); abrirBusca(); }
},true);
var bh=document.getElementById("brandHome");
  if(bh){
    bh.onclick=function(){ if(PRONTO||CID)trocarCampanha(); };
    bh.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); bh.onclick(); } };
  }
  window.addEventListener("resize",function(){
  document.documentElement.style.setProperty("--hh",($(".top").offsetHeight||56)+"px"); });
boot();
})();
</script>
</body>
</html>
