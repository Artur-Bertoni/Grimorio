<!-- Janela (overlay), projecao em tela cheia e fichas do elenco abertas (js/janelas.js) -->

<!-- tid: id do titulo, que da nome ao dialogo; alerta: confirmacao (role alertdialog) -->
<template id="t-janela">
  <div :class="'sheet' + (wide ? ' wide' : '') + (cls ? ' ' + cls : '')" :role="alerta ? 'alertdialog' : 'dialog'" aria-modal="true" :aria-labelledby="tid">
    <div class="shead">
      <button v-if="voltar" type="button" class="backb" data-back>‹ Voltar</button>
      <h2 :id="tid" class="stit">{{ titulo }}</h2><span data-solta v-html="cabeca"></span><button type="button" class="x" aria-label="Fechar" title="Fechar (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="sbodyscroll" v-html="corpo"></div>
  </div>
</template>

<template id="t-projecao">
  <img :src="src" :alt="legenda || 'Imagem em tela cheia'">
  <div v-if="legenda" class="cap" id="projCap">{{ legenda }}</div>
  <div class="projbar"><span data-solta v-html="liberar"></span><button type="button" class="btn sec" data-close>Fechar</button></div>
</template>

<!-- confirmacao do que nao tem volta (js/camadas.js) -->
<template id="t-confirmar">
  <p class="lead confirmatx">{{ texto }}</p>
  <p v-if="detalhe" class="sm muted">{{ detalhe }}</p>
  <div class="formft"><button type="button" class="btn sec" data-nao>{{ nao }}</button><span class="esp"></span><button type="button" :class="'btn' + (perigo ? ' dang' : '')" data-sim>{{ sim }}</button></div>
</template>

<!-- tarefa demorada (js/envio.js, tarefaLonga): a barra enquanto trabalha, o resultado no fim -->
<template id="t-tarefa">
  <div class="tarefa">
    <div data-andando>
      <p class="tarefatx" data-tx aria-live="polite">{{ texto }}</p>
      <progress class="tarefabar" max="100" :aria-label="titulo" data-bar></progress>
      <p class="sm muted tarefapct" data-pct></p>
      <p class="sm muted m0">Espere terminar antes de sair desta tela ou fechar a página.</p>
    </div>
    <div data-fim hidden>
      <p class="tarefafim" data-fimtx></p>
      <ul class="sm muted tarefaerros" data-erros hidden></ul>
      <div class="formft"><span class="esp"></span><button type="button" class="btn" data-ok>Ok</button></div>
    </div>
  </div>
</template>

<template id="t-item-elenco">
  <div style="display:flex;gap:1rem;flex-wrap:wrap">
    <img v-if="img" :src="img" :alt="nome ? 'Imagem de ' + nome : ''" data-proj tabindex="0" role="button" :style="'width:min(100%,' + largura + 'rem);align-self:flex-start;border:1px solid var(--line2);border-radius:3px;cursor:zoom-in'">
    <div style="flex:1;min-width:14.375rem;display:flex;flex-direction:column;gap:.75rem">
      <p v-if="texto" class="lead sectxt m0">{{ texto }}</p>
      <p v-else class="muted sm m0">Sem descrição ainda.</p>
      <div v-if="segredo" class="segredo"><span class="lb">Só você vê</span><span class="sectxt">{{ segredo }}</span></div>
      <div class="addrow">
        <button v-if="img" class="btn" data-proj>Mostrar em tela cheia</button>
        <span data-solta v-html="liberar"></span>
        <button v-if="mestre" class="btn sec ico" id="itEd" title="Editar" aria-label="Editar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button>
        <button v-if="mestre && sessao" class="btn sec" id="itTira">Tirar desta {{ sessao }}</button>
      </div>
    </div>
  </div>
</template>

<template id="t-fichas-imagem">
  <div class="imgrow" style="gap:.625rem">
    <button v-for="(f, i) in fichas" type="button" class="fichaimg" :data-f="f.rel" :aria-label="'Abrir a ficha ' + (i + 1) + ' em tela cheia'"><img :src="f.url" alt="" loading="lazy"></button>
  </div>
  <p class="sm muted mt-3">Clique para abrir em tela cheia.</p>
</template>
