<!-- Seletor de imagem (js/imagens.js) e Minha conta (js/conta.js) -->

<template id="t-imagens">
  <p class="sm muted mb-3 mt-0">As imagens da {{ campanha }}. Envie uma nova se a que você quer ainda não está aqui.</p>
  <div id="eiList"><p class="muted sm">carregando…</p></div>
  <div class="addrow mt-4">
    <button type="button" class="btn" id="eiUp">Enviar imagem nova</button>
    <button type="button" class="btn sec" id="eiClr">Deixar sem imagem</button>
  </div>
</template>

<template id="t-imagens-lista">
  <p v-if="!figuras.length" class="empty">Nenhuma imagem nesta {{ campanha }} ainda.</p>
  <div v-else class="eigrid">
    <button v-for="x in figuras" type="button" :data-pick="x.rel" :class="x.rel === atual ? 'on' : null">
      <img :src="x.mini" alt="" loading="lazy"><span class="cap">{{ x.nome }}</span>
    </button>
  </div>
</template>

<template id="t-conta">
  <section class="fld" aria-labelledby="cnLoginT"><h3 class="flb" id="cnLoginT">Login</h3>
    <p class="lead m0"><b class="dourado">{{ login }}</b></p>
    <p class="sm muted">O login não muda: é a chave dos convites e de tudo que você já criou.</p></section>
  <section class="fld form" aria-labelledby="cnNomeT"><h3 class="flb" id="cnNomeT">Nome na mesa</h3>
    <div class="fgrid"><label class="fc fc-m">Como a mesa te vê<input class="inp" id="cnNome" v-attr:value="nome" autocomplete="name"></label></div>
    <div class="linha"><button type="button" class="btn sec m" id="cnNomeOk">Salvar o nome</button></div></section>
  <section class="fld form" aria-labelledby="cnEmailT"><h3 class="flb" id="cnEmailT">E-mail de recuperação</h3>
    <div class="fgrid"><label class="fc fc-m">E-mail<input class="inp" id="cnEmail" type="email" autocomplete="email" v-attr:value="email" aria-describedby="cnEmailD"></label></div>
    <p class="dica m0" id="cnEmailD">Opcional. Só serve para receber o link de redefinir a senha se você esquecer. Ninguém da mesa vê. Deixe vazio para tirar.</p>
    <div class="linha"><button type="button" class="btn sec m" id="cnEmailOk">Salvar o e-mail</button></div></section>
  <section class="fld form" aria-labelledby="cnSenhaT"><h3 class="flb" id="cnSenhaT">Trocar a senha</h3>
    <div class="fgrid"><label class="fc fc-p">Senha atual<input class="inp" id="cnAtual" type="password" autocomplete="current-password"></label>
      <label class="fc fc-p">Senha nova<input class="inp" id="cnNova" type="password" autocomplete="new-password" aria-describedby="cnSenhaD"></label>
      <label class="fc fc-p">Repita a nova<input class="inp" id="cnNova2" type="password" autocomplete="new-password"></label></div>
    <p class="dica m0" id="cnSenhaD">6 caracteres ou mais, com letra, número e caractere especial. Pedimos a atual de propósito: sessão esquecida aberta em navegador alheio não deve virar conta perdida.</p>
    <div class="linha"><button type="button" class="btn sec m" id="cnSenhaOk">Trocar a senha</button></div></section>
</template>
