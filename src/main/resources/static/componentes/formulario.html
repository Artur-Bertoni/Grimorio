<!-- Formulario generico (js/formulario.js) -->

<!-- campos: o HTML dos campos, ja preenchido; faixas: nomes para a lista de sugestao das faixas -->
<template id="t-formulario">
  <div id="fmBody" v-html="corpo"></div>
</template>

<template id="t-formulario-corpo">
  <div class="form"><div v-if="intro" class="aviso" v-html="intro"></div><p v-if="temObrig" class="sm muted legobrig"><span class="obrig" aria-hidden="true">*</span> campo obrigatório</p><span data-solta v-html="campos"></span>
    <div class="formft"><button type="button" class="btn" data-ok>{{ rotSalvar }}</button><button type="button" class="btn sec" data-no>Cancelar</button><span class="esp"></span><button v-if="rotRemover" type="button" class="btn dang" data-del>{{ rotRemover }}</button></div></div>
  <datalist id="dlFaixas"><option v-for="f in faixas" v-attr:value="f"></option></datalist>
</template>

<!-- c: a definicao do campo; p: o caminho dele na copia; v: o valor atual; fid: o prefixo de id deste formulario.
     No grupo, linhas traz o HTML dos campos de cada linha, montado pelo JS (o grupo se repete por dentro).
     Cada campo que pode dar erro tem o seu espaco (data-erro), preenchido ao salvar e ligado por aria-describedby. -->
<template id="t-campo">
  <label v-if="c.tipo === 'area'"><span class="frotx">{{ c.rot }}<span v-if="c.obrig" class="obrig" aria-hidden="true">*</span></span><textarea :data-f="p" :rows="c.linhas || 5" v-attr:placeholder="c.ph || null" v-attr:aria-required="c.obrig ? 'true' : null" :aria-describedby="fid + p + '-d ' + fid + p + '-e'">{{ v || '' }}</textarea><span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span><span class="dica erro" :id="fid + p + '-e'" data-erro hidden></span></label>

  <label v-else-if="c.tipo === 'linhas'"><span class="frotx">{{ c.rot }}<span v-if="c.obrig" class="obrig" aria-hidden="true">*</span></span><textarea :data-f="p" data-t="linhas" :rows="c.linhas || 5" v-attr:placeholder="c.ph || null" v-attr:aria-required="c.obrig ? 'true' : null" :aria-describedby="fid + p + '-d ' + fid + p + '-e'">{{ (Array.isArray(v) ? v : []).join('\n') }}</textarea><span class="dica" :id="fid + p + '-d'">{{ c.dica || 'Um item por linha.' }}</span><span class="dica erro" :id="fid + p + '-e'" data-erro hidden></span></label>

  <label v-else-if="c.tipo === 'num'"><span class="frotx">{{ c.rot }}<span v-if="c.obrig" class="obrig" aria-hidden="true">*</span></span><input :data-f="p" data-t="num" type="number" step="1" inputmode="numeric" v-attr:value="v == null ? '' : String(v)" v-attr:aria-required="c.obrig ? 'true' : null" :aria-describedby="fid + p + '-d ' + fid + p + '-e'"><span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span><span class="dica erro" :id="fid + p + '-e'" data-erro hidden></span></label>

  <label v-else-if="c.tipo === 'sel'">{{ c.rot }}<select :data-f="p" :aria-describedby="fid + p + '-d'"><option v-for="op in c.ops" v-attr:value="String(op[0])" v-attr:selected="String(op[0]) === String(v == null ? '' : v)">{{ op[1] }}</option></select><span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span></label>

  <label v-else-if="c.tipo === 'check'" class="ck"><input type="checkbox" :data-f="p" data-t="check" v-attr:checked="!!v" v-attr:aria-describedby="c.dica ? fid + p + '-d' : null">{{ c.rot }}<span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span></label>

  <label v-else-if="c.tipo === 'faixa'">{{ c.rot }}<input :data-f="p" list="dlFaixas" v-attr:value="v || ''" v-attr:placeholder="c.ph || null" :aria-describedby="fid + p + '-d'"><span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span></label>

  <label v-else-if="c.tipo === 'senha'"><span class="frotx">{{ c.rot }}<span v-if="c.obrig" class="obrig" aria-hidden="true">*</span></span><input :data-f="p" type="password" autocomplete="new-password" v-attr:aria-required="c.obrig ? 'true' : null" :aria-describedby="fid + p + '-d ' + fid + p + '-e'"><span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span><span class="dica erro" :id="fid + p + '-e'" data-erro hidden></span></label>

  <fieldset v-else-if="c.tipo === 'img'" class="fgrp"><legend>{{ c.rot }}</legend>
    <div class="pick"><img v-if="v" :src="IMG(v)" :alt="'Atual: ' + c.rot"><span v-else class="semimg">sem imagem</span><button type="button" class="btn sec m" :data-pk="p">{{ v ? 'Trocar' : 'Escolher imagem' }}</button><button v-if="v" type="button" class="tbtn d" :data-pkx="p">Tirar</button></div>
    <span v-if="c.dica" class="dica">{{ c.dica }}</span></fieldset>

  <fieldset v-else-if="c.tipo === 'imgs'" class="fgrp"><legend>{{ c.rot }}</legend>
    <div class="pick" data-ordena="form" data-eixo="x" :data-p="p"><span v-for="(x, i) in (Array.isArray(v) ? v : [])" class="pkit" :data-item="i" data-alca><img :src="IMG(x)" :alt="c.rot + ' ' + (i + 1)" draggable="false"><span class="addrow pkacoes"><button type="button" class="alca" title="Arraste para mudar a ordem" aria-label="Mover a imagem (arraste, use as setas ou clique para escolher a posição)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></button><button type="button" class="tbtn d ico" :data-rmr="p + ':' + i" :title="'Tirar a imagem ' + (i + 1)" :aria-label="'Tirar a imagem ' + (i + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></span><button type="button" class="btn sec m" :data-pka="p">+ imagem</button></div>
    <span v-if="c.dica" class="dica">{{ c.dica }}</span></fieldset>

  <fieldset v-else-if="c.tipo === 'grupo'" class="fgrp" data-ordena="form" :data-p="p"><legend>{{ c.rot }}</legend><span v-if="c.dica" class="dica">{{ c.dica }}</span>
    <div v-for="(l, i) in linhas" class="rowed" :data-item="i"><div class="rowhd" data-alca><button type="button" class="alca" title="Arraste para mudar a ordem" :aria-label="'Mover ' + (c.um || 'item') + ' ' + (i + 1) + ' (arraste, use as setas ou clique para escolher a posição)'"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></button><span>{{ c.um || 'item' }} {{ i + 1 }}</span><button type="button" class="tbtn d" :data-rmr="p + ':' + i">Remover</button></div><span data-solta v-html="l"></span></div>
    <div v-if="!c.fixo" class="addrow"><button type="button" class="addbtn" :data-addr="p">+ {{ c.um || 'item' }}</button></div></fieldset>

  <label v-else><span class="frotx">{{ c.rot }}<span v-if="c.obrig" class="obrig" aria-hidden="true">*</span></span><input :data-f="p" v-attr:value="v == null ? '' : String(v)" v-attr:placeholder="c.ph || null" v-attr:readonly="!!c.ro" v-attr:tabindex="c.ro ? '-1' : null" v-attr:aria-required="c.obrig ? 'true' : null" v-attr:autocomplete="c.auto || null" :aria-describedby="fid + p + '-d ' + fid + p + '-e'"><span v-if="c.dica" class="dica" :id="fid + p + '-d'">{{ c.dica }}</span><span class="dica erro" :id="fid + p + '-e'" data-erro hidden></span></label>
</template>
