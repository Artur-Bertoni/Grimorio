<!-- Tour guiado (js/tour.js) -->

<template id="t-tour">
  <div class="tourfoco"></div>
  <div class="tourcard">
    <div class="tourlogo" v-html="logo"></div>
    <div class="tourtop"><span class="tourn" aria-live="polite"></span><button type="button" class="tbtn" data-t="pula">Pular o tour</button></div>
    <h2 class="tourtit" id="tourTit">Tour guiado</h2><p id="tourTx"></p><div class="tourdots" aria-hidden="true"></div>
    <div class="tourft"><button type="button" class="btn sec m" data-t="volta">‹ Voltar</button><button type="button" class="btn fant m" data-t="tudo" hidden>Ver o tour completo</button><button type="button" class="btn m" data-t="vai">Próximo ›</button></div>
  </div>
</template>

<template id="t-tour-pontos">
  <i v-for="k in total" :class="k - 1 === atual ? 'on' : (k - 1 < atual ? 'ja' : null)"></i>
</template>
