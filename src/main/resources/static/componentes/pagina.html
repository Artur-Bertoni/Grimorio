<!-- Pedacos comuns das paginas: cabecalho e sub-abas -->

<!-- botao: {id, texto, sec} opcional, a acao principal da pagina; sec deixa o botao secundario -->
<template id="t-cabeca">
  <div class="pagehd"><div><p class="eyebrow">{{ eyebrow }}</p><div class="titlinha"><h1 class="page">{{ titulo }}</h1><span data-solta v-html="guia"></span></div></div>
    <button v-if="botao" :class="'btn' + (botao.sec ? ' sec' : '')" :id="botao.id">{{ botao.texto }}</button></div>
</template>

<!-- itens: [{attrs:{"data-x":valor}, texto, on}] -->
<template id="t-subnav">
  <nav class="mesanav" :aria-label="rotulo || 'Seções desta página'"><button v-for="x in itens" type="button" v-bind="x.attrs" :aria-pressed="String(x.on)" v-attr:aria-current="x.on ? 'true' : null">{{ x.texto }}</button></nav>
</template>
