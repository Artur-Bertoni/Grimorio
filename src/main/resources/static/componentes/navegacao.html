<!-- Abas da campanha (topo na tela larga, barra de baixo no celular) e o menu "Mais" do topo (js/render.js, js/camadas.js) -->

<!-- id: a tela; ico: chave do desenho; rot: o nome; atual: se e a tela aberta; msec: subaba da Mesa, quando for -->
<template id="t-aba">
  <button type="button" class="tab" :data-aba="id" v-attr:data-msec="msec || null" v-attr:aria-current="atual ? 'page' : null"><span class="tabico" aria-hidden="true"><svg v-if="ico === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V8.8a1 1 0 0 1 .5-.9l7-4a1 1 0 0 1 1 0l7 4a1 1 0 0 1 .5.9v10.7a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg><svg v-else-if="ico === 'sessoes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9h17M8 3v3M16 3v3M7.5 13h3M7.5 16h6"/></svg><svg v-else-if="ico === 'elenco'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.6c2.4-.3 4.3 1.2 4.7 4.4"/></svg><svg v-else-if="ico === 'biblioteca'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h4v15h-4zM10.5 4.5h4v15h-4z"/><path d="m16.2 5.4 3.6-1 3 14.3-3.6 1z" transform="translate(-1.8 .4)"/></svg><svg v-else-if="ico === 'mesa'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="10" rx="8.5" ry="4"/><path d="M3.5 10v2.5c0 2.2 3.8 4 8.5 4s8.5-1.8 8.5-4V10M7 16v4M17 16v4"/></svg><svg v-else-if="ico === 'resumos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4M9 11h6M9 14h6M9 17h4"/></svg><svg v-else-if="ico === 'ev'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m14.6 14.6 5.4 5.4"/></svg><svg v-else-if="ico === 'quem'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.7-3.8 3.6-6 7-6s6.3 2.2 7 6"/></svg><svg v-else-if="ico === 'regras'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.8-1.3 5.5-1.3 8 .5 2.5-1.8 5.2-1.8 8-.5v13c-2.8-1.3-5.5-1.3-8 .5-2.5-1.8-5.2-1.8-8-.5z"/><path d="M12 6v13"/></svg><svg v-else-if="ico === 'fichas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="17" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><svg v-else-if="ico === 'notas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z"/><path d="m12.5 6.5 5 5"/></svg><svg v-else-if="ico === 'mais'" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5h15v10h-9l-4.5 4v-4h-1.5z"/></svg></span><span class="tabrot">{{ rot }}</span></button>
</template>

<!-- itens: [{id, rot, ico}] com o mesmo id do botao do topo que eles acionam -->
<template id="t-menu-mais">
  <div class="menu menumais" role="menu" aria-label="Mais ações"><button v-for="x in itens" type="button" class="mi" role="menuitem" :data-mais="x.id"><span class="miico" aria-hidden="true" v-html="x.ico"></span><span class="mt">{{ x.rot }}</span><span v-if="x.estado" class="ms">{{ x.estado }}</span></button></div>
</template>

<!-- menu solto generico: itens [{v, rot, dica, perigo, desligado}] -->
<template id="t-menu">
  <div class="menu" role="menu" :aria-label="titulo"><button v-for="x in itens" type="button" :class="'mi' + (x.perigo ? ' dang' : '')" role="menuitem" :data-v="x.v" v-attr:disabled="x.desligado || null"><span class="mt">{{ x.rot }}</span><span v-if="x.dica" class="ms">{{ x.dica }}</span></button></div>
</template>
