<!-- Sessao aberta: quadro, roteiro, painel, cenas e blocos (js/cena.js) -->

<!-- ---------- blocos de cena ---------- -->

<!-- b: o bloco; itens: os itens (nos testes, ja com as faixas de resultado separadas em {num, txt}).
     ed: o bloco esta aberto (js/nolugar.js): os mesmos elementos, com campos no lugar do texto; k: a chave dele;
     lapis e fim: o lapis e o rodape, ja preenchidos; faixas: nomes para a sugestao da trilha -->
<template id="t-bloco">
  <div :class="'blk' + (ed ? ' nled' : '')" :data-item="bi" v-attr:data-nlb="ed ? k : null"><div class="blkhd" data-alca><button type="button" class="alca" title="Arraste para mudar a ordem" aria-label="Arrastar para mudar a ordem (setas do teclado também movem)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></button><span v-if="ed" class="flb"><input class="nl" data-nl="rotulo" v-attr:value="b.rotulo || ''" v-attr:placeholder="nomeTipo(b.tipo)" aria-label="Título do bloco" autocomplete="off"></span><span v-else class="flb">{{ rotulo }}</span><span class="blktools" v-html="lapis"></span></div>
    <div v-if="ed && b.tipo === 'leitura'" class="leitura"><input class="nl hint" data-nl="nota" v-attr:value="b.nota || ''" placeholder="Instrução para você (opcional)" aria-label="Instrução para você (opcional)" autocomplete="off"><textarea class="nl" data-nl="texto" data-nl-foco rows="2" placeholder="O texto para ler em voz alta" aria-label="O texto para ler em voz alta">{{ b.texto || '' }}</textarea></div>
    <div v-else-if="ed && b.tipo === 'nota'" class="segredo"><span class="lb">Não revele · só você vê</span><textarea class="nl sectxt" data-nl="texto" data-nl-foco rows="2" placeholder="O segredo" aria-label="O segredo">{{ b.texto || '' }}</textarea></div>
    <ul v-else-if="ed && b.tipo === 'lista'" class="fl"><li v-for="(x, j) in b.itens"><span class="nlrow"><textarea class="nl" :data-nl="'itens.' + j" data-nl-li rows="1" :aria-label="'Item ' + (j + 1)">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'itens.' + j" :aria-label="'Tirar o item ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul>
    <ul v-else-if="ed && b.tipo === 'quem'" class="fl"><li v-for="(q, j) in b.itens" class="q"><div class="quem nlit"><button type="button" class="nlimg nlava" :data-nl-img="'itens.' + j + '.img'" :aria-label="q.img ? 'Trocar a imagem' : 'Pôr uma imagem'"><img v-if="q.img" :src="IMG(q.img, 'mini')" alt=""><span v-else aria-hidden="true">+</span></button><div class="itbody"><textarea class="nl" :data-nl="'itens.' + j + '.t'" rows="1" placeholder="Nome: descrição curta" aria-label="Nome: descrição curta (quem é e o que faz ali)">{{ q.t }}</textarea><span class="motiva"><b>Quer:</b> <input class="nl curto" :data-nl="'itens.' + j + '.motiva'" v-attr:value="q.motiva || ''" placeholder="o que quer (opcional)" aria-label="O que quer (opcional)" autocomplete="off"></span></div><button type="button" class="nlx" :data-nl-del="'itens.' + j" data-nl-desfaz aria-label="Tirar esta pessoa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></li></ul>
    <ul v-else-if="ed && b.tipo === 'avancar'" class="fl"><li v-for="(a, j) in b.itens"><span class="nlrow"><select :class="'nl tag ' + a.tipo" :data-nl="'itens.' + j + '.tipo'" data-nl-re aria-label="Marca"><option v-for="m in MARCAS" v-attr:value="m[0]" v-attr:selected="a.tipo === m[0] ? true : null">{{ m[1] }}</option></select><textarea class="nl" :data-nl="'itens.' + j + '.t'" rows="1" placeholder="O que acontece" aria-label="O que acontece">{{ a.t }}</textarea><button type="button" class="nlx" :data-nl-del="'itens.' + j" data-nl-desfaz aria-label="Tirar o item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
        <ul><li v-for="(x, m) in a.sub"><span class="nlrow"><textarea class="nl" :data-nl="'itens.' + j + '.sub.' + m" data-nl-li rows="1" aria-label="Detalhe">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'itens.' + j + '.sub.' + m" aria-label="Tirar o detalhe"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul>
        <button type="button" class="nladd" :data-nl-add="'itens.' + j + '.sub'">+ detalhe</button></li></ul>
    <span v-else-if="ed && b.tipo === 'dialogo'" data-solta><div v-for="(d, j) in b.itens" class="dlg nlit"><b><input class="nl" :data-nl="'itens.' + j + '.quem'" v-attr:value="d.quem || ''" placeholder="Quem fala" aria-label="Quem fala" autocomplete="off"></b><textarea class="nl nlfala" :data-nl="'itens.' + j + '.fala'" rows="1" placeholder="A fala" aria-label="A fala">{{ d.fala }}</textarea><button type="button" class="nlx" :data-nl-del="'itens.' + j" data-nl-desfaz aria-label="Tirar a fala"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></span>
    <div v-else-if="ed && b.tipo === 'testes'" class="testes"><div v-for="(t, j) in b.itens" class="teste nlit"><span class="per"><input class="nl" :data-nl="'itens.' + j + '.p'" v-attr:value="t.p || ''" placeholder="Perícia ou rolagem" aria-label="Perícia ou rolagem" autocomplete="off"></span><div class="itbody"><textarea class="nl" :data-nl="'itens.' + j + '.t'" rows="1" placeholder="O que o personagem tenta" aria-label="O que o personagem tenta">{{ t.t }}</textarea>
        <div><span v-for="(f, m) in t.f" class="faixa nlrow"><textarea class="nl" :data-nl="'itens.' + j + '.f.' + m" data-nl-li rows="1" placeholder="15 · o que acontece" aria-label="15 · o que acontece (resultado; comece com o número para destacar)">{{ f }}</textarea><button type="button" class="nlx" :data-nl-del="'itens.' + j + '.f.' + m" aria-label="Tirar o resultado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <button type="button" class="nladd" :data-nl-add="'itens.' + j + '.f'">+ resultado</button></div></div><button type="button" class="nlx" :data-nl-del="'itens.' + j" data-nl-desfaz aria-label="Tirar o teste"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></div>
    <div v-else-if="ed && b.tipo === 'trilha'" class="trilharow"><span v-for="(tr, j) in b.itens" class="tplay nlit"><span class="dot" :style="'background:' + catColor(tr.cat)"></span><input class="nl curto sit" :data-nl="'itens.' + j + '.sit'" v-attr:value="tr.sit || ''" placeholder="Quando tocar" aria-label="Quando tocar" autocomplete="off"><input class="nl curto" :data-nl="'itens.' + j + '.faixa'" list="dlNlFaixas" v-attr:value="tr.faixa || ''" placeholder="Faixa da Biblioteca" aria-label="Faixa da Biblioteca" autocomplete="off"><button type="button" class="nlx" :data-nl-del="'itens.' + j" aria-label="Tirar a faixa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span><datalist id="dlNlFaixas"><option v-for="f in faixas" v-attr:value="f"></option></datalist></div>
    <div v-else-if="ed && b.tipo === 'imagens'" class="imgrow"><span v-for="(src, j) in b.itens" class="nlit nlthumb"><img :src="IMG(src, 'mini')" alt=""><button type="button" class="nlx" :data-nl-del="'itens.' + j" :aria-label="'Tirar a imagem ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span><button type="button" class="nlimg nlthumb" data-nl-addimg="itens" aria-label="Pôr uma imagem">+</button></div>
    <div v-else-if="b.tipo === 'leitura' && b.texto" class="leitura"><span v-if="b.nota" class="hint">{{ b.nota }}</span>{{ b.texto }}</div>
    <div v-else-if="b.tipo === 'nota' && b.texto" class="segredo"><span class="lb">Não revele · clique para ler</span><div class="blur sectxt" data-blur="1">{{ b.texto }}</div></div>
    <p v-else-if="b.tipo === 'leitura' || b.tipo === 'nota' || !itens.length" class="muted sm m0">Vazio. Use o lápis para preencher.</p>
    <ul v-else-if="b.tipo === 'lista'" class="fl"><li v-for="x in itens">{{ x }}</li></ul>
    <ul v-else-if="b.tipo === 'quem'" class="fl"><li v-for="q in itens" class="q"><div class="quem"><img v-if="q.img" :src="IMG(q.img, 'mini')" alt="" :data-lb="q.img" loading="lazy" tabindex="0" role="button" :aria-label="'Ver a imagem em tela cheia: ' + (q.t || 'pessoa')"><div class="itbody">{{ q.t }}<span v-if="q.motiva" class="motiva"><b>Quer:</b> {{ q.motiva }}</span></div></div></li></ul>
    <ul v-else-if="b.tipo === 'avancar'" class="fl"><li v-for="a in itens"><span v-if="a.tipo && a.tipo !== 'nota'" :class="'tag ' + a.tipo">{{ a.tipo === 'forcado' ? 'obrigatório' : a.tipo }}</span>{{ a.t }}<ul v-if="a.sub && a.sub.length"><li v-for="x in a.sub">{{ x }}</li></ul></li></ul>
    <span v-else-if="b.tipo === 'dialogo'" data-solta><div v-for="d in itens" class="dlg"><b>{{ d.quem }}</b><q>{{ d.fala }}</q></div></span>
    <div v-else-if="b.tipo === 'testes'" class="testes"><div v-for="t in itens" class="teste"><span v-if="t.p" class="per">{{ t.p }}</span><div class="itbody">{{ t.t }}<div v-if="t.f.length"><span v-for="f in t.f" class="faixa"><b v-if="f.num">{{ f.num }}</b>{{ f.txt }}</span></div></div><button v-if="mestre" class="tbtn" :data-pedir="t.p || t.t || ''" :title="'Pedir esta rolagem aos ' + vmin('jogadores')">Pedir</button></div></div>
    <div v-else-if="b.tipo === 'trilha'" class="trilharow"><button v-for="tr in itens" class="tplay" :data-faixa="tr.faixa"><span class="dot" :style="'background:' + catColor(tr.cat)"></span><span v-if="tr.sit" class="sit">{{ tr.sit }}</span><b>{{ tr.faixa }}</b></button></div>
    <div v-else-if="b.tipo === 'imagens'" class="imgrow"><img v-for="(src, k) in itens" :src="IMG(src, 'mini')" alt="" :data-lb="src" loading="lazy" tabindex="0" role="button" :aria-label="'Ver a imagem ' + (k + 1) + ' em tela cheia'"></div>
    <span v-if="ed" data-solta v-html="fim"></span>
  </div>
</template>

<!-- ---------- cena ---------- -->

<template id="t-ck">
  <button class="ckbox" data-act="ck" :data-c="cid" :aria-pressed="String(feito)" :aria-label="rotulo"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2 6.3 4.6 9 10 3.2"/></svg></button>
</template>

<!-- lapis: o t-nl-lapis do cabecalho da cena, ja preenchido -->
<template id="t-ferr-cena">
  <span class="blktools"><button class="edb ico" data-act="scn-mapa" :data-c="cid" v-attr:title="'Abrir o ' + vmin('mapa') + ' desta ' + vmin('cena')" v-attr:aria-label="'Abrir o ' + vmin('mapa') + ' desta ' + vmin('cena')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 3.5 5.5 2l5 1.5 4-1.5v10.5L10.5 14l-5-1.5-4 1.5z"/><path d="M5.5 2v10.5M10.5 3.5V14"/></svg></button><span data-solta v-html="lapis"></span></span>
</template>

<!-- o cabecalho da cena aberto (cab: {k, ed, fim, territorios:[{id, nome, on}]}): rotulo, titulo, territorio e
     "obrigatoria" no lugar do texto; serve ao roteiro (dentro do summary) e a cena no quadro -->
<template id="t-cena-campos">
  <span class="sn"><input class="nl curto" data-nl="n" v-attr:value="c.n || ''" placeholder="Rótulo" aria-label="Rótulo curto (aparece no cartão do quadro)" autocomplete="off"></span><span class="st"><input class="nl" data-nl="titulo" data-nl-foco v-attr:value="c.titulo || ''" placeholder="O que acontece nela" aria-label="Título: o que acontece nela" autocomplete="off"></span><select class="nl mini" data-nl="territorio" data-nl-re :style="'border-color:' + terr.cor + ';--cor:' + terr.cor" :aria-label="Vm('territorio')"><option v-for="t in cab.territorios" v-attr:value="t.id" v-attr:selected="t.on ? true : null">{{ t.nome }}</option></select><button type="button" :class="'mini nlalt' + (c.forcado ? ' f' : '')" data-nl-alt="forcado" :aria-pressed="String(!!c.forcado)" title="Acontece de qualquer jeito, seja qual for o caminho da mesa">obrigatória</button>
</template>

<!-- blocos: o HTML de cada bloco -->
<template id="t-cena-corpo">
  <span data-solta v-html="blocos"></span>
  <p v-if="!blocos" class="muted sm m0">Esta {{ vmin('cena') }} ainda não tem conteúdo. Escolha um tipo de bloco e adicione.</p>
  <div class="addrow centro-v"><select class="selmini" aria-label="Tipo de bloco"><option v-for="t in TIPOS" v-attr:value="t[0]">{{ t[1] }}</option></select><button class="addbtn" data-act="blk-add" :data-c="cid">+ bloco</button></div>
</template>

<!-- a cena no roteiro; ck, ferramentas e corpo ja preenchidos -->
<!-- cab: o cabecalho da cena ({k, ed, fim, campos}); aberto, os campos entram no lugar do texto e o details fica aberto -->
<template id="t-scn">
  <details :class="'scn' + (c.feito ? ' done' : '')" :id="'scn-' + c.id" v-attr:open="aberta || cab.ed" :data-item="k" v-attr:data-nlb="cab.ed ? cab.k : null"><summary data-alca><button type="button" class="alca" title="Arraste para mudar a ordem" aria-label="Arrastar para mudar a ordem (setas do teclado também movem)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></button><span data-solta v-html="ck"></span><span v-if="cab.ed" data-solta v-html="cab.campos"></span><span v-else data-solta><span class="sn">{{ c.n }}</span><span class="st">{{ c.titulo }}</span><span class="mini" :style="'border-color:' + terr.cor + ';--cor:' + terr.cor">{{ terr.nome }}</span><span v-if="c.forcado" class="mini f">obrigatória</span></span><span data-solta v-html="ferr"></span></summary>
    <div v-if="cab.ed" class="scnfim" v-html="cab.fim"></div>
    <div class="sbody" data-ordena="blocos" :data-c="c.id" v-html="corpo"></div></details>
</template>

<template id="t-cena-modal">
  <div class="cmhd" v-attr:data-nlb="cab.ed ? cab.k : null"><span data-solta v-html="ck"></span><span v-if="cab.ed" data-solta v-html="cab.campos"></span><span v-else data-solta><span class="sm muted">Marcar como feita</span><span class="mini" :style="'border-color:' + terr.cor + ';--cor:' + terr.cor">{{ terr.nome }}</span><span v-if="c.forcado" class="mini f">obrigatória</span><span class="cresce"></span></span><span data-solta v-html="ferr"></span><span v-if="cab.ed" data-solta v-html="cab.fim"></span></div>
  <div class="sbody" data-ordena="blocos" :data-c="c.id" v-html="corpo"></div>
</template>

<template id="t-cena-modal-cabeca">
  <button class="ibtn" id="cmPrev" title="Cena anterior" v-attr:disabled="k <= 0">&#8249;</button><span class="sm muted semquebra">{{ k + 1 }}/{{ total }}</span><button class="ibtn" id="cmNext" title="Próxima cena" v-attr:disabled="k >= total - 1">&#8250;</button>
</template>

<!-- o card da cena no quadro -->
<template id="t-card">
  <article :class="'card' + (c.feito ? ' done' : '')" :data-scn="c.id" tabindex="0" role="button" :aria-label="(c.feito ? 'Feita: ' : '') + vmin('cena') + ' ' + c.n + ', ' + c.titulo">
    <div class="chd"><span class="alca enfeite" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></span><span data-solta v-html="ck"></span><span class="cn">{{ c.n }}</span><span v-if="c.forcado" class="mini f">forçado</span></div>
    <div class="ct">{{ c.titulo }}</div>
    <div class="cfoot"><span v-if="faixa" class="mini" :style="'border-color:' + catColor(faixa.cat) + ';--cor:' + catColor(faixa.cat)">{{ faixa.faixa }}</span><span v-if="testes" class="mini">{{ testes }} {{ testes === 1 ? 'teste' : 'testes' }}</span></div>
    <div v-if="imagens.length" class="thumbs"><img v-for="i in imagens" :src="IMG(i, 'mini')" alt="" loading="lazy"></div>
  </article>
</template>

<!-- ---------- sessao aberta ---------- -->

<!-- o que o quadro e o roteiro dividem, cada pedaco no lugar que o modo pede -->
<template id="t-sessao-volta"><button class="backb" id="sesVolta">‹ {{ Vm('sessoes') }}</button></template>
<template id="t-sessao-prog"><div class="prog"><span>{{ feitas }}/{{ total }} cenas</span><span class="bar"><i :style="'width:' + pc + '%'"></i></span></div></template>
<template id="t-sessao-enc"><span v-if="encerrada" class="chip enc">encerrada</span></template>
<!-- uma acao primaria (liberar para a mesa, o que se faz durante o jogo); o resto e secundario
     e encerrar fica discreto, em cor de perigo, no fim -->
<template id="t-sessao-acoes"><button type="button" class="ibtn ico" id="sesEd" v-attr:title="'Editar ' + vmin('sessao')" v-attr:aria-label="'Editar ' + vmin('sessao')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button><button type="button" :class="'ibtn' + (ini ? ' on' : '')" id="iniBtn" :aria-pressed="String(!!ini)">Iniciativa</button><button type="button" class="btn m" id="libBtn">Liberar para a {{ vmin('mesa') }}</button><button type="button" class="tbtn d encerra" id="encBtn">Encerrar {{ vmin('sessao') }}</button></template>
<template id="t-sessao-modos"><div class="vmodes" role="group" aria-label="Modo de ver a sessão"><button type="button" data-vm="canvas" :aria-pressed="String(modo === 'canvas')">{{ Vm('quadro') }}</button><button type="button" data-vm="roteiro" :aria-pressed="String(modo === 'roteiro')">{{ Vm('roteiro') }}</button></div></template>

<!-- p: as pecas acima, cada uma ja preenchida (volta, prog, enc, acoes, modos) -->
<!-- Quadro e Roteiro dividem o mesmo cabecalho compacto: trocar de modo e trocar de visualizacao,
     e os controles ficam no mesmo lugar. O progresso fica junto do titulo que ele descreve. -->
<template id="t-sessao-quadro">
  <div class="boardbar"><span data-solta v-html="p.volta"></span><h1>{{ s.titulo }}</h1><span data-solta v-html="guia"></span><span class="chip">{{ Vm('sessao') }} {{ s.numero }}</span><span data-solta v-html="p.prog + p.enc"></span><span class="esp"></span><div class="bbacoes"><button type="button" :class="'ibtn' + (painel ? ' on' : '')" id="railBtn" :aria-pressed="String(!!painel)">Painel</button><span class="bbsep" aria-hidden="true"></span><span data-solta v-html="p.modos"></span><span class="bbsep" aria-hidden="true"></span><span data-solta v-html="p.acoes"></span></div></div>
  <span data-solta v-html="ini"></span>
  <span data-solta v-html="quadro"></span>
</template>

<template id="t-sessao-roteiro">
  <div class="boardbar sesshead"><span data-solta v-html="p.volta"></span><h1>{{ s.titulo }}</h1><span data-solta v-html="guia"></span><span class="chip">{{ Vm('sessao') }} {{ s.numero }}</span><span data-solta v-html="p.prog + p.enc"></span><span class="esp"></span><div class="bbacoes"><span data-solta v-html="p.modos"></span><span class="bbsep" aria-hidden="true"></span><span data-solta v-html="p.acoes"></span></div></div>
  <span data-solta v-html="ini"></span>
  <!-- celular: as acoes do jogo numa barra fixa acima das abas, e o painel como gaveta -->
  <div class="sessbarra" role="toolbar" aria-label="Ações da sessão"><button type="button" class="sbb" data-sb="painel" aria-expanded="false" aria-controls="railSessao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Painel</span></button><button type="button" class="sbb" data-sb="ini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 5h10M5 12h14M5 19h7"/><circle cx="19" cy="5" r="1.6"/></svg><span>Iniciativa</span></button><button type="button" class="btn m sbprim" data-sb="lib">Liberar</button><button type="button" class="sbb" data-sb="mais" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span>Mais</span></button></div>
  <div class="sess"><aside class="rail" id="railSessao" v-html="painel" aria-label="Painel da sessão"></aside>
    <section class="minw0"><p v-if="s.resumo" class="lead sm sectxt sessresumo">{{ s.resumo }}</p>
      <div class="roteiro" data-ordena="cenas"><span data-solta v-html="cenas"></span>
        <div v-if="!cenas" class="empty sessvazia"><p class="m0">Nenhuma {{ vmin('cena') }} ainda. Uma {{ vmin('cena') }} junta o que ler em voz alta, quem aparece, os testes e a trilha.</p><button type="button" class="btn" data-act="scn-add">Criar a primeira {{ vmin('cena') }}</button></div>
        <button v-else type="button" class="btn sec m addcena" data-act="scn-add">+ {{ Vm('cena') }}</button></div></section></div>
</template>

<!-- territorios: [{id, nome, cor, x, y, cards (HTML)}]; painel: HTML do painel -->
<template id="t-quadro">
  <div class="cvwrap" id="cvwrap"><svg class="cvsvg" id="cvsvg"></svg>
    <div class="cv" id="cv"><div v-for="t in territorios" class="terr" :data-terr="t.id" :style="'left:' + t.x + 'px;top:' + t.y + 'px;width:244px;border-color:' + t.cor"><span class="tl" :style="'--cor:' + t.cor + ';border-color:' + t.cor"><span class="alca enfeite" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></span>{{ t.nome }}</span><span data-solta v-html="t.cards"></span><span class="addrow" style="margin-top:6px"><button class="addbtn" data-act="scn-add" :data-t="t.id">+ {{ vmin('cena') }}</button><button class="tbtn ico" data-act="terr-ed" :data-t="t.id" v-attr:title="'Editar ' + vmin('territorio')" v-attr:aria-label="'Editar ' + vmin('territorio')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button></span></div></div>
    <aside class="railfloat" id="railFloat" aria-label="Painel da sessão" v-attr:hidden="!aberto"><div class="rfhd" id="rfHd" title="Arraste para mover · clique duplo volta ao lugar"><span class="alca enfeite" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></span><span class="cresce">Painel</span><button type="button" class="tbtn ico" id="rfPos" aria-haspopup="menu" aria-expanded="false" title="Posição e tamanho" aria-label="Posição e tamanho do painel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13M8 1.5 6 3.5M8 1.5l2 2M8 14.5l-2-2M8 14.5l2-2M1.5 8l2-2M1.5 8l2 2M14.5 8l-2-2M14.5 8l-2 2"/></svg></button></div><div class="rfbody" v-html="painel"></div><span class="rfgrip" id="rfGrip" title="Arraste para redimensionar"></span></aside>
    <div class="cvtools" role="group" aria-label="Zoom do quadro"><button type="button" data-z="+" title="Aproximar" aria-label="Aproximar">+</button><button type="button" data-z="-" title="Afastar" aria-label="Afastar">−</button><button type="button" data-z="0" title="Enquadrar tudo" aria-label="Enquadrar tudo">⤢</button><button type="button" data-act="terr-add" :title="'Novo ' + vmin('territorio')" :aria-label="'Novo ' + vmin('territorio')">⬡</button></div>
    <div class="cvhint"><span class="so-mouse">Clique num card para abrir · Arraste o card para trocar de {{ vmin('territorio') }} · Arraste o fundo para mover · Roda do mouse para zoom</span><span class="so-toque">Toque num card para abrir · Arraste pela alça para trocar de {{ vmin('territorio') }} · Um dedo move · Dois dedos dão zoom</span></div></div>
</template>

<!-- o painel da sessao. aberta: a caixa aberta; obrig: [{cid, n, texto}]; elenco: [{tp, titulo, itens:[{id, nome, img, texto, lib}]}],
     lib e null para quem joga, ou {on} -->
<template id="t-painel-sessao">
  <details class="rbox" data-rb="obrig" v-attr:open="aberta === 'obrig'"><summary>Não pode faltar</summary><div class="rbody">
    <ul v-if="obrig.length"><li v-for="o in obrig"><button class="chip b btn" data-act="go" :data-c="o.cid">{{ o.n }}</button> {{ o.texto }}</li></ul>
    <p v-else class="muted sm m0">Nada marcado como obrigatório. Marque uma {{ vmin('cena') }} ou um item de “Para avançar”.</p></div></details>
  <details class="rbox" data-rb="fixos" v-attr:open="aberta === 'fixos' || fixos.ed"><summary>Eventos fixos</summary><div class="rbody" v-attr:data-nlb="fixos.ed ? fixos.k : null">
    <span v-if="fixos.ed" data-solta><p class="muted sm m0"><textarea class="nl" data-nl="eventosFixos.intro" rows="1" placeholder="Explicação (opcional)" aria-label="Explicação (opcional)">{{ s.eventosFixos.intro }}</textarea></p>
      <ul><li v-for="(x, j) in s.eventosFixos.lista"><span class="nlrow"><textarea class="nl" :data-nl="'eventosFixos.lista.' + j" data-nl-li rows="1" :aria-label="'Evento ' + (j + 1)">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'eventosFixos.lista.' + j" :aria-label="'Tirar o item ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul><button type="button" class="nladd" data-nl-add="eventosFixos.lista">+ item</button></span>
    <span v-else data-solta><p v-if="s.eventosFixos.intro" class="muted sm m0">{{ s.eventosFixos.intro }}</p>
      <ul v-if="s.eventosFixos.lista.length"><li v-for="x in s.eventosFixos.lista">{{ x }}</li></ul><p v-else class="muted sm m0">Nada ainda.</p></span>
    <div v-if="fixos.ed" v-html="fixos.fim"></div><div v-else class="addrow" v-html="fixos.lapis"></div></div></details>
  <details class="rbox" data-rb="prep" v-attr:open="aberta === 'prep' || prep.ed"><summary>Preparação</summary><div class="rbody" v-attr:data-nlb="prep.ed ? prep.k : null">
    <b class="subtit">O que ter pronto</b>
    <span v-if="prep.ed" data-solta><ul><li v-for="(x, j) in s.prep.terPronto"><span class="nlrow"><textarea class="nl" :data-nl="'prep.terPronto.' + j" data-nl-li rows="1" :aria-label="'O que ter pronto ' + (j + 1)">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'prep.terPronto.' + j" :aria-label="'Tirar o item ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul><button type="button" class="nladd" data-nl-add="prep.terPronto">+ item</button></span>
    <span v-else data-solta><ul v-if="s.prep.terPronto.length"><li v-for="x in s.prep.terPronto">{{ x }}</li></ul><p v-else class="muted sm m0">Nada ainda.</p></span>
    <b class="subtit">Regras que vão aparecer</b>
    <span v-if="prep.ed" data-solta><ul><li v-for="(x, j) in s.prep.mecanicas"><span class="nlrow"><textarea class="nl" :data-nl="'prep.mecanicas.' + j" data-nl-li rows="1" :aria-label="'Regra ' + (j + 1)">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'prep.mecanicas.' + j" :aria-label="'Tirar o item ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul><button type="button" class="nladd" data-nl-add="prep.mecanicas">+ item</button></span>
    <span v-else data-solta><ul v-if="s.prep.mecanicas.length"><li v-for="x in s.prep.mecanicas">{{ x }}</li></ul><p v-else class="muted sm m0">Nada ainda.</p></span>
    <div v-if="prep.ed" v-html="prep.fim"></div><div v-else class="addrow" v-html="prep.lapis"></div></div></details>
  <details v-for="g in elenco" class="rbox" :data-rb="g.tp" v-attr:open="aberta === g.tp"><summary>{{ g.titulo }} ({{ g.itens.length }})</summary><div class="rbody">
    <div v-for="x in g.itens" class="npcrow" data-act="el-ver" :data-tp="g.tp" :data-id="x.id" tabindex="0" role="button" :aria-label="'Abrir ' + x.nome"><img v-if="x.img" :src="IMG(x.img)" alt="" loading="lazy"><div style="flex:1;min-width:0"><b>{{ x.nome }}</b><p v-if="x.texto">{{ x.texto }}</p></div>
      <button v-if="x.lib" type="button" :class="'libdot' + (x.lib.on ? ' on' : '')" :aria-pressed="String(!!x.lib.on)" :aria-label="(x.lib.on ? 'Liberado para a mesa: ' : 'Liberar para a mesa: ') + x.nome" data-act="lib" :data-tp="g.tp" :data-id="x.id" :title="x.lib.on ? 'Liberado para a mesa. Clique para tirar.' : 'Liberar para a mesa'"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6.3 4.6 9 10 3.2"/></svg></button></div>
    <p v-if="!g.itens.length" class="muted sm m0">Nenhum nesta {{ vmin('sessao') }}.</p>
    <div class="addrow"><button class="edb" data-act="el-add" :data-tp="g.tp">+ adicionar</button></div></div></details>
  <details class="rbox" data-rb="notas" v-attr:open="aberta === 'notas' || notas.ed"><summary>Notas da {{ vmin('sessao') }}</summary><div class="rbody" v-attr:data-nlb="notas.ed ? notas.k : null">
    <p v-if="notas.ed" class="muted sm sectxt m0"><textarea class="nl" data-nl="plantado" rows="2" placeholder="Lembretes, o que foi plantado, o que ficou em aberto" aria-label="Lembretes, o que foi plantado, o que ficou em aberto">{{ s.plantado }}</textarea></p>
    <p v-else-if="s.plantado" class="muted sm sectxt m0">{{ s.plantado }}</p><p v-else class="muted sm m0">Nada ainda.</p>
    <div v-if="notas.ed" v-html="notas.fim"></div><div v-else class="addrow" v-html="notas.lapis"></div></div></details>
</template>

<!-- ---------- janelas pequenas ---------- -->

<template id="t-adicionar-sessao">
  <div class="addrow mb-3"><button class="btn" id="asNovo">Criar novo</button></div>
  <span v-if="fora.length" data-solta><span class="flb">Já no elenco</span><div class="libgrid mt-2"><button v-for="x in fora" class="libit" :data-add="x.id">{{ x.nome }}</button></div></span>
  <p v-else class="muted sm">Tudo que está no elenco já faz parte desta {{ vmin('sessao') }}.</p>
</template>

<template id="t-escolher">
  <div style="display:flex;flex-direction:column;gap:.375rem"><button v-for="o in ops" class="btn sec esq" :data-v="o.v">{{ o.l }}</button></div>
</template>
