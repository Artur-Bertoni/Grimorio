<!-- Tabletop: a tela do Mapa (js/pagina-mapa.js). O desenho e um canvas (js/mapa-motor.js); o
     painel ao lado e o caminho sem mouse: lista os mapas e os tokens, com centralizar e editar. -->

<!-- desAberto (a gaveta das formas de desenho esta aberta), ferr (a ferramenta ativa), ini (HTML da iniciativa: a barra do mestre ou o espelho do jogador), iniAberta (a barra esta aberta), iniBotao (o mestre tem sessao para ter iniciativa), encaixa (liga/desliga o encaixe na grade), regua (ferramenta ligada), gm, carregado, espera (HTML do carregando), tem (ha mapa aberto), nome, ativo, painel (aberto), nTokens -->
<template id="t-mapa">
  <div class="boardbar mpbar"><h1>{{ tem ? nome : Vm('mapa') }}</h1><span data-solta v-html="guia"></span><span v-if="tem && gm" :class="'chip' + (ativo ? ' ok' : '')">{{ ativo ? 'Os ' + vmin('jogadores') + ' veem' : 'Só você vê' }}</span><button v-if="tem && gm && cena" type="button" class="btn fant m mpcena" id="mpCena" v-attr:title="'Abrir a ' + vmin('cena') + ' ligada a este ' + vmin('mapa') + ': ' + cena"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5h7l3 3v8H3z"/><path d="M10 2.5v3h3M5.5 8.5h5M5.5 11h3.5"/></svg> <span>{{ cena }}</span></button><span class="esp"></span>
    <div v-if="tem" class="bbacoes"><button v-if="iniBotao" type="button" :class="'ibtn' + (iniAberta ? ' on' : '')" id="iniBtn" :aria-pressed="String(!!iniAberta)">Iniciativa</button><button type="button" :class="'ibtn' + (painel ? ' on' : '')" id="mpPainelBtn" :aria-pressed="String(!!painel)" aria-controls="mpPainel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M10 2.5v11"/></svg> Painel</button><button v-if="gm" type="button" class="btn sec m" id="mpToken" aria-haspopup="menu" aria-expanded="false">+ {{ Vm('token') }}</button><button v-if="gm" type="button" :class="ativo ? 'btn sec m' : 'btn m'" id="mpAtiva">{{ ativo ? 'Parar de mostrar' : 'Mostrar aos ' + vmin('jogadores') }}</button><button v-if="gm" type="button" class="ibtn ico" id="mpEd" v-attr:title="'Editar o ' + vmin('mapa')" v-attr:aria-label="'Editar o ' + vmin('mapa')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h6M12 4.5h1.5M2.5 11.5h1.5M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.6"/><circle cx="5.7" cy="11.5" r="1.6"/></svg></button><button type="button" class="ibtn ico" id="mpMais" aria-haspopup="menu" aria-expanded="false" v-attr:title="gm ? 'Mais: encaixar na grade, histórico, novo ' + vmin('turno') + ', seguir a vez e atalhos' : 'Mais: histórico, seguir a vez e atalhos'" aria-label="Mais ações do mapa"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg></button></div></div>
  <span v-if="gm" data-solta v-html="ini"></span><div v-else id="mIni" v-html="ini"></div>
  <div v-if="!carregado" class="mpvazio"><span data-solta v-html="espera"></span></div>
  <div v-else-if="!tem && gm" class="mpvazio"><p class="empty">Nenhum {{ vmin('mapa') }} nesta {{ vmin('campanha') }} ainda. Comece por um molde pronto (masmorra, taverna, nave…), por uma grade em branco ou pela imagem de um {{ vmin('mapa') }}.</p><button type="button" class="btn" id="mpNovo">Criar o primeiro {{ vmin('mapa') }}</button></div>
  <div v-else-if="!tem" class="mpvazio"><p class="empty">O {{ vmin('mestre') }} ainda não mostrou nenhum {{ vmin('mapa') }}. Quando mostrar, ele aparece aqui sozinho.</p></div>
  <div v-else class="cvwrap mpwrap" id="mpWrap">
    <canvas class="mpcv" id="mpCanvas">{{ Vm('mapa') + ' ' + nome + ', ' + nTokens + ' ' + (nTokens === 1 ? vmin('token') : vmin('tokens')) + '. A lista está no painel.' }}</canvas>
    <aside class="mppainel" id="mpPainel" :aria-label="'Painel do ' + vmin('mapa')" v-attr:hidden="!painel"></aside>
    <fieldset class="cvtools"><legend class="sr-only">Ferramentas do {{ vmin('mapa') }}</legend><button v-if="gm" type="button" :class="ferr === 'selecionar' ? 'on' : ''" data-mpf="selecionar" :aria-pressed="String(ferr === 'selecionar')" title="Selecionar: arraste uma caixa para pegar vários itens (S). Shift soma ao que já está selecionado." aria-label="Selecionar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 2.2 12.5 8 8.6 8.9l2 3.9-1.6.8-2-3.9-2.9 2.2z" fill="currentColor"/></svg></button><button type="button" :class="ferr === 'ping' ? 'on' : ''" data-mpf="ping" :aria-pressed="String(ferr === 'ping')" title="Apontar um ponto do mapa para todos verem (I)" aria-label="Apontar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="8" r="5.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg></button><button type="button" :class="ferr === 'regua' ? 'on' : ''" id="mpRegua" data-mpf="regua" :aria-pressed="String(ferr === 'regua')" title="Régua: arraste para medir (R)" aria-label="Régua"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="5" width="13" height="6" rx="1"/><path d="M4.5 5v2.5M7 5v3.5M9.5 5v2.5M12 5v3.5"/></svg></button><button type="button" id="mpDesfaz" title="Desfazer a sua última ação (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6H9a4 4 0 0 1 0 8H6"/></svg></button><span class="cvsep" aria-hidden="true"></span><button type="button" data-mpz="+" title="Aproximar (+)" aria-label="Aproximar">+</button><button type="button" data-mpz="-" title="Afastar (−)" aria-label="Afastar">−</button><button type="button" data-mpz="0" v-attr:title="enquadre === 'inteiro' ? 'Preencher a tela com o ' + vmin('mapa') + ' (0)' : 'Ver o ' + vmin('mapa') + ' inteiro (0)'" v-attr:aria-label="enquadre === 'inteiro' ? 'Preencher a tela com o ' + vmin('mapa') : 'Ver o ' + vmin('mapa') + ' inteiro'">⤢</button><span class="cvsep" aria-hidden="true"></span><button type="button" id="mpAtalhos" title="Atalhos e gestos (?)" aria-label="Atalhos e gestos"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.2"/><path d="M4 6.5h.01M6.5 6.5h.01M9 6.5h.01M11.5 6.5h.01M4.5 9.5h7"/></svg></button></fieldset>
    <fieldset class="cvtools mpdesenho"><legend class="sr-only">Desenhar e medir áreas</legend><span v-if="gm" data-solta><button type="button" :class="desAtiva ? 'on' : ''" id="mpDesBtn" data-mpf="desenho" aria-haspopup="true" :aria-expanded="String(desAberto)" :aria-pressed="String(desAtiva)" title="Desenhar: linha (L), círculo (O), retângulo (B), polígono (P) e marcação (M)" aria-label="Desenhar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l.9-3.4 7.4-7.4a1.6 1.6 0 0 1 2.3 2.3L5.8 12.6z"/><path d="M9.6 3.9l2.4 2.4M2 14.5h12"/></svg></button><fieldset class="mpflyout" id="mpFlyout" v-attr:hidden="!desAberto" aria-label="Formas de desenho"><button type="button" :class="ferr === 'linha' ? 'on' : ''" data-mpf="linha" :aria-pressed="String(ferr === 'linha')" title="Linha (L)" aria-label="Linha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5 12.5 3.5"/><circle cx="3.5" cy="12.5" r="1.4" fill="currentColor"/><circle cx="12.5" cy="3.5" r="1.4" fill="currentColor"/></svg></button><button type="button" :class="ferr === 'circulo' ? 'on' : ''" data-mpf="circulo" :aria-pressed="String(ferr === 'circulo')" title="Círculo (O)" aria-label="Círculo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/></svg></button><button type="button" :class="ferr === 'retangulo' ? 'on' : ''" data-mpf="retangulo" :aria-pressed="String(ferr === 'retangulo')" title="Retângulo (B)" aria-label="Retângulo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="11" height="8" rx=".5"/></svg></button><button type="button" :class="ferr === 'poligono' ? 'on' : ''" data-mpf="poligono" :aria-pressed="String(ferr === 'poligono')" title="Polígono: um clique por vértice, Enter ou duplo clique fecha (P)" aria-label="Polígono: um clique por vértice, Enter ou duplo clique fecha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l5.5 4-2 6.5h-7L2.5 6z"/></svg></button><button type="button" :class="ferr === 'marca' ? 'on' : ''" data-mpf="marca" :aria-pressed="String(ferr === 'marca')" title="Marcação (M)" aria-label="Marcação"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 9.8 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.6"/></svg></button></fieldset><button type="button" :class="ferr === 'parede' ? 'on' : ''" data-mpf="parede" :aria-pressed="String(ferr === 'parede')" title="Parede: um clique por ponto, Enter ou duplo clique termina (W). Barra o movimento e a visão." aria-label="Parede"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5h12v9H2zM2 8h12M6 3.5V8M10 8v4.5"/></svg></button><button type="button" :class="ferr === 'pincel' ? 'on' : ''" data-mpf="pincel" :aria-pressed="String(ferr === 'pincel')" title="Pincel de névoa: pinte por cima do mapa onde revelar ou esconder (F). Diâmetro e formato estão no painel." aria-label="Pincel de névoa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 3.500 7 9"/><path d="M6.500 8.500c-1.800 0-2.800 1.300-2.800 2.800 0 .9-.5 1.500-1.200 1.900 3 .6 6-.6 5.600-3.200"/></svg></button><button type="button" :class="ferr === 'fog' ? 'on' : ''" data-mpf="fog" :aria-pressed="String(ferr === 'fog')" title="Névoa: desenhe uma área para revelar ou cobrir (N). As opções estão no painel." aria-label="Névoa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5a3 3 0 0 1-.3-6 4 4 0 0 1 7.6 1 2.6 2.6 0 0 1-.3 5z"/></svg></button><span class="cvsep" aria-hidden="true"></span></span><fieldset class="mpregmodo" id="mpRegModo" aria-label="Como medir com a régua" v-attr:hidden="ferr !== 'regua'"><button type="button" :class="reguaModo === 'reta' ? 'on' : ''" data-mp-rmodo="reta" :aria-pressed="String(reguaModo === 'reta')" title="Em linha reta: arraste de um ponto a outro">Reta</button><button type="button" :class="reguaModo === 'trajeto' ? 'on' : ''" data-mp-rmodo="trajeto" :aria-pressed="String(reguaModo === 'trajeto')" title="Pelo caminho: um clique por ponto, Enter ou duplo clique termina">Trajeto</button></fieldset><button type="button" :class="ferr.indexOf('a-') === 0 ? 'on' : ''" id="mpArea" data-mpf="area" aria-haspopup="menu" :aria-pressed="String(ferr.indexOf('a-') === 0)" title="Medir uma área: cone, círculo, linha ou explosão (A)" aria-label="Medir área"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.5 2.8 5.2a6 6 0 0 1 10.4 0z"/></svg></button></fieldset>
  </div>
</template>

<!-- aviso de obra: o que quem nao e administrador ve no lugar do mapa enquanto a administracao nao liberar o mapa (MAPA_LIBERADO, js/mapa-dados.js) -->
<template id="t-mapa-wip">
  <div class="mpwip"><p class="mpwipsel">WIP</p><h1>{{ Vm('mapa') }} em construção</h1><p class="lead">Esta parte ainda está sendo feita e ainda não está liberada.</p></div>
</template>

<!-- abre: {mapas, camadas, sel, des, desenhos, tokens} (quais secoes estao abertas), camadas: [{id, nome, n, oculta, trancada}], cores: [[valor, rótulo]], estilo: {cor, esp, preench, vis}, nSel, tudoTrancado, tudoVisivel, temArea (ha um molde de area na tela), desenhos: [{id, nome, sel, trancado, oculto}] -->
<!-- gm, polling (sem tempo real, so pergunta de tempos em tempos), mapas: [{id, nome, ativo, aberto}], tokens: [{id, nome, img, oculto, meu, sel, resta}] -->
<template id="t-mapa-painel">
  <details v-if="gm" class="mpsec" data-mp-sec="mapas" v-attr:open="abre.mapas"><summary class="mptit">{{ Vm('mapas') }}<span class="chip">{{ mapas.length }}</span></summary>
    <ul class="mplista"><li v-for="m in mapas" :class="'mpitem' + (m.aberto ? ' aberto' : '')"><button type="button" class="mpnome" :data-mp-abre="m.id" v-attr:aria-current="m.aberto ? 'true' : null">{{ m.nome }}</button><span v-if="m.ativo" class="chip ok">Ativo</span></li></ul>
    <button type="button" class="btn sec m mpnovo" data-mp-novo>Novo {{ vmin('mapa') }}</button></details>
  <details v-if="gm" class="mpsec" data-mp-sec="camadas" v-attr:open="abre.camadas"><summary class="mptit">Camadas</summary>
    <ul class="mplista"><li v-for="c in camadas" class="mpitem mpcam"><span class="cresce mpcnome">{{ c.nome }}<span class="muted sm"> · {{ c.n }}</span></span><button type="button" :class="'ibtn' + (c.oculta ? ' on' : '')" :data-mp-cvis="c.id" :aria-pressed="String(c.oculta)" v-attr:title="'Esconder ' + c.nome + ' só para você'">{{ c.oculta ? 'Oculta' : 'Visível' }}</button><button v-if="gm" type="button" :class="'ibtn' + (c.trancada ? ' on' : '')" :data-mp-ctr="c.id" :aria-pressed="String(c.trancada)" v-attr:title="'Trancar ' + c.nome + ': ninguém mexe no que está nela'">{{ c.trancada ? 'Trancada' : 'Solta' }}</button></li></ul></details>
  <details v-if="gm && nSel" class="mpsec form" data-mp-sec="sel" v-attr:open="abre.sel"><summary class="mptit">Seleção<span class="chip">{{ nSel }}</span></summary>
    <div class="mpacoes"><button type="button" class="btn sec m" data-mp-sacao="trancar">{{ tudoTrancado ? 'Destrancar' : 'Trancar' }}</button><button type="button" class="btn sec m" data-mp-sacao="visivel">{{ tudoVisivel ? 'Esconder' : 'Mostrar' }}</button><button type="button" class="btn sec m" data-mp-sacao="frente" title="Para cima de tudo o que está no mapa (])">Para a frente</button><button type="button" class="btn sec m" data-mp-sacao="tras" title="Para baixo de tudo o que está no mapa ([)">Para trás</button><button type="button" class="btn dang m" data-mp-sacao="remover">Remover</button></div>
    <label>Camada<select id="mpSelCamada"><option value="" selected>Mover para…</option><option v-for="c in camadas" :value="c.id">{{ c.nome }}</option></select></label></details>
  <details v-if="gm" class="mpsec form" data-mp-sec="des" v-attr:open="abre.des"><summary class="mptit">Estilo do desenho</summary>
    <label>Cor<select id="mpDesCor"><option v-for="o in cores" :value="o[0]" v-attr:selected="o[0] === estilo.cor">{{ o[1] }}</option></select></label>
    <label>Espessura<input id="mpDesEsp" type="number" min="1" max="12" v-attr:value="estilo.esp"></label>
    <label class="ck"><input type="checkbox" id="mpDesPre" v-attr:checked="estilo.preench > 0"> Preencher</label>
    <label class="ck"><input type="checkbox" id="mpDesVis" v-attr:checked="estilo.vis"> Visível para os {{ vmin('jogadores') }}</label>
    <button v-if="temArea" type="button" class="btn m" data-mp-fixa>Fixar a área no {{ vmin('mapa') }}</button></details>
  <details v-if="gm" class="mpsec form" data-mp-sec="visao" v-attr:open="abre.visao"><summary class="mptit">Névoa<span v-if="fog !== 'nenhum'" class="chip">{{ fog === 'visao' ? 'Visão' : 'Manual' }}</span></summary>
    <label>Névoa<select id="mpFogModo"><option v-for="o in fogModos" :value="o[0]" v-attr:selected="o[0] === fog">{{ o[1] }}</option></select></label>
    <p class="muted sm">{{ fog === 'nenhum' ? 'O ' + vmin('mapa') + ' aparece inteiro para os ' + vmin('jogadores') + '.' : (fog === 'manual' ? 'Só o que você revelar com áreas e com o pincel.' : 'O que os personagens enxergam, mais as áreas que você revelar.') }}<span v-if="fog !== 'nenhum'"> O resto da imagem, as paredes e quem está escondido não saem do servidor.</span></p>
    <label v-if="fog === 'visao'" class="ck"><input type="checkbox" id="mpFogMemoria" v-attr:checked="fogMemoria"> Lembrar o que já foi explorado</label>
    <div v-if="fog === 'visao' && fogMemoria" class="mpacoes"><button type="button" class="btn sec m" id="mpFogEsquece">Esquecer o explorado</button></div>
    <label v-if="fog === 'visao'">Alcance padrão da visão (casas)<input id="mpVisaoPadrao" type="number" min="1" max="100" step="0.5" v-attr:value="visaoPadrao"></label>
    <label v-if="fog !== 'nenhum'" class="ck"><input type="checkbox" id="mpFogComo" v-attr:checked="comoJogador"> Ver como os {{ vmin('jogadores') }} veem</label>
    <div v-if="fog !== 'nenhum'" class="mpacoes"><button type="button" class="btn sec m" id="mpFogRevela">Revelar tudo</button><button type="button" class="btn sec m" id="mpFogCobre">Cobrir tudo</button></div>
    <label>Área e pincel<select id="mpFogAcao"><option value="revela" v-attr:selected="fogRevela">Revelam</option><option value="cobre" v-attr:selected="!fogRevela">Cobrem de novo</option></select></label>
    <label>Forma da área (N)<select id="mpFogForma"><option v-for="o in fogFormas" :value="o[0]" v-attr:selected="o[0] === fogForma">{{ o[1] }}</option></select></label></details>
  <details v-if="gm" class="mpsec form" data-mp-sec="pincel" v-attr:open="abre.pincel"><summary class="mptit">Pincel de névoa</summary>
    <label>Diâmetro (casas)<input id="mpPincelCasas" type="number" min="0.25" max="30" step="0.25" v-attr:value="pincel.casas"></label>
    <label>Formato<select id="mpPincelPonta"><option v-for="o in pontas" :value="o[0]" v-attr:selected="o[0] === pincel.ponta">{{ o[1] }}</option></select></label>
    <label>Borda<select id="mpPincelBorda"><option value="macia" v-attr:selected="pincel.suave">Macia</option><option value="firme" v-attr:selected="!pincel.suave">Firme</option></select></label>
    <p class="muted sm">Com o pincel (F), arraste por cima do {{ vmin('mapa') }}. Ele revela ou cobre conforme “Área e pincel”, na seção Névoa.</p></details>
  <details v-if="gm" class="mpsec form" data-mp-sec="paredes" v-attr:open="abre.paredes"><summary class="mptit">Paredes<span v-if="paredes.length" class="chip">{{ paredes.length }}</span></summary>
    <label>Próxima parede (W)<select id="mpParedeKind"><option v-for="o in paredeKinds" :value="o[0]" v-attr:selected="o[0] === paredeKind">{{ o[1] }}</option></select></label>
    <p class="muted sm">Parede barra o movimento e a visão; janela, só o movimento; porta fechada, os dois.</p>
    <ul v-if="paredes.length" class="mplista"><li v-for="t in paredes" :class="'mpitem' + (t.sel ? ' sel' : '')"><button type="button" class="mpnome" :data-mp-sel="t.id" v-attr:aria-pressed="t.sel ? 'true' : 'false'" v-attr:title="'Selecionar ' + t.nome"><span class="mpava" aria-hidden="true"></span><span class="cresce">{{ t.nome }}</span></button><button v-if="t.porta" type="button" :class="'ibtn' + (t.aberta ? ' on' : '')" :data-mp-porta="t.id" :aria-pressed="String(t.aberta)" v-attr:title="(t.aberta ? 'Fechar ' : 'Abrir ') + t.nome">{{ t.aberta ? 'Aberta' : 'Fechada' }}</button><span v-if="t.trancado" class="chip">Trancada</span><button type="button" class="edb ico" :data-mp-ed="t.id" v-attr:title="'Editar ' + t.nome" v-attr:aria-label="'Editar ' + t.nome"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button></li></ul></details>
  <details v-if="gm && areas.length" class="mpsec" data-mp-sec="areas" v-attr:open="abre.areas"><summary class="mptit">Áreas de névoa<span class="chip">{{ areas.length }}</span></summary>
