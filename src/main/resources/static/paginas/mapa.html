<!-- Tabletop: a tela do Mapa (js/pagina-mapa.js). O desenho e um canvas (js/mapa-motor.js); o
     painel ao lado e o caminho sem mouse: lista os mapas e os tokens, com centralizar e editar. -->

<!-- desAberto (a gaveta das formas de desenho esta aberta), ferr (a ferramenta ativa), ini (HTML da iniciativa: a barra do mestre ou o espelho do jogador), iniAberta (a barra esta aberta), iniBotao (o mestre tem sessao para ter iniciativa), encaixa (liga/desliga o encaixe na grade), regua (ferramenta ligada), gm, carregado, espera (HTML do carregando), tem (ha mapa aberto), nome, ativo, painel (aberto), nTokens -->
<template id="t-mapa">
  <div class="boardbar mpbar"><h1>{{ tem ? nome : Vm('mapa') }}</h1><span v-if="tem && gm" :class="'chip' + (ativo ? ' ok' : '')">{{ ativo ? 'Os ' + vmin('jogadores') + ' veem' : 'Só você vê' }}</span><span class="esp"></span>
    <div v-if="tem" class="bbacoes"><button v-if="gm" type="button" :class="'ibtn' + (encaixa ? ' on' : '')" id="mpEncaixe" :aria-pressed="String(!!encaixa)" title="Encaixar na grade ao soltar, para todos. Desligado, ninguém é encaixado. Segurar Alt inverte só para você."><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 2.5h11v11h-11zM2.5 8h11M8 2.5v11"/></svg> Encaixar na grade</button><button v-if="iniBotao" type="button" :class="'ibtn' + (iniAberta ? ' on' : '')" id="iniBtn" :aria-pressed="String(!!iniAberta)">Iniciativa</button><button type="button" :class="'ibtn' + (painel ? ' on' : '')" id="mpPainelBtn" :aria-pressed="String(!!painel)" aria-controls="mpPainel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M10 2.5v11"/></svg> Painel</button><button v-if="gm" type="button" class="ibtn ico" id="mpEd" v-attr:title="'Editar o ' + vmin('mapa')" v-attr:aria-label="'Editar o ' + vmin('mapa')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h6M12 4.5h1.5M2.5 11.5h1.5M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.6"/><circle cx="5.7" cy="11.5" r="1.6"/></svg></button><button v-if="gm" type="button" class="btn sec m" id="mpToken" aria-haspopup="menu" aria-expanded="false">+ {{ Vm('token') }}</button><button v-if="gm" type="button" :class="ativo ? 'btn sec m' : 'btn m'" id="mpAtiva">{{ ativo ? 'Parar de mostrar' : 'Mostrar aos ' + vmin('jogadores') }}</button></div></div>
  <span v-if="gm" data-solta v-html="ini"></span><div v-else id="mIni" v-html="ini"></div>
  <div v-if="!carregado" class="mpvazio"><span data-solta v-html="espera"></span></div>
  <div v-else-if="!tem && gm" class="mpvazio"><p class="empty">Nenhum {{ vmin('mapa') }} nesta {{ vmin('campanha') }} ainda. Envie a imagem de um {{ vmin('mapa') }} ou comece por uma grade em branco.</p><button type="button" class="btn" id="mpNovo">Criar o primeiro {{ vmin('mapa') }}</button></div>
  <div v-else-if="!tem" class="mpvazio"><p class="empty">O {{ vmin('mestre') }} ainda não mostrou nenhum {{ vmin('mapa') }}. Quando mostrar, ele aparece aqui sozinho.</p></div>
  <div v-else class="cvwrap mpwrap" id="mpWrap">
    <canvas class="mpcv" id="mpCanvas">{{ Vm('mapa') + ' ' + nome + ', ' + nTokens + ' ' + (nTokens === 1 ? vmin('token') : vmin('tokens')) + '. A lista está no painel.' }}</canvas>
    <aside class="mppainel" id="mpPainel" :aria-label="'Painel do ' + vmin('mapa')" v-attr:hidden="!painel"></aside>
    <fieldset class="cvtools"><legend class="sr-only">Ferramentas do {{ vmin('mapa') }}</legend><button v-if="gm" type="button" :class="ferr === 'selecionar' ? 'on' : ''" data-mpf="selecionar" :aria-pressed="String(ferr === 'selecionar')" title="Selecionar: arraste uma caixa para pegar vários itens (S). Shift soma ao que já está selecionado." aria-label="Selecionar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 2.2 12.5 8 8.6 8.9l2 3.9-1.6.8-2-3.9-2.9 2.2z" fill="currentColor"/></svg></button><button type="button" :class="ferr === 'ping' ? 'on' : ''" data-mpf="ping" :aria-pressed="String(ferr === 'ping')" title="Apontar um ponto do mapa para todos verem (I)" aria-label="Apontar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="8" r="5.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg></button><button type="button" :class="ferr === 'regua' ? 'on' : ''" id="mpRegua" data-mpf="regua" :aria-pressed="String(ferr === 'regua')" title="Régua: arraste para medir (R)" aria-label="Régua"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="5" width="13" height="6" rx="1"/><path d="M4.5 5v2.5M7 5v3.5M9.5 5v2.5M12 5v3.5"/></svg></button><button type="button" id="mpDesfaz" title="Desfazer a sua última ação (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6H9a4 4 0 0 1 0 8H6"/></svg></button><span class="cvsep" aria-hidden="true"></span><button type="button" data-mpz="+" title="Aproximar" aria-label="Aproximar">+</button><button type="button" data-mpz="-" title="Afastar" aria-label="Afastar">−</button><button type="button" data-mpz="0" title="Enquadrar o mapa (0)" aria-label="Enquadrar o mapa">⤢</button></fieldset>
    <fieldset class="cvtools mpdesenho"><legend class="sr-only">Desenhar e medir áreas</legend><span v-if="gm" data-solta><button type="button" :class="desAtiva ? 'on' : ''" id="mpDesBtn" data-mpf="desenho" aria-haspopup="true" :aria-expanded="String(desAberto)" :aria-pressed="String(desAtiva)" title="Desenhar: linha, círculo, retângulo, polígono e marcação" aria-label="Desenhar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l.9-3.4 7.4-7.4a1.6 1.6 0 0 1 2.3 2.3L5.8 12.6z"/><path d="M9.6 3.9l2.4 2.4M2 14.5h12"/></svg></button><span class="mpflyout" id="mpFlyout" v-attr:hidden="!desAberto" role="group" aria-label="Formas de desenho"><button type="button" :class="ferr === 'linha' ? 'on' : ''" data-mpf="linha" :aria-pressed="String(ferr === 'linha')" title="Linha (L)" aria-label="Linha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5 12.5 3.5"/><circle cx="3.5" cy="12.5" r="1.4" fill="currentColor"/><circle cx="12.5" cy="3.5" r="1.4" fill="currentColor"/></svg></button><button type="button" :class="ferr === 'circulo' ? 'on' : ''" data-mpf="circulo" :aria-pressed="String(ferr === 'circulo')" title="Círculo (O)" aria-label="Círculo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/></svg></button><button type="button" :class="ferr === 'retangulo' ? 'on' : ''" data-mpf="retangulo" :aria-pressed="String(ferr === 'retangulo')" title="Retângulo (B)" aria-label="Retângulo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="11" height="8" rx=".5"/></svg></button><button type="button" :class="ferr === 'poligono' ? 'on' : ''" data-mpf="poligono" :aria-pressed="String(ferr === 'poligono')" title="Polígono: um clique por vértice, Enter ou duplo clique fecha (P)" aria-label="Polígono: um clique por vértice, Enter ou duplo clique fecha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l5.5 4-2 6.5h-7L2.5 6z"/></svg></button><button type="button" :class="ferr === 'marca' ? 'on' : ''" data-mpf="marca" :aria-pressed="String(ferr === 'marca')" title="Marcação (M)" aria-label="Marcação"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 9.8 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.6"/></svg></button></span><span class="cvsep" aria-hidden="true"></span></span><span class="mpregmodo" id="mpRegModo" role="group" aria-label="Como medir com a régua" v-attr:hidden="ferr !== 'regua'"><button type="button" :class="reguaModo === 'reta' ? 'on' : ''" data-mp-rmodo="reta" :aria-pressed="String(reguaModo === 'reta')" title="Em linha reta: arraste de um ponto a outro">Reta</button><button type="button" :class="reguaModo === 'trajeto' ? 'on' : ''" data-mp-rmodo="trajeto" :aria-pressed="String(reguaModo === 'trajeto')" title="Pelo caminho: um clique por ponto, Enter ou duplo clique termina">Trajeto</button></span><button type="button" :class="ferr.indexOf('a-') === 0 ? 'on' : ''" id="mpArea" data-mpf="area" aria-haspopup="menu" :aria-pressed="String(ferr.indexOf('a-') === 0)" title="Medir uma área: cone, círculo, linha ou explosão (A)" aria-label="Medir área"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.5 2.8 5.2a6 6 0 0 1 10.4 0z"/></svg></button></fieldset>
    <div class="cvhint mphint"><span class="so-mouse">Arraste o fundo para mover · Roda do mouse para zoom · Arraste um {{ vmin('token') }} para movê-lo{{ gm ? ' (Alt inverte o encaixe)' : '' }} · R mede · Setas andam uma casa · Ctrl+Z desfaz</span><span class="so-toque">Um dedo move · Dois dedos dão zoom · Arraste um {{ vmin('token') }} para movê-lo · Régua mede</span></div>
  </div>
</template>

<!-- aviso de obra: o que quem nao e administrador ve no lugar do mapa enquanto a administracao nao liberar o mapa (MAPA_LIBERADO, js/mapa-dados.js) -->
<template id="t-mapa-wip">
  <div class="mpwip"><p class="mpwipsel">WIP</p><h1>{{ Vm('mapa') }} em construção</h1><p class="lead">Esta parte ainda está sendo feita e ainda não está liberada.</p></div>
</template>

<!-- abre: {mapas, camadas, sel, des, desenhos, tokens, acoes} (quais secoes estao abertas), camadas: [{id, nome, n, oculta, trancada}], cores: [[valor, rótulo]], estilo: {cor, esp, preench, vis}, nSel, todosTrancados, todosVisiveis, temArea (ha um molde de area na tela), desenhos: [{id, nome, sel, trancado, oculto}] -->
<!-- gm, polling (sem tempo real, so pergunta de tempos em tempos), mapas: [{id, nome, ativo, aberto}], tokens: [{id, nome, img, oculto, meu, sel, resta}] -->
<template id="t-mapa-painel">
  <details v-if="gm" class="mpsec" data-mp-sec="mapas" v-attr:open="abre.mapas"><summary class="mptit">{{ Vm('mapas') }}<span class="chip">{{ mapas.length }}</span></summary>
    <ul class="mplista"><li v-for="m in mapas" :class="'mpitem' + (m.aberto ? ' aberto' : '')"><button type="button" class="mpnome" :data-mp-abre="m.id" v-attr:aria-current="m.aberto ? 'true' : null">{{ m.nome }}</button><span v-if="m.ativo" class="chip ok">Ativo</span></li></ul>
    <button type="button" class="addbtn" data-mp-novo>+ {{ Vm('mapa') }}</button></details>
  <details class="mpsec" data-mp-sec="camadas" v-attr:open="abre.camadas"><summary class="mptit">Camadas</summary>
    <ul class="mplista"><li v-for="c in camadas" class="mpitem mpcam"><span class="cresce mpcnome">{{ c.nome }}<span class="muted sm"> · {{ c.n }}</span></span><button type="button" :class="'ibtn' + (c.oculta ? ' on' : '')" :data-mp-cvis="c.id" :aria-pressed="String(c.oculta)" v-attr:title="'Esconder ' + c.nome + ' só para você'">{{ c.oculta ? 'Oculta' : 'Visível' }}</button><button v-if="gm" type="button" :class="'ibtn' + (c.trancada ? ' on' : '')" :data-mp-ctr="c.id" :aria-pressed="String(c.trancada)" v-attr:title="'Trancar ' + c.nome + ': ninguém mexe no que está nela'">{{ c.trancada ? 'Trancada' : 'Solta' }}</button></li></ul></details>
  <details v-if="gm && nSel" class="mpsec form" data-mp-sec="sel" v-attr:open="abre.sel"><summary class="mptit">Seleção<span class="chip">{{ nSel }}</span></summary>
    <div class="mpacoes"><button type="button" class="btn sec m" data-mp-sacao="trancar">{{ todosTrancados ? 'Destrancar' : 'Trancar' }}</button><button type="button" class="btn sec m" data-mp-sacao="visivel">{{ todosVisiveis ? 'Esconder' : 'Mostrar' }}</button><button type="button" class="btn sec m" data-mp-sacao="frente" title="Para cima de tudo o que está no mapa (])">Para a frente</button><button type="button" class="btn sec m" data-mp-sacao="tras" title="Para baixo de tudo o que está no mapa ([)">Para trás</button><button type="button" class="btn dang m" data-mp-sacao="remover">Remover</button></div>
    <label>Camada<select id="mpSelCamada"><option value="" selected>Mover para…</option><option v-for="c in camadas" :value="c.id">{{ c.nome }}</option></select></label></details>
  <details v-if="gm" class="mpsec form" data-mp-sec="des" v-attr:open="abre.des"><summary class="mptit">Estilo do desenho</summary>
    <label>Cor<select id="mpDesCor"><option v-for="o in cores" :value="o[0]" v-attr:selected="o[0] === estilo.cor">{{ o[1] }}</option></select></label>
    <label>Espessura<input id="mpDesEsp" type="number" min="1" max="12" v-attr:value="estilo.esp"></label>
    <label class="ck"><input type="checkbox" id="mpDesPre" v-attr:checked="estilo.preench > 0"> Preencher</label>
    <label class="ck"><input type="checkbox" id="mpDesVis" v-attr:checked="estilo.vis"> Visível para os {{ vmin('jogadores') }}</label>
    <button v-if="temArea" type="button" class="btn m" data-mp-fixa>Fixar a área no {{ vmin('mapa') }}</button></details>
  <details v-if="gm && desenhos.length" class="mpsec" data-mp-sec="desenhos" v-attr:open="abre.desenhos"><summary class="mptit">Desenhos<span class="chip">{{ desenhos.length }}</span></summary>
    <ul class="mplista"><li v-for="t in desenhos" :class="'mpitem' + (t.sel ? ' sel' : '')"><button type="button" class="mpnome" :data-mp-sel="t.id" v-attr:aria-pressed="t.sel ? 'true' : 'false'" v-attr:title="'Selecionar ' + t.nome"><span class="mpava" aria-hidden="true"></span><span class="cresce">{{ t.nome }}</span></button><span v-if="t.trancado" class="chip">Trancado</span><span v-if="t.oculto" class="chip">Oculto</span><button type="button" class="edb ico" :data-mp-ed="t.id" v-attr:title="'Editar ' + t.nome" v-attr:aria-label="'Editar ' + t.nome"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button></li></ul></details>
  <details class="mpsec" data-mp-sec="tokens" v-attr:open="abre.tokens"><summary class="mptit">{{ Vm('tokens') }}<span class="chip">{{ tokens.length }}</span></summary>
    <ul v-if="tokens.length" class="mplista"><li v-for="t in tokens" :class="'mpitem' + (t.sel ? ' sel' : '')"><button type="button" class="mpnome" :data-mp-sel="t.id" v-attr:aria-pressed="t.sel ? 'true' : 'false'" v-attr:title="'Centralizar ' + t.nome"><img v-if="t.img" class="mpava" :src="t.img" alt="" loading="lazy"><span v-else class="mpava" aria-hidden="true"></span><span class="cresce">{{ t.nome }}</span></button><span v-if="t.vida" class="chip" title="Vida">{{ t.vida }}</span><span v-for="m in t.marcas" class="chip">{{ m }}</span><span v-if="t.trancado" class="chip">Trancado</span><span v-if="t.daVez" class="chip ok">Na vez</span><span v-if="t.resta" class="chip" title="Deslocamento que resta neste turno, do total por turno">{{ t.resta }}</span><span v-if="t.oculto" class="chip">Oculto</span><span v-if="t.meu && !gm" class="chip ok">Seu</span><button v-if="gm || t.meu" type="button" class="edb ico" :data-mp-ed="t.id" v-attr:title="'Editar ' + t.nome" v-attr:aria-label="'Editar ' + t.nome"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button></li></ul>
    <p v-else class="muted sm">{{ gm ? 'Nenhum ' + vmin('token') + ' ainda. Use “+ ' + Vm('token') + '” no alto.' : 'Nenhum ' + vmin('token') + ' à vista.' }}</p></details>
  <details class="mpsec" data-mp-sec="acoes" v-attr:open="abre.acoes"><summary class="mptit">Ações</summary>
    <div class="mpacoes"><button type="button" class="btn sec m" data-mp-undo title="Desfaz a sua última ação (Ctrl+Z)">Desfazer</button><button type="button" class="btn sec m" data-mp-hist>Histórico</button><button v-if="gm" type="button" class="btn sec m" data-mp-turno v-attr:title="'Começa um ' + vmin('turno') + ' novo: zera o deslocamento gasto de todos os ' + vmin('tokens') + '. A iniciativa já faz isso sozinha a cada ' + vmin('turno') + '.'">Novo {{ vmin('turno') }}</button></div></details>
  <output v-if="polling" class="muted sm mpaviso">Sem conexão em tempo real: o {{ vmin('mapa') }} se atualiza a cada 3 segundos.</output>
</template>
