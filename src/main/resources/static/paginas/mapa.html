<!-- Tabletop: a tela do Mapa (js/pagina-mapa.js). O desenho e um canvas (js/mapa-motor.js); o
     painel ao lado e o caminho sem mouse: lista os mapas e os tokens, com centralizar e editar. -->

<!-- ini (HTML da iniciativa: a barra do mestre ou o espelho do jogador), iniAberta (a barra esta aberta), iniBotao (o mestre tem sessao para ter iniciativa), encaixa (liga/desliga o encaixe na grade), regua (ferramenta ligada), gm, carregado, espera (HTML do carregando), tem (ha mapa aberto), nome, ativo, painel (aberto), nTokens -->
<template id="t-mapa">
  <div class="boardbar mpbar"><h1>{{ tem ? nome : Vm('mapa') }}</h1><span v-if="tem && gm" :class="'chip' + (ativo ? ' ok' : '')">{{ ativo ? 'Os ' + vmin('jogadores') + ' veem' : 'Só você vê' }}</span><span class="esp"></span>
    <div v-if="tem" class="bbacoes"><button type="button" :class="'ibtn' + (encaixa ? ' on' : '')" id="mpEncaixe" :aria-pressed="String(!!encaixa)" title="Encaixar na grade ao soltar. Desligado, o token fica onde você soltar. Segurar Alt inverte.">Encaixar na grade</button><button v-if="iniBotao" type="button" :class="'ibtn' + (iniAberta ? ' on' : '')" id="iniBtn" :aria-pressed="String(!!iniAberta)">Iniciativa</button><button type="button" :class="'ibtn' + (painel ? ' on' : '')" id="mpPainelBtn" :aria-pressed="String(!!painel)" aria-controls="mpPainel">Painel</button><button v-if="gm" type="button" class="ibtn ico" id="mpEd" v-attr:title="'Editar o ' + vmin('mapa')" v-attr:aria-label="'Editar o ' + vmin('mapa')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button><button v-if="gm" type="button" class="btn sec m" id="mpToken" aria-haspopup="menu" aria-expanded="false">+ {{ Vm('token') }}</button><button v-if="gm" type="button" :class="ativo ? 'btn sec m' : 'btn m'" id="mpAtiva">{{ ativo ? 'Parar de mostrar' : 'Mostrar aos ' + vmin('jogadores') }}</button></div></div>
  <span v-if="gm" data-solta v-html="ini"></span><div v-else id="mIni" v-html="ini"></div>
  <div v-if="!carregado" class="mpvazio"><span data-solta v-html="espera"></span></div>
  <div v-else-if="!tem && gm" class="mpvazio"><p class="empty">Nenhum {{ vmin('mapa') }} nesta {{ vmin('campanha') }} ainda. Envie a imagem de um {{ vmin('mapa') }} ou comece por uma grade em branco.</p><button type="button" class="btn" id="mpNovo">Criar o primeiro {{ vmin('mapa') }}</button></div>
  <div v-else-if="!tem" class="mpvazio"><p class="empty">O {{ vmin('mestre') }} ainda não mostrou nenhum {{ vmin('mapa') }}. Quando mostrar, ele aparece aqui sozinho.</p></div>
  <div v-else class="cvwrap mpwrap" id="mpWrap">
    <canvas class="mpcv" id="mpCanvas">{{ Vm('mapa') + ' ' + nome + ', ' + nTokens + ' ' + (nTokens === 1 ? vmin('token') : vmin('tokens')) + '. A lista está no painel.' }}</canvas>
    <aside class="mppainel" id="mpPainel" :aria-label="'Painel do ' + vmin('mapa')" v-attr:hidden="!painel"></aside>
    <fieldset class="cvtools"><legend class="sr-only">Ferramentas do {{ vmin('mapa') }}</legend><button type="button" :class="regua ? 'on' : ''" id="mpRegua" :aria-pressed="String(!!regua)" title="Régua: arraste para medir (R)" aria-label="Régua"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 11 11 2.5 13.5 5 5 13.5Z"/><path d="M5.2 8.3l1.5 1.5M7.4 6.1l1.5 1.5M9.6 3.9l1 1"/></svg></button><button type="button" id="mpDesfaz" title="Desfazer a sua última ação (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6H9a4 4 0 0 1 0 8H6"/></svg></button><span class="cvsep" aria-hidden="true"></span><button type="button" data-mpz="+" title="Aproximar" aria-label="Aproximar">+</button><button type="button" data-mpz="-" title="Afastar" aria-label="Afastar">−</button><button type="button" data-mpz="0" title="Enquadrar o mapa (0)" aria-label="Enquadrar o mapa">⤢</button></fieldset>
    <div class="cvhint mphint"><span class="so-mouse">Arraste o fundo para mover · Roda do mouse para zoom · Arraste um {{ vmin('token') }} para movê-lo (Alt inverte o encaixe) · R mede · Setas andam uma casa · Ctrl+Z desfaz</span><span class="so-toque">Um dedo move · Dois dedos dão zoom · Arraste um {{ vmin('token') }} para movê-lo · Régua mede</span></div>
  </div>
</template>

<!-- aviso de obra: o que quem nao e administrador ve no lugar do mapa enquanto a administracao nao liberar o mapa (MAPA_LIBERADO, js/mapa-dados.js) -->
<template id="t-mapa-wip">
  <div class="mpwip"><p class="mpwipsel">WIP</p><h1>{{ Vm('mapa') }} em construção</h1><p class="lead">Esta parte ainda está sendo feita e ainda não está liberada.</p></div>
</template>

<!-- gm, polling (sem tempo real, so pergunta de tempos em tempos), mapas: [{id, nome, ativo, aberto}], tokens: [{id, nome, img, oculto, meu, sel, resta}] -->
<template id="t-mapa-painel">
  <section v-if="gm" class="mpsec" aria-labelledby="mpSecMapas"><h2 class="mptit" id="mpSecMapas">{{ Vm('mapas') }}</h2>
    <ul class="mplista"><li v-for="m in mapas" :class="'mpitem' + (m.aberto ? ' aberto' : '')"><button type="button" class="mpnome" :data-mp-abre="m.id" v-attr:aria-current="m.aberto ? 'true' : null">{{ m.nome }}</button><span v-if="m.ativo" class="chip ok">Ativo</span></li></ul>
    <button type="button" class="addbtn" data-mp-novo>+ {{ Vm('mapa') }}</button></section>
  <section class="mpsec" aria-labelledby="mpSecTokens"><h2 class="mptit" id="mpSecTokens">{{ Vm('tokens') }}</h2>
    <ul v-if="tokens.length" class="mplista"><li v-for="t in tokens" :class="'mpitem' + (t.sel ? ' sel' : '')"><button type="button" class="mpnome" :data-mp-sel="t.id" v-attr:aria-pressed="t.sel ? 'true' : 'false'" v-attr:title="'Centralizar ' + t.nome"><img v-if="t.img" class="mpava" :src="t.img" alt="" loading="lazy"><span v-else class="mpava" aria-hidden="true"></span><span class="cresce">{{ t.nome }}</span></button><span v-if="t.daVez" class="chip ok">Na vez</span><span v-if="t.resta" class="chip" title="Deslocamento que resta neste turno, do total por turno">{{ t.resta }}</span><span v-if="t.oculto" class="chip">Oculto</span><span v-if="t.meu && !gm" class="chip ok">Seu</span><button v-if="gm" type="button" class="edb ico" :data-mp-ed="t.id" v-attr:title="'Editar ' + t.nome" v-attr:aria-label="'Editar ' + t.nome"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button></li></ul>
    <p v-else class="muted sm">{{ gm ? 'Nenhum ' + vmin('token') + ' ainda. Use “+ ' + Vm('token') + '” no alto.' : 'Nenhum ' + vmin('token') + ' à vista.' }}</p></section>
  <section class="mpsec" aria-labelledby="mpSecAcoes"><h2 class="mptit" id="mpSecAcoes">Ações</h2>
    <div class="mpacoes"><button type="button" class="btn sec m" data-mp-undo title="Desfaz a sua última ação (Ctrl+Z)">Desfazer</button><button type="button" class="btn sec m" data-mp-hist>Histórico</button><button v-if="gm" type="button" class="btn sec m" data-mp-turno v-attr:title="'Começa um ' + vmin('turno') + ' novo: zera o deslocamento gasto de todos os ' + vmin('tokens') + '. A iniciativa já faz isso sozinha a cada ' + vmin('turno') + '.'">Novo {{ vmin('turno') }}</button></div></section>
  <output v-if="polling" class="muted sm mpaviso">Sem conexão em tempo real: o {{ vmin('mapa') }} se atualiza a cada 3 segundos.</output>
</template>
