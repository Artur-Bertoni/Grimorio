<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grimório</title>
<meta name="description" content="Política de privacidade e termos de uso desta instância do Grimório.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#130d0f">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icones/180.png">
<link rel="stylesheet" href="/vendor/fontes.css">
<script>
/* privacidade e termos sao abertos sem conta: vestem o ultimo tema usado neste aparelho, como o login */
try{ var p=JSON.parse(localStorage.getItem("grim_pele")||"null");
  if(p&&p.v){ var r=document.documentElement; for(var k in p.v)r.style.setProperty("--"+k,p.v[k]); r.style.setProperty("color-scheme",p.esquema||"dark"); }
}catch(error_){ /* sem armazenamento: fica o tema padrao */ }
</script>
<style>
:root{--bg:#0a0708;--bg2:#130d0f;--line2:#48313a;--fg:#ece4d9;--fg2:#b7a9a2;--fg3:#8f817d;--gold:#c9a227;--gold2:#e8c45a;--blood2:#e5455a;
--disp:"Cinzel",Georgia,serif;--body:"Spectral",Georgia,serif;--ui:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(16px,calc(11px + .36vw),18px)}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.65 var(--body);padding:2rem 1rem 3rem}
main{max-width:46rem;margin:0 auto;background:var(--bg2);border:1px solid var(--line2);border-radius:.5rem;padding:2rem clamp(1.25rem,4vw,2.5rem)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;font:600 .9375rem/1.3 var(--ui)}
.topo a,footer a{color:var(--gold)}
.topo a:hover,footer a:hover{color:var(--gold2)}
.eyebrow{font:600 .8125rem/1.3 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--blood2);margin:0}
h1{font:800 clamp(1.75rem,5vw,2.4rem)/1.15 var(--disp);margin:.25rem 0 1.25rem}
p{margin:0 0 1rem;color:var(--fg2);max-width:68ch}
.nota{font-size:.875rem;color:var(--fg3);border-top:1px solid var(--line2);padding-top:1rem;margin-top:1.5rem}
footer{max-width:46rem;margin:1.25rem auto 0;display:flex;gap:.5rem 1.25rem;flex-wrap:wrap;justify-content:center;font:600 .8125rem/1.4 var(--ui);color:var(--fg2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="topo"><a href="/">‹ Voltar ao Grimório</a><a id="outro" href="/termos">Termos de uso</a></div>
  <p class="eyebrow">Esta instância</p>
  <h1 id="tit">Privacidade</h1>
  <div id="texto" aria-live="polite"><p>Carregando…</p></div>
  <p class="nota" id="nota" hidden>Este é o texto padrão do Grimório. Quem administra esta instância pode trocá-lo em Administração › Textos legais.</p>
</main>
<footer><span>© <span id="ano"></span> Grimório · Todos os direitos reservados</span><a href="/privacidade">Privacidade</a><a href="/termos">Termos de uso</a></footer>
<script>
(function(){
  "use strict";
  document.title=(/termos/.test(location.pathname)?"Termos de uso":"Privacidade")+" · Grimório";
  var chave=/termos/.test(location.pathname)||/[?&]t=termos/.test(location.search)?"termos":"privacidade";
  var outro=document.getElementById("outro");
  outro.href=chave==="termos"?"/privacidade":"/termos";
  outro.textContent=chave==="termos"?"Privacidade":"Termos de uso";
  document.getElementById("ano").textContent=new Date().getFullYear();
  var caixa=document.getElementById("texto");
  fetch("/api/publico/texto/"+chave,{credentials:"same-origin"}).then(function(r){
    if(!r.ok)throw new Error(String(r.status)); return r.json(); }).then(function(j){
    var tit=j.titulo||(chave==="termos"?"Termos de uso":"Privacidade");
    document.getElementById("tit").textContent=tit;
    document.title=tit+" · Grimório";
    if(!String(j.texto||"").trim())throw new Error("vazio");
    caixa.textContent="";
    /* paragrafos separados por linha em branco; texto entra como texto, nunca como HTML */
    String(j.texto||"").split(/\n\s*\n/).forEach(function(par){
      var p=document.createElement("p"); p.textContent=par.trim(); if(p.textContent)caixa.appendChild(p); });
    document.getElementById("nota").hidden=!j.padrao;
  }).catch(function(){ caixa.innerHTML=""; var p=document.createElement("p");
    p.textContent="Não consegui carregar o texto agora. Tente de novo em instantes."; caixa.appendChild(p); });
})();
</script>
</body>
</html>
