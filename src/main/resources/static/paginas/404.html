<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Página não encontrada · Grimório</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#130d0f">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icones/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fontes.css">
<script src="/publico/tema.js"></script>
<style>
:root{--bg:#0a0708;--bg2:#130d0f;--line2:#48313a;--fg:#ece4d9;--fg2:#b7a9a2;--gold:#c9a227;--sobre-gold:#140e02;--blood2:#e5455a;
--disp:"Cinzel",Georgia,serif;--body:"Spectral",Georgia,serif;--ui:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(16px,calc(11px + .36vw),18px)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:1rem/1.6 var(--body);padding:1.5rem 1rem;text-align:center}
main{max-width:30rem}
.num{font:800 clamp(4rem,16vw,7rem)/1 var(--disp);color:var(--blood2);letter-spacing:.06em;margin:0}
h1{font:700 clamp(1.4rem,4.5vw,1.9rem)/1.2 var(--disp);margin:.5rem 0 .75rem}
p{color:var(--fg2);margin:0 0 1.5rem}
a.btn{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1.25rem;border:1px solid var(--gold);border-radius:.5rem;color:var(--gold);
  font:600 1rem/1 var(--ui);text-decoration:none}
a.btn:hover{background:var(--gold);color:var(--sobre-gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <h1>Esta página não existe</h1>
  <p>O endereço pode ter mudado, ou o link veio cortado. As suas campanhas continuam onde estavam.</p>
  <a class="btn" href="/">Voltar às campanhas</a>
</main>
</body>
</html>
