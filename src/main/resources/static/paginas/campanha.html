<!-- Lista de campanhas, primeira entrada e aba Campanha (js/pagina-campanha.js) -->

<template id="t-guia-falhou">
  <div class="panel estado-erro">
    <span class="eyebrow">Guia não carregado</span>
    <h1 class="page" tabindex="-1">{{ antigo ? 'Este guia está num formato antigo' : 'Seus dados não vieram' }}</h1>
    <p v-if="antigo" class="lead">Esta versão do Grimório não converte mais guias desse formato. Nada foi alterado: o conteúdo continua salvo no servidor, e nenhuma edição será gravada por cima dele.</p>
    <p v-else class="lead">O app está em modo mestre, mas não conseguiu ler o guia no banco. Nada foi perdido: o conteúdo continua salvo, só não chegou nesta sessão.</p>
    <p v-if="motivo && !antigo" class="sm muted">Motivo: {{ motivo }}</p>
    <div class="addrow"><button type="button" class="btn" id="vwRetry">Tentar de novo</button></div></div>
</template>

<!-- capa: url da imagem, ou vazio para mostrar a inicial -->
<template id="t-capa">
  <div :class="'ccimg' + (capa ? '' : ' sem')"><img v-if="capa" :src="capa" alt="" loading="lazy"><span v-else class="ccini" aria-hidden="true">{{ inicial }}</span></div>
</template>

<!-- campanhas: [{id, nome, sistema, mestre, arquivada, capa (HTML), sessao (linha pronta ou vazio)}]; sem campanhas, a tela de primeira entrada.
     Com campanhas, criar e entrar ficam atras de dois botoes: a lista e o que importa nessa tela. -->
<template id="t-campanhas">
  <p class="eyebrow">Grimório</p>
  <span v-if="campanhas" data-solta><div class="pagehd"><h1 class="page">Suas campanhas</h1>
      <div class="linha"><button type="button" class="btn" id="ncAbreCriar" aria-expanded="false" aria-controls="cxCriar">+ Nova campanha</button><button type="button" class="btn sec" id="ncAbreEntrar" aria-expanded="false" aria-controls="cxEntrar">Entrar com convite</button></div></div>
    <div class="campgrid">
      <button v-for="c in campanhas" type="button" :class="'ccard' + (c.arquivada ? ' arq' : '')" :data-entrar="c.id" :aria-label="'Abrir ' + c.nome + (c.mestre ? ', você mestra' : ', você joga') + (c.arquivada ? ', arquivada' : '') + (c.sessao ? '. ' + c.sessao : '')"><span data-solta v-html="c.capa"></span>
        <span class="ccb"><b>{{ c.nome }}</b><span class="ccsis">{{ c.sistema || 'sem sistema definido' }}</span><span v-if="c.sessao" class="ccses">{{ c.sessao }}</span>
          <span class="ccft"><span :class="'chip' + (c.mestre ? ' g' : '')">{{ c.mestre ? 'você mestra' : 'você joga' }}</span><span v-if="c.arquivada" class="chip">arquivada</span></span></span></button>
    </div></span>
  <span v-else data-solta><h1 class="page">Comece pela sua campanha</h1>
    <p class="lead">Você ainda não participa de nenhuma. Crie a sua, ou entre numa com a chave que quem mestra te passou.</p></span>
  <div class="campforms">
    <section class="caixa" id="cxCriar" aria-labelledby="cxCriarT" v-attr:hidden="campanhas ? true : null"><h2 class="flb" id="cxCriarT">Criar uma campanha</h2>
      <div class="form">
        <label><span class="frotx">Nome da campanha<span class="obrig" aria-hidden="true">*</span></span><input class="inp" id="ncNome" autocomplete="off" aria-required="true" placeholder="A Maldição de Strahd, Mesa de sexta…"></label>
        <label>Sistema de regras<input class="inp" id="ncSis" autocomplete="off" aria-describedby="ncSisD" placeholder="D&amp;D 5e, Call of Cthulhu, Pathfinder…"><span class="dica" id="ncSisD">Opcional. Entra no contexto que a IA recebe.</span></label>
        <div id="ncOrigens"></div>
        <div class="linha" id="ncPacLinha" hidden><button type="button" class="btn sec m" id="ncPac">Escolher pacote (.zip)</button><output class="sm muted" id="ncPacNome">Nenhum pacote escolhido</output></div>
        <div class="linha"><button type="button" class="btn" id="ncGo">Criar campanha</button></div></div></section>
    <section class="caixa" id="cxEntrar" aria-labelledby="cxEntrarT" v-attr:hidden="campanhas ? true : null"><h2 class="flb" id="cxEntrarT">Entrar numa campanha existente</h2>
      <div class="form">
        <label><span class="frotx">Chave ou link do convite<span class="obrig" aria-hidden="true">*</span></span><input class="inp" id="ncChave" autocomplete="off" aria-required="true" aria-describedby="ncChaveD"><span class="dica" id="ncChaveD">Quem mestra gera essa chave em Configurações › Mesa e convites.</span></label>
        <div class="linha"><button type="button" class="btn" id="ncEntrar">Entrar</button></div></div></section>
  </div>
</template>

<!-- Como começar uma campanha nova. modelos: [{id, nome, sistema, descricao, capa (url ou vazio), inicial}],
     cadastrados pela administração; escolhido: "branco", "pacote" ou "m:{id}" -->
<template id="t-origens">
  <fieldset class="origens"><legend class="frotx">Como começar</legend>
    <div class="origgrid">
      <label class="origem"><input type="radio" name="ncOrigem" value="branco" v-attr:checked="escolhido === 'branco' ? true : null">
        <span class="origimg" aria-hidden="true"><span class="ccini">+</span></span>
        <span class="origtx"><b>Em branco</b><span class="origds">Você monta a {{ vmin('campanha') }} do zero, com os primeiros passos guiados.</span></span></label>
      <label v-for="m in modelos" class="origem"><input type="radio" name="ncOrigem" v-attr:value="'m:' + m.id" v-attr:checked="escolhido === 'm:' + m.id ? true : null">
        <span class="origimg" aria-hidden="true"><img v-if="m.capa" :src="m.capa" alt="" loading="lazy"><span v-else class="ccini">{{ m.inicial }}</span></span>
        <span class="origtx"><span class="chip">modelo</span><b>{{ m.nome }}</b><span v-if="m.sistema" class="origsis">{{ m.sistema }}</span><span v-if="m.descricao" class="origds">{{ m.descricao }}</span></span></label>
      <label class="origem"><input type="radio" name="ncOrigem" value="pacote" v-attr:checked="escolhido === 'pacote' ? true : null">
        <span class="origimg" aria-hidden="true"><span class="ccini">.zip</span></span>
        <span class="origtx"><b>De um pacote</b><span class="origds">Um .zip exportado de outra {{ vmin('campanha') }}, com guia, livros, trilha e imagens.</span></span></label>
    </div>
    <p v-if="modelos.length" class="dica">Um modelo entra inteiro e fica todo seu: edite, apague e acrescente à vontade.</p></fieldset>
</template>

<!-- passos: so vem quando ainda falta algum; proxima: {id, numero, titulo, resumo, estado} da proxima sessao;
     secoes: [{i, k, ed, titulo, tipo, texto, itens, lapis, fim}], reordenadas arrastando pelo cabecalho (js/ordenar.js);
     indice: [{nome, linhas:[{cls, t, ref, p}]}].
     Edicao no lugar (js/nolugar.js): cp {ed, lapis, fim} e o nome e a apresentacao; cada secao com ed abre os campos
     onde o texto esta; idx e a copia do indice em edicao ({titulo, livros:[{doc, nome, linhas:[{n, t, p}]}]}) ou null -->
<template id="t-home">
  <div v-attr:data-nlb="cp.ed ? 'cp' : null">
  <div class="pagehd"><div><p class="eyebrow"><input v-if="cp.ed" class="nl curto" data-nl="sistema" v-attr:value="c.sistema || ''" placeholder="Sistema de regras" aria-label="Sistema de regras" autocomplete="off"><span v-else data-solta>{{ c.sistema || 'sistema não definido' }}</span></p><div class="titlinha"><h1 class="page"><input v-if="cp.ed" class="nl" data-nl="titulo" data-nl-foco v-attr:value="c.titulo || ''" placeholder="Nome da campanha" aria-label="Nome da campanha" autocomplete="off"><span v-else data-solta>{{ c.titulo || 'Sem título' }}</span></h1><span data-solta v-html="cp.lapis"></span><span data-solta v-html="guia"></span></div></div></div>
  <p v-if="cp.ed" class="lead sectxt mt-3"><textarea class="nl" data-nl="apresentacao" rows="1" placeholder="Uma ou duas frases: do que se trata" aria-label="Uma ou duas frases: do que se trata">{{ c.apresentacao || '' }}</textarea></p>
  <p v-else-if="c.apresentacao" class="lead sectxt mt-3">{{ c.apresentacao }}</p>
  <span v-if="cp.ed" data-solta v-html="cp.fim"></span></div>
  <section v-if="proxima" class="proxima" aria-labelledby="proxT"><div class="proxtx"><span class="eyebrow">Próxima {{ vmin('sessao') }}</span><h2 id="proxT">{{ proxima.titulo || 'Sem título' }}</h2><p v-if="proxima.resumo" class="lead sm m0">{{ proxima.resumo }}</p><span class="sm muted">{{ Vm('sessao') }} {{ proxima.numero }} · {{ proxima.estado }}</span></div>
    <div class="proxacoes"><button type="button" class="btn" :data-ses="proxima.id">Abrir a {{ vmin('sessao') }}</button><button type="button" class="btn fant m" data-cp="ir-sessoes">Ver todas ({{ nSessoes }})</button></div></section>
  <p v-else-if="nSessoes" class="muted sm mt-4">Todas as {{ vmin('sessoes') }} estão encerradas. <button type="button" class="btn fant m" data-cp="ir-sessoes">Ver todas ({{ nSessoes }})</button></p>
  <div class="seccols" data-ordena="secoes">
    <section v-if="passos" class="sec-wrap" aria-labelledby="passosT"><div class="sechd"><h2 class="sec" id="passosT">Primeiros passos</h2><button type="button" class="tbtn" data-cp="cp-semp">Dispensar</button></div>
      <ol class="passos"><li v-for="(p, i) in passos" :class="'passo' + (p.ok ? ' ok' : '')"><span class="pn" aria-hidden="true">{{ p.ok ? '✓' : i + 1 }}</span><div><b>{{ p.t }}<span v-if="p.ok" class="sr-only"> (feito)</span></b><p>{{ p.d }}</p></div><button type="button" class="btn sec m" :data-cp="p.a">{{ p.b }}</button></li></ol></section>
    <section v-for="s in secoes" :class="'sec-wrap' + (s.ed ? ' nled' : '')" :data-item="s.i" :aria-label="s.titulo || 'Seção sem título'" v-attr:data-nlb="s.ed ? s.k : null"><div class="sechd" data-alca><button type="button" class="alca" title="Arraste para mudar a ordem" :aria-label="'Mover a seção ' + (s.titulo || 'sem título') + ' (arraste, use as setas ou clique para escolher a posição)'"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="1.7" rx=".85"/><rect x="2.5" y="7.15" width="11" height="1.7" rx=".85"/><rect x="2.5" y="10.8" width="11" height="1.7" rx=".85"/></svg></button><h2 class="sec"><input v-if="s.ed" class="nl" data-nl="titulo" data-nl-foco v-attr:value="s.titulo || ''" placeholder="Título da seção" aria-label="Título da seção" autocomplete="off"><span v-else data-solta>{{ s.titulo || 'Sem título' }}</span></h2>
        <span class="blktools" v-html="s.lapis"></span></div>
      <p v-if="s.ed" class="lead sectxt m0"><textarea class="nl" data-nl="texto" rows="1" v-attr:placeholder="s.tipo === 'texto' ? 'Texto' : 'Texto de abertura (opcional)'" v-attr:aria-label="s.tipo === 'texto' ? 'Texto' : 'Texto de abertura (opcional)'">{{ s.texto || '' }}</textarea></p>
      <p v-else-if="s.texto" class="lead sectxt m0">{{ s.texto }}</p>
      <ul v-if="s.ed && s.tipo === 'lista'" class="fl"><li v-for="(x, j) in s.itens"><span class="nlrow"><textarea class="nl" :data-nl="'itens.' + j" data-nl-li rows="1" :aria-label="'Item ' + (j + 1)">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'itens.' + j" :aria-label="'Tirar o item ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul>
      <ul v-else-if="s.tipo === 'lista' && s.itens.length" class="fl"><li v-for="x in s.itens">{{ x }}</li></ul>
      <div v-if="s.ed && s.tipo === 'cartoes'" class="grid met"><div v-for="(m, j) in s.itens" class="c nlit"><h3 class="ctit"><input class="nl" :data-nl="'itens.' + j + '.t'" v-attr:value="m.t || ''" placeholder="Título" :aria-label="'Título do cartão ' + (j + 1)" autocomplete="off"></h3><p class="sectxt"><textarea class="nl" :data-nl="'itens.' + j + '.d'" rows="1" placeholder="Explicação" :aria-label="'Explicação do cartão ' + (j + 1)">{{ m.d || '' }}</textarea></p><button type="button" class="nlx" :data-nl-del="'itens.' + j" data-nl-desfaz :aria-label="'Tirar o cartão ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></div>
      <div v-else-if="s.tipo === 'cartoes' && s.itens.length" class="grid met"><div v-for="m in s.itens" class="c"><h3 class="ctit">{{ m.t }}</h3><p class="sectxt">{{ m.d }}</p></div></div>
      <p v-if="s.vazia && !s.ed" class="muted sm m0">Seção vazia.</p>
      <span v-if="s.ed" data-solta v-html="s.fim"></span></section>
  </div>
  <div class="addrow mt-7"><button type="button" class="addbtn" data-cp="sec-add">+ seção</button></div>
  <section v-if="indice.length || idx" :class="'sec-wrap' + (idx ? ' nled' : '')" aria-labelledby="idxT" v-attr:data-nlb="idx ? 'idx' : null"><div class="sechd"><h2 class="sec" id="idxT"><input v-if="idx" class="nl" data-nl="titulo" v-attr:value="idx.titulo" placeholder="Índice dos livros" aria-label="Índice dos livros (título da seção)" autocomplete="off"><span v-else data-solta>{{ c.indiceTitulo || 'Índice dos livros' }}</span></h2><span class="blktools" v-html="lapisIdx"></span></div>
    <p class="sm muted m0">{{ idx ? 'Enter abre a linha seguinte; Tab e Shift+Tab mudam o nível. O número é a página do PDF.' : 'Clique numa página para abrir o PDF direto nela.' }}</p>
    <div v-if="idx" class="grid idx"><div v-for="(d, di) in idx.livros" class="doc nlit"><h3 class="doctit"><input class="nl" :data-nl="'livros.' + di + '.nome'" v-attr:value="d.nome || ''" placeholder="Nome do livro" aria-label="Nome do livro" autocomplete="off"><input class="nl curto nlsigla" :data-nl="'livros.' + di + '.doc'" list="dlNlDocs" v-attr:value="d.doc || ''" placeholder="Sigla" aria-label="Sigla do livro na Biblioteca" autocomplete="off"></h3>
        <ul><li v-for="(l, li) in d.linhas" :class="['g', 's', 's2'][l.n]"><span class="nlrow"><input class="nl" :data-nl="'livros.' + di + '.linhas.' + li + '.t'" v-attr:value="l.t || ''" placeholder="Entrada" :aria-label="'Entrada ' + (li + 1) + ', nível ' + (l.n + 1)" autocomplete="off"><span class="pg nlpg">P<input class="nl curto" :data-nl="'livros.' + di + '.linhas.' + li + '.p'" v-attr:value="l.p || ''" inputmode="numeric" placeholder="pág." :aria-label="'pág. da entrada ' + (li + 1)" autocomplete="off"></span></span></li></ul>
        <button type="button" class="nlx" :data-nl-del="'livros.' + di" :aria-label="'Tirar o livro ' + (d.nome || di + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
      <datalist id="dlNlDocs"><option v-for="a in docs" v-attr:value="a"></option></datalist></div>
    <div v-else class="grid idx"><div v-for="d in indice" class="doc"><h3 class="doctit">{{ d.nome }}</h3><ul><li v-for="l in d.linhas" :class="l.cls">{{ l.t }}<span v-if="l.p" data-solta> <button type="button" class="pg" :data-open="l.ref + ':' + l.p" :aria-label="'Abrir ' + d.nome + ' na página ' + l.p">P{{ l.p }}</button></span></li></ul></div></div>
    <span v-if="idx" data-solta v-html="fimIdx"></span></section>
</template>
