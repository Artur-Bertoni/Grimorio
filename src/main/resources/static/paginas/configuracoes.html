<!-- Configuracoes (a engrenagem) e as janelas que ela monta dentro da pagina (js/configuracoes.js) -->

<!-- na tela larga o menu fica ao lado (navegacao lateral); no celular, uma linha que rola -->
<template id="t-ajustes">
  <span data-solta v-html="cabeca"></span>
  <div :class="'ajgrade' + (lista ? ' so-lista' : ' com-secao')"><button v-if="!lista" type="button" class="backb ajvolta" id="ajVolta">‹ Todas as configurações</button><div class="ajmenu" v-html="abas"></div><div id="ajBody" class="ajbody" role="region" aria-live="polite" aria-label="Seção de configurações"></div></div>
</template>

<!-- a janela de ajuste montada dentro da pagina, no lugar do overlay -->
<template id="t-em-pagina">
  <h2 class="sec mb-3">{{ titulo }}</h2><span data-solta v-html="corpo"></span>
</template>

<!-- privacidade e acessibilidade: preferencias deste aparelho -->
<template id="t-aj-privacidade">
  <h2 class="sec mb-3">Privacidade e acessibilidade</h2>
  <div class="form">
    <label class="ck"><input type="checkbox" id="pvMetricas" v-attr:checked="metricas">Contar meu uso de forma anônima<span class="dica">O servidor soma quantas vezes cada tela é aberta por dia, sem guardar quem abriu, para quem administra saber o que é usado. Nada sai desta instância.</span></label>
    <label class="ck"><input type="checkbox" id="pvAtalhos" v-attr:checked="atalhos">Atalhos de uma tecla (a tecla / abre a busca)<span class="dica">Desligue se você usa leitor de tela, ditado ou acesso por voz: tecla solta pode disparar sem querer. Ctrl+K continua abrindo a busca.</span></label>
  </div>
  <p class="sm muted mt-4">Estas escolhas valem neste aparelho. Leia a <a class="dourado" href="/privacidade" target="_blank" rel="noopener">política de privacidade</a> e os <a class="dourado" href="/termos" target="_blank" rel="noopener">termos de uso</a> desta instância.</p>
</template>

<!-- administracao: textos de privacidade e de termos -->
<template id="t-aj-textos">
  <h2 class="sec mb-3">Textos legais</h2>
  <p class="lead">Cada instância é de quem a administra. Escreva aqui a política de privacidade e os termos de uso que valem nesta. Vazio volta ao texto padrão do Grimório. Parágrafos são separados por uma linha em branco.</p>
  <div class="form">
    <label>Privacidade<textarea id="txPriv" rows="12" aria-describedby="txPrivD"></textarea><span class="dica" id="txPrivD">Aparece em /privacidade, aberto a qualquer pessoa.</span></label>
    <label>Termos de uso<textarea id="txTerm" rows="12" aria-describedby="txTermD"></textarea><span class="dica" id="txTermD">Aparece em /termos, aberto a qualquer pessoa.</span></label>
    <div class="linha"><button type="button" class="btn" id="txOk">Salvar os textos</button><a class="btn sec m" href="/privacidade" target="_blank" rel="noopener">Ver a página de privacidade</a></div>
  </div>
</template>

<!-- administracao: contagem de uso. eventos: [{nome, total}]; dias: [{dia, total, pc}] -->
<template id="t-aj-uso">
  <h2 class="sec mb-3">Uso</h2>
  <p class="lead">Contagem anônima e somada dos últimos {{ periodo }} dias: quantas vezes cada tela foi aberta e cada ação aconteceu. Ninguém é identificado.</p>
  <p v-if="!eventos.length" class="empty">Nada contado ainda.</p>
  <div v-else class="usograde">
    <section aria-labelledby="usoT1"><h3 class="flb" id="usoT1">Por tela e ação</h3>
      <table class="admtab"><thead><tr><th scope="col">Evento</th><th scope="col" class="num">Total</th></tr></thead>
        <tbody><tr v-for="e in eventos"><td>{{ e.nome }}</td><td class="num">{{ e.total }}</td></tr></tbody></table></section>
    <section aria-labelledby="usoT2"><h3 class="flb" id="usoT2">Por dia</h3>
      <ul class="usodias"><li v-for="d in dias"><span class="usod">{{ d.dia }}</span><span class="usob" aria-hidden="true"><i :style="'width:' + d.pc + '%'"></i></span><span class="num">{{ d.total }}</span></li></ul></section>
  </div>
</template>

<template id="t-aj-sair">
  <div class="fld mt-4"><span class="flb">Sair</span><div class="addrow"><button v-if="sairCampanha" class="btn sec" id="mSaiCamp">Sair desta {{ vmin('campanha') }}</button><button class="btn sec" id="mSair">Sair da conta</button></div></div>
</template>

<!-- temas: HTML da escolha de tema; ia: mostra o nome da IA (mestre, dentro de uma campanha) -->
<template id="t-aj-aparencia">
  <h2 class="sec mb-3">Aparência</h2><span data-solta v-html="temas"></span>
  <div v-if="ia" class="fld mt-4"><span class="flb">Nome da IA</span>
    <div class="addrow centro-v"><select id="iaA" class="selmini" aria-label="Artigo antes do nome (ao, à, a)"><option value="ao">ao</option><option value="à">à</option><option value="a">a</option></select><label class="rotulo cresce">Nome da IA<input id="iaN" class="inp" placeholder="Claude" v-attr:value="iaNome"></label><button class="btn sec" id="iaOk">Salvar</button></div>
    <p class="sm muted">Fica assim no botão da busca: <b id="iaPrev" style="color:var(--gold)"></b>. Vazio volta para Claude.</p></div>
  <div class="fld mt-4"><span class="flb">Atalhos</span><ul class="fl sm">
    <li><span class="kbd">/</span> ou <span class="kbd">Ctrl</span>+<span class="kbd">K</span> abre a busca</li>
    <li><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> salva o formulário aberto</li>
    <li><span class="kbd">Esc</span> fecha a janela de cima</li>
    <li>No visor de PDF e na {{ vmin('cena') }} aberta: setas passam para a próxima</li></ul></div>
</template>

<!-- ---------- mesa e convites ---------- -->

<template id="t-membros">
  <div id="mbList"><p class="muted sm">carregando…</p></div>
  <div class="fld mt-4"><span class="flb">Rolagens dos {{ vmin('jogadores') }}</span>
    <div class="fchips m0"><button class="fchip" data-rol="1">Abertas para a mesa</button><button class="fchip" data-rol="0">Só quem rolou e o {{ vmin('mestre') }}</button></div>
    <p class="sm muted">Vale para os dados que os {{ vmin('jogadores') }} rolam pelo botão Dados. As suas, você escolhe na hora de rolar.</p></div>
  <div class="fld mt-4"><span class="flb">Convidar</span>
    <div class="form cvform"><label>Para quem<input class="inp" id="cvRot" placeholder="opcional"></label><label>Papel<select id="cvPap"><option value="JOGADOR">{{ vmin('jogador') }}</option><option value="MESTRE">{{ vmin('mestre') }}</option></select></label><label>Quantas pessoas<input class="inp" id="cvUsos" type="number" inputmode="numeric" min="1" max="50" value="1"></label><label>Vale por (dias)<input class="inp" id="cvDias" type="number" inputmode="numeric" min="1" max="365" value="30"></label><button type="button" class="btn" id="cvGo">Gerar link</button></div>
    <p class="sm muted">O link leva direto para a campanha. Quem ainda não tem conta cria uma na hora.</p></div>
  <div id="cvList" class="mt-3"></div>
</template>

<template id="t-membros-lista">
  <div v-for="m in membros" class="npcrow entre"><div><b>{{ m.nome }}</b> <span class="muted sm">{{ m.login }} · {{ m.papel === 'MESTRE' ? 'mestre' : 'jogador' }}{{ m.dono ? ' · dono' : '' }}</span></div>
    <div v-if="!m.dono" class="linha"><button class="tbtn" :data-pap="m.usuarioId" :data-v="m.papel === 'MESTRE' ? 'JOGADOR' : 'MESTRE'">{{ m.papel === 'MESTRE' ? 'Tornar ' + vmin('jogador') : 'Tornar ' + vmin('mestre') }}</button><button class="tbtn d" :data-rm="m.usuarioId">Tirar</button></div></div>
  <p v-if="!membros.length" class="empty">Só você por enquanto.</p>
</template>

<!-- convites: [{id, rotulo, papel, usos, usosMax, valido, url}] -->
<template id="t-convites-lista">
  <span v-if="convites.length" data-solta><span class="flb">Links ativos</span>
    <div v-for="c in convites" class="npcrow entre"><div class="minw0"><b>{{ c.rotulo || 'convite' }}</b> <span class="muted sm">{{ c.papel === 'MESTRE' ? 'mestre' : 'jogador' }} · {{ c.usos }}/{{ c.usosMax }}{{ c.valido ? '' : ' · expirado' }}</span>
      <p class="sm muted quebra">{{ c.url }}</p></div>
      <div class="linha"><button class="tbtn" :data-cp="c.url">Copiar</button><button class="tbtn d" :data-cvdel="c.id">Apagar</button></div></div></span>
</template>

<!-- ---------- configuracoes da campanha ---------- -->

<!-- capa: HTML da capa; estilos: [{nome, temas:[{k, nome}]}] -->
<template id="t-campanha-config">
  <div class="fld"><span class="flb">Identificação</span>
    <div class="campos2"><label class="rotulo cresce">Nome<input class="inp" id="caNome" v-attr:value="nome" autocomplete="off"></label><label class="rotulo cresce">Sistema de regras<input class="inp" id="caSis" v-attr:value="sistema" autocomplete="off" aria-describedby="caSisD"></label></div>
    <p class="sm muted" id="caSisD">O sistema entra no contexto que a IA recebe. Tudo nesta página grava sozinho ao sair do campo.</p></div>
  <div class="fld"><span class="flb">Capa</span>
    <div class="capapick"><span id="caCapa" v-html="capa"></span><div class="addrow"><button class="btn sec" id="caCapaEsc">Escolher imagem</button><button class="btn sec" id="caCapaTira" v-attr:hidden="!temCapa">Tirar a capa</button></div></div>
    <p class="sm muted">Aparece no cartão da {{ vmin('campanha') }} na lista de {{ vmin('campanhas') }}, para você e para os {{ vmin('jogadores') }}. Formato largo (16:9) fica melhor.</p></div>
  <div class="fld"><span class="flb">Tema sugerido</span>
    <label class="rotulo"><span class="sr-only">Tema sugerido</span><select id="caTema" class="inp campo-medio"><option value="">sem sugestão</option><optgroup v-for="e in estilos" :label="e.nome"><option v-for="t in e.temas" v-attr:value="t.k" v-attr:selected="t.k === tema">{{ t.nome }}</option></optgroup></select></label>
    <p class="sm muted">Quem entra na {{ vmin('campanha') }} pela primeira vez vê a sugestão e escolhe se usa. Na lista de temas ela aparece marcada como sugerida.</p></div>
  <div class="fld"><span class="flb">Pacote da campanha</span>
    <div class="addrow"><a class="btn sec" id="caExp" href="#">Exportar pacote</a><button class="btn sec" id="caImp">Importar pacote</button><label class="sm muted" style="display:flex;align-items:center;gap:.375rem"><input type="checkbox" id="caSub"> substituir guia e mesa</label></div>
    <p class="sm muted">O pacote leva a campanha inteira: guia, mesa, fichas, livros em PDF, trilha, imagens e índices de busca. Importado em outra conta, abre igual, sem enviar nada de novo. Sem marcar a caixa, a importação só traz os arquivos e as fichas.</p></div>
  <div class="fld"><span class="flb">Zona de risco</span>
    <div class="addrow"><button class="btn dang" id="caDel">Apagar esta campanha</button></div>
    <p class="sm muted">Apaga guia, mesa, recados, anotações e toda a mídia. Não dá para desfazer.</p></div>
</template>

<!-- ---------- vocabulario e consulta rapida ---------- -->

<!-- termos: [{k, padrao, valor}] -->
<template id="t-vocabulario">
  <p class="lead">Troque os nomes para o vocabulário do seu sistema. Vazio volta ao padrão.</p>
  <div class="grid met"><div v-for="t in termos" class="c"><b class="sm muted">{{ t.padrao }}</b><input class="inp" :data-voc="t.k" :aria-label="t.padrao" v-attr:placeholder="t.padrao" v-attr:value="t.valor"></div></div>
  <div class="addrow mt-4"><button class="btn" id="vcGo">Salvar</button></div>
</template>

<template id="t-referencia">
  <p class="lead">O resumo de regras que fica na aba {{ Vm('mesa') }}, visível para os jogadores. Nada aqui vem pronto: é a sua mesa que escreve.</p>
  <div id="rfBody" v-html="corpo"></div>
</template>

<template id="t-referencia-grupos">
  <div v-for="(g, i) in grupos" class="fld"><span class="flb">Grupo {{ i + 1 }}</span>
    <div class="addrow"><label class="rotulo cresce">Título do grupo<input class="inp" :data-rt="i" v-attr:value="g.t || ''"></label><button class="tbtn d" :data-rdel="i">Remover</button></div>
    <label class="rotulo cresce">Itens (um por linha)<textarea class="inp" :data-ri="i" rows="5" style="width:100%;margin-top:.375rem">{{ (g.itens || []).join('\n') }}</textarea></label></div>
  <div class="addrow"><button class="btn sec" id="rfAdd">Adicionar grupo</button><button class="btn" id="rfGo">Salvar</button></div>
</template>

<!-- ---------- administracao da instancia ---------- -->

<template id="t-admin">
  <div class="fld"><span class="flb">Chave da IA</span>
    <div class="addrow"><label class="rotulo cresce">Chave da API da Anthropic<input class="inp" id="iaK" type="password" placeholder="sk-ant-..." autocomplete="off"></label><label class="rotulo cresce">Modelo<input class="inp" id="iaM" placeholder="claude-sonnet-4-5"></label><button class="btn" id="iaKs">Salvar</button></div>
    <p class="sm muted" id="iaKst">…</p></div>
  <div class="fld"><span class="flb">Armazenamento</span><div id="adArm" class="sm"><p class="muted sm">carregando…</p></div>
    <div class="addrow mt-2"><button class="btn sec" id="adJunta">Juntar arquivos iguais agora</button></div>
    <p class="sm muted">O servidor já faz isso sozinho a cada inicialização. Use depois de subir arquivos direto no volume.</p></div>
  <div class="fld"><span class="flb">Sistema</span><div id="adSis" class="sm"><p class="muted sm">carregando…</p></div></div>
  <div class="fld"><span class="flb">E-mail do suporte</span>
    <div class="addrow"><label class="rotulo cresce">E-mail que recebe o suporte<input class="inp" id="smD" type="email"></label></div>
    <div class="addrow"><select id="smV" class="selmini"><option value="smtp">SMTP (Gmail, Outlook…)</option><option value="resend">Resend (HTTPS, grátis)</option><option value="brevo">Brevo (HTTPS, grátis)</option></select></div>
    <div class="addrow" id="smKey" hidden><label class="rotulo cresce">Chave de API do provedor<input class="inp" id="smK" type="password" autocomplete="new-password"></label></div>
    <div id="smSmtp"><div class="addrow"><label class="rotulo cresce">Servidor SMTP<input class="inp" id="smH" placeholder="ex.: smtp.gmail.com"></label><label class="rotulo cresce">Porta<input class="inp" id="smP" type="number" style="max-width:6.5rem"></label></div>
      <div class="addrow"><label class="rotulo cresce">Usuário do SMTP<input class="inp" id="smU" autocomplete="off"></label><label class="rotulo cresce">Senha do SMTP<input class="inp" id="smS" type="password" autocomplete="new-password"></label></div></div>
    <div class="addrow"><label class="rotulo cresce">Remetente<input class="inp" id="smR"></label></div>
    <div class="addrow"><button class="btn" id="smOk">Salvar</button><button class="btn sec" id="smT">Enviar e-mail de teste</button></div>
    <p class="sm muted" id="smDica"></p><p class="sm muted" id="smSt">…</p></div>
  <div class="fld"><span class="flb">Mensagens de suporte</span><div id="adSup" class="suplist"><p class="muted sm">carregando…</p></div></div>
  <div class="fld"><span class="flb">Cadastro</span>
    <label class="sm" style="display:flex;align-items:center;gap:.5rem"><input type="checkbox" id="adReg"> Habilitar a criação de contas.</label>
    <p class="sm muted">Desligado, só entra quem receber um link de convite.</p></div>
  <div class="fld"><span class="flb">Mapa (tabletop)</span>
    <label class="sm" style="display:flex;align-items:center;gap:.5rem"><input type="checkbox" id="adMapa"> Liberar a aba Mapa para todos.</label>
    <p class="sm muted">Desligado (o padrão enquanto o tabletop está em obra), só a administração abre o mapa; os outros veem o aviso "em construção". Quem já está com a página aberta precisa recarregar.</p></div>
  <div class="fld"><span class="flb">Contas</span><div id="adUs"><p class="muted sm">carregando…</p></div>
    <div class="addrow mt-2"><label class="rotulo cresce">Login<input class="inp" id="auL"></label><label class="rotulo cresce">Nome<input class="inp" id="auN"></label><label class="rotulo cresce">Senha<input class="inp" id="auS" type="password"></label><button class="btn sec" id="auGo">Criar</button></div></div>
  <div class="fld"><span class="flb">Campanhas na instância</span><div id="adCa"></div></div>
  <div class="fld"><span class="flb">Modelos de campanha</span>
    <p class="sm muted">Aparecem em “Como começar” para qualquer pessoa que criar uma {{ vmin('campanha') }} nesta instância. A {{ vmin('campanha') }} nova recebe uma cópia inteira do modelo, com livros, trilha e imagens.</p>
    <div id="adMod"><p class="muted sm">carregando…</p></div>
    <div class="addrow mt-2"><button type="button" class="btn sec" id="adModEnv">Enviar pacotes (.zip)</button><span class="sm muted">Dá para escolher vários de uma vez.</span></div>
    <div class="addrow"><label class="rotulo cresce">Ou salve como modelo uma {{ vmin('campanha') }} que você mestra<select class="inp" id="adModCa" v-attr:disabled="minhas.length ? null : true"><option v-for="c in minhas" v-attr:value="String(c.id)">{{ c.nome }}</option></select></label><button type="button" class="btn sec" id="adModSal" v-attr:disabled="minhas.length ? null : true">Salvar como modelo</button></div>
    <p class="sm muted">O modelo guarda a {{ vmin('campanha') }} como ela está agora; mudanças depois não chegam a ele.</p></div>
</template>

<!-- modelos: [{id, nome, sistema, descricao, tamanho, capa (url ou vazio)}] -->
<template id="t-admin-modelos">
  <div v-for="m in modelos" class="npcrow entre modrow"><span class="modcapa" aria-hidden="true"><img v-if="m.capa" :src="m.capa" alt=""></span><div class="cresce"><b>{{ m.nome }}</b> <span class="muted sm">{{ m.sistema || 'sem sistema' }} · {{ mb(m.tamanho) }}</span><p v-if="m.descricao" class="sm muted m0">{{ m.descricao }}</p></div>
    <div class="linha"><button type="button" class="tbtn" :data-modcapa="m.id" :aria-label="'Trocar a capa de ' + m.nome">Capa</button><button v-if="m.capa" type="button" class="tbtn" :data-modsemcapa="m.id" :aria-label="'Tirar a capa de ' + m.nome">Tirar capa</button><button type="button" class="tbtn ico" :data-moded="m.id" :title="'Editar ' + m.nome" :aria-label="'Editar ' + m.nome"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.6a1.6 1.6 0 0 1 2.3 0l.1.1a1.6 1.6 0 0 1 0 2.3L5.8 12.6 2.6 13.4l.8-3.2Z"/><path d="M9.7 3.9l2.4 2.4"/></svg></button>
      <button type="button" class="tbtn d" :data-modrm="m.id">Apagar</button></div></div>
  <p v-if="!modelos.length" class="empty">Nenhum modelo ainda. Envie um pacote ou salve uma {{ vmin('campanha') }} sua.</p>
</template>

<!-- a: o bloco armazenamento de /api/admin/sistema -->
<template id="t-admin-armazenamento">
  <ul class="fl"><li v-if="a.total > 0">Livre no volume: <b>{{ mb(a.livre) }}</b> de {{ mb(a.total) }}</li>
    <li>Arquivos de mídia ocupam <b>{{ mb(a.usado || 0) }}</b>.</li>
    <li v-if="a.links">Arquivos iguais são compartilhados: <b>{{ a.compartilhados || 0 }}</b> cópias evitadas, economizando <b>{{ mb(a.economizado || 0) }}</b>.</li>
    <li v-else><span class="perigo-tx">Este volume não aceita compartilhar arquivos iguais</span>: cada arquivo repetido ocupa espaço próprio.</li></ul>
  <span v-if="(a.porCampanha || []).length" data-solta><table class="admtab"><thead><tr><th>{{ Vm('campanha') }}</th><th>Arquivos</th><th>Referencia</th><th>Compartilhados</th></tr></thead>
    <tbody><tr v-for="c in a.porCampanha"><td>{{ c.nome }}</td><td>{{ c.arquivos }}</td><td>{{ mb(c.bytes) }}</td><td>{{ c.compartilhados }}</td></tr></tbody></table>
    <p class="sm muted">"Referencia" é o tamanho de tudo que a {{ vmin('campanha') }} usa, contando arquivos compartilhados com outras.</p></span>
</template>

<!-- s: o bloco sistema; noAr: ha quanto tempo, ja escrito -->
<template id="t-admin-sistema">
  <ul class="fl"><li>Banco: <b>{{ s.banco || '?' }}</b></li>
    <li>Pasta de mídia: <code>{{ s.midiaDir || '?' }}</code></li>
    <li>Java {{ s.java || '?' }} · memória {{ mb(s.memoriaUsada || 0) }} de {{ mb(s.memoriaMax || 0) }}</li>
    <li>No ar há {{ noAr }}</li>
    <li>{{ s.contas || 0 }} conta(s), {{ s.campanhas || 0 }} {{ vmin('campanhas') }}</li>
    <li v-if="s.suporteNaoEnviado" class="perigo-tx">{{ s.suporteNaoEnviado }} mensagem(ns) de suporte não saíram por e-mail (veja abaixo)</li></ul>
</template>

<template id="t-admin-suporte">
  <article v-for="x in mensagens" class="supit"><header><b>{{ x.assunto }}</b><span class="muted sm">{{ x.autor }} · {{ quando2(x.em) }}</span><span :class="'chip' + (x.enviado ? ' ok' : '')">{{ x.enviado ? 'enviado' : 'só registrado' }}</span></header>
    <p v-if="x.contato" class="sm">Responder para: {{ x.contato }}</p>
    <p>{{ x.mensagem }}</p><p v-if="x.contexto" class="sm muted">{{ x.contexto }}</p>
    <p v-if="x.erro" class="sm perigo-tx">{{ x.erro }}</p></article>
  <p v-if="!mensagens.length" class="empty">Nenhuma mensagem ainda.</p>
</template>

<template id="t-admin-usuarios">
  <div v-for="u in usuarios" class="npcrow entre"><div><b>{{ u.nome }}</b> <span class="muted sm">{{ u.login }} · {{ u.campanhas }} campanha(s){{ u.admin ? ' · admin' : '' }}{{ u.ativo ? '' : ' · desativado' }}</span></div>
    <div class="linha"><button class="tbtn" :data-pw="u.id">Senha</button><button class="tbtn" :data-ad="u.id" :data-v="String(!u.admin)">{{ u.admin ? 'tirar admin' : 'tornar admin' }}</button><button v-if="!u.admin" class="tbtn d" :data-ur="u.id">Remover</button></div></div>
  <p v-if="!usuarios.length" class="empty">Nenhuma conta.</p>
</template>

<template id="t-admin-campanhas">
  <div v-for="c in campanhas" class="npcrow entre"><div><b>{{ c.nome }}</b> <span class="muted sm">{{ c.sistema || 'sem sistema' }} · {{ c.membros }} membro(s)</span></div></div>
  <p v-if="!campanhas.length" class="empty">Nenhuma campanha.</p>
</template>

<!-- ---------- aparencia: temas, movimento e sons ---------- -->

<!-- t: o tema; e: o estilo dele; sugerido: e o tema que o mestre sugeriu -->
<template id="t-tema-card">
  <button class="temacard" :data-tema="k" :aria-pressed="String(ativo)" :style="'--p-bg:' + t.v.bg + ';--p-fg:' + t.v.fg + ';--p-fg2:' + t.v.fg2 + ';--p-line:' + t.v.line2 + ';--p-blood:' + t.v.blood + ';--p-gold:' + t.v.gold"><b :style="'font-family:' + e.disp">{{ t.nome }}</b><span class="tex" :style="'font-family:' + (e.body || CORPO)">A porta range e a sala fica em silêncio.</span><span class="tsw"><i :style="'background:' + t.v.blood"></i><i :style="'background:' + t.v.blood2"></i><i :style="'background:' + t.v.gold"></i><i :style="'background:' + t.v.fg2"></i></span><span v-if="sugerido || escolhido || seu" class="tetqs"><span v-if="escolhido" class="tesc">escolhido</span><span v-if="sugerido" class="tsug">sugerido</span><span v-if="seu" class="tseu">seu tema</span></span></button>
</template>

<!-- estilos: [{nome, cartoes (HTML)}], so os que tem tema; dentro: ha campanha aberta;
     escolhido: tema que a pessoa definiu para ela; previa: ha um tema em experiencia; mesa: ha tema sugerido -->
<template id="t-temas">
  <div id="temaSec"><div class="fld"><span class="flb">Tema</span>
    <p v-if="dentro" class="sm muted m0 mb-2">Clique num tema para ver como fica e, se gostar, defina como seu nesta {{ vmin('campanha') }}. Ele passa na frente do tema sugerido pelo {{ vmin('mestre') }}.</p>
    <p v-else class="sm muted m0 mb-2">Este é o seu tema: vale na lista de {{ vmin('campanhas') }}, nas configurações e em toda tela fora de uma {{ vmin('campanha') }}.</p>
    <div class="temas"><div v-for="e in estilos"><span class="temagen">{{ e.nome }}</span><div class="temalist" v-html="e.cartoes"></div></div></div>
    <div v-if="dentro" class="addrow mt-4"><button type="button" class="btn sec" id="temaCamp">Definir como meu tema para esta {{ vmin('campanha') }}</button>
      <button v-if="escolhido || previa" type="button" class="btn fant" id="temaLimpa">{{ mesa ? 'Voltar ao tema da mesa' : 'Voltar ao meu tema' }}</button></div>
    <p class="sm muted">A escolha vale só para você, neste aparelho.</p></div>
  <div class="fld mt-4"><span class="flb">Tema das {{ vmin('campanhas') }}</span>
    <div class="fchips m0"><button type="button" class="fchip" data-segue="1" :aria-pressed="String(segue)">Seguir o tema de cada mesa</button><button type="button" class="fchip" data-segue="0" :aria-pressed="String(!segue)">Usar sempre o meu tema</button></div>
    <p class="sm muted">Seguindo, a {{ vmin('campanha') }} abre no tema que o {{ vmin('mestre') }} sugeriu e, ao sair dela, volta o seu. Numa {{ vmin('campanha') }} em que você definiu um tema, vale sempre o que você escolheu.</p></div>
  <div class="fld mt-4"><span class="flb">Movimento</span>
    <div class="fchips m0"><button class="fchip" data-mov="1" :aria-pressed="String(fx)">Com animações</button><button class="fchip" data-mov="0" :aria-pressed="String(!fx)">Sem animações</button></div>
    <p class="sm muted">Desliga as transições e o fundo animado neste aparelho. Bom para máquina fraca ou para quem se incomoda com movimento.</p></div>
  <div class="fld mt-4"><span class="flb">Sons</span>
    <div class="fchips m0"><button class="fchip" data-som="0" :aria-pressed="String(!som)">Desligados</button><button class="fchip" data-som="1" :aria-pressed="String(som)">Ligados</button></div>
    <div class="volrow mt-2"><span>Volume</span><input type="range" id="somVol" min="0" max="100" v-attr:value="volume" aria-label="Volume dos sons"></div>
    <p class="sm muted">Dado rolando, página virando, janela abrindo, revelação. O timbre muda com o estilo do tema. Vale só neste aparelho e não mexe na trilha.</p></div></div>
</template>
