server:
  port: ${PORT:8080}
  # atras do proxy do Railway: o endereco que vai nos links (redefinir senha, previa do convite)
  # precisa ser o https publico, nao o http interno
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css,text/plain,application/manifest+json,image/svg+xml
    min-response-size: 2048
  servlet:
    session:
      timeout: 30d
      cookie:
        name: GRIMORIO
        same-site: lax
        http-only: true
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 10MB

spring:
  web:
    error:
      whitelabel:
        enabled: false
  application:
    name: grimorio
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          "[batch_size]": 20
  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB # NOSONAR: livros e trilhas grandes sobem pelo app, de proposito
      max-request-size: 2100MB # NOSONAR: idem, so membros logados chegam aqui
      file-size-threshold: 2MB
  mvc:
    problemdetails:
      enabled: false
    # o pacote sai em fluxo, com PDFs e trilha: o padrao de 30s do Tomcat cortaria o download
    async:
      request-timeout: 60m

grimorio:
  midia-dir: ${MIDIA_DIR:./dados/midia}
  suporte-email: ${SUPORTE_EMAIL:artur_b_santos@hotmail.com}

logging:
  level:
    root: INFO
    "[br.com.grimorio]": INFO
    "[org.hibernate.SQL]": WARN
