<!-- Aba Mesa, a area dos jogadores (js/pagina-mesa.js) -->

<!-- cabeca: o titulo da pagina (Mesa para o mestre, a secao para o jogador); ini: barra publica
     da iniciativa; abas: sub-abas (so o mestre, o jogador usa as abas do topo); corpo: a secao aberta -->
<template id="t-mesa">
  <div class="mesahd"><div><span class="eyebrow">Área dos {{ vmin('jogadores') }}</span><div class="titlinha"><h1 class="page">{{ cabeca }}</h1><span data-solta v-html="guia"></span></div></div></div>
  <div v-if="mestre" class="gmstrip"><b>Visão do {{ vmin('mestre') }}.</b> Isto é exatamente o que os {{ vmin('jogadores') }} veem. Use <button type="button" class="btn sec m" id="mLib">Liberar conteúdo</button> para escolher o que aparece aqui.</div>
  <div id="mIni" v-html="ini"></div>
  <span data-solta v-html="abas"></span>
  <div id="mbody" class="mesabody" v-html="corpo"></div>
</template>

<!-- resumos: [{i, k, ed, n, titulo, data, texto, tem, linhas, lapis, fim}] na ordem de exibicao; aberto: o indice do que nasce aberto.
     ed: o resumo esta aberto no lugar (js/nolugar.js): numero, titulo, data e texto viram campos onde estao -->
<template id="t-mesa-resumos">
  <div v-if="mestre" class="addrow mb-3"><button type="button" class="btn sec" id="mAddRes">+ resumo de {{ vmin('sessao') }}</button></div>
  <div v-if="resumos.length" class="reslist">
    <details v-for="r in resumos" class="resitem" :data-res="r.i" v-attr:open="aberto === r.i || r.ed" v-attr:data-nlb="r.ed ? r.k : null"><summary><span class="rnum">{{ Vm('sessao') }} <input v-if="r.ed" class="nl curto" data-nl="n" data-nlt="num" v-attr:value="r.n" inputmode="numeric" :aria-label="'Número da ' + vmin('sessao')" autocomplete="off"><span v-else data-solta>{{ r.n || '?' }}</span></span><b><input v-if="r.ed" class="nl" data-nl="titulo" data-nl-foco v-attr:value="r.titulo || ''" placeholder="Título" aria-label="Título" autocomplete="off"><span v-else data-solta>{{ r.titulo || 'Sem título' }}</span></b><span v-if="r.ed" class="rsdata"><input class="nl curto" data-nl="data" v-attr:value="r.data || ''" placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" aria-label="Data, dd/mm/aaaa" autocomplete="off"></span><span v-else-if="r.data" class="rsdata">{{ r.data }}</span></summary>
      <div class="resbody"><div class="restxt"><textarea v-if="r.ed" class="nl" data-nl="texto" rows="2" placeholder="O que aconteceu" aria-label="O que aconteceu">{{ r.texto || '' }}</textarea><span v-else-if="r.tem" data-solta><span v-for="(l, k) in r.linhas" data-solta><br v-if="k">{{ l }}</span></span><span v-else class="muted">Sem texto.</span></div>
        <span v-if="r.ed" data-solta v-html="r.fim"></span>
        <div v-else-if="mestre" class="resacts"><span data-solta v-html="r.lapis"></span><button type="button" class="tbtn d" :data-mresd="r.i">Remover</button></div></div></details>
  </div>
  <p v-else class="empty">Nenhum resumo publicado ainda.</p>
</template>

<template id="t-mesa-ev">
  <div v-if="ev.length" class="evgrid">
    <figure v-for="(x, i) in ev" class="evcard"><button v-if="x.img" type="button" class="evimg" :data-mev="i" :aria-label="'Ver em tela cheia: ' + x.nome"><img :src="IMG(x.img, 'mini')" alt="" loading="lazy"></button><div v-else class="evno">sem imagem</div>
      <figcaption><b>{{ x.nome }}</b><p v-if="x.texto">{{ x.texto }}</p></figcaption></figure>
  </div>
  <p v-else class="empty">Nada encontrado ainda. O que vocês acharem na {{ vmin('mesa') }} aparece aqui.</p>
</template>

<template id="t-mesa-quem">
  <h2 class="sec">Pessoas</h2>
  <div v-if="npcs.length" class="qgrid"><div v-for="x in npcs" class="qcard"><img v-if="x.img" :src="IMG(x.img, 'mini')" :alt="'Retrato de ' + x.nome" loading="lazy"><div><b>{{ x.nome }}</b><p>{{ x.desc || '' }}</p></div></div></div>
  <p v-else class="empty">Ninguém conhecido ainda.</p>
  <h2 class="sec mt-6">Lugares</h2>
  <div v-if="locais.length" class="cadgrid">
    <article v-for="(x, i) in locais" class="cad mloc"><button v-if="x.img" type="button" class="ci" :data-mloc="i" :aria-label="'Ver em tela cheia: ' + x.nome"><img :src="IMG(x.img, 'mini')" alt="" loading="lazy"></button><div v-else class="ci">sem imagem</div>
      <div class="cb"><b>{{ x.nome }}</b><p v-if="x.desc">{{ x.desc }}</p></div></article>
  </div>
  <p v-else class="empty">Nenhum lugar registrado ainda.</p>
</template>

<!-- grupos: [{t, itens}]; ed: o mestre esta editando no lugar (js/nolugar.js), e os grupos sao os do guia;
     lapis e fim: o lapis e o rodape, ja preenchidos -->
<template id="t-mesa-regras">
  <div v-attr:data-nlb="ed ? 'ref' : null">
  <p v-if="grupos.length || mestre" class="lead">Resumo das mecânicas para não travar a {{ vmin('mesa') }}. Em caso de dúvida, o livro manda.<span v-if="mestre" data-solta> <span data-solta v-html="lapis"></span></span></p>
  <p v-if="!grupos.length && !ed" class="empty">Nada aqui ainda.<span v-if="mestre" data-solta> Use o lápis para escrever o resumo de regras da sua {{ vmin('mesa') }}.</span></p>
  <div v-if="ed" class="reggrid"><section v-for="(g, i) in grupos" class="regblk nlit"><h2 class="regtit"><input class="nl" :data-nl="'referencia.' + i + '.t'" v-attr:value="g.t || ''" placeholder="Título do grupo" :aria-label="'Título do grupo ' + (i + 1)" autocomplete="off"></h2>
      <ul class="fl"><li v-for="(x, j) in g.itens"><span class="nlrow"><textarea class="nl" :data-nl="'referencia.' + i + '.itens.' + j" data-nl-li rows="1" :aria-label="'Item ' + (j + 1)">{{ x }}</textarea><button type="button" class="nlx" :data-nl-del="'referencia.' + i + '.itens.' + j" :aria-label="'Tirar o item ' + (j + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span></li></ul>
      <button type="button" class="nladd" :data-nl-add="'referencia.' + i + '.itens'">+ item</button>
      <button type="button" class="nlx" :data-nl-del="'referencia.' + i" data-nl-desfaz :aria-label="'Tirar o grupo ' + (g.t || i + 1)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></section></div>
  <div v-else-if="grupos.length" class="reggrid"><section v-for="g in grupos" class="regblk"><h2 class="regtit">{{ g.t }}</h2><ul class="fl"><li v-for="x in (g.itens || [])">{{ x }}</li></ul></section></div>
  <span v-if="ed" data-solta v-html="fim"></span></div>
</template>

<template id="t-mesa-notas">
  <p class="lead" id="mNotasDica">Só você vê isto. Fica guardado na sua conta, nem o {{ vmin('mestre') }} consegue ler.</p>
  <label class="sr-only" for="mNotas">Minhas anotações</label>
  <textarea id="mNotas" class="nota" aria-describedby="mNotasDica" placeholder="Teorias, nomes, números de telefone, o que for…"></textarea>
  <div class="notaft"><button type="button" class="btn" id="mNotaSave">Salvar</button><output class="muted sm" id="mNotaSt"></output><span class="esp"></span><button type="button" class="tbtn" id="mNotaTam" title="Arraste o canto da caixa para mudar o tamanho">Tamanho padrão</button></div>
</template>

<template id="t-mesa-mural">
  <p class="lead" id="mPostDica">Visível para todo mundo da {{ vmin('mesa') }}, inclusive o {{ vmin('mestre') }}.</p>
  <div class="composer"><label class="sr-only" for="mPost">Novo recado no mural</label><textarea id="mPost" aria-describedby="mPostDica" placeholder="Uma teoria, uma pergunta, um lembrete…"></textarea><button type="button" class="btn" id="mPostGo">Publicar</button></div>
  <div id="mural" class="mural" aria-live="polite"><p class="empty">Carregando…</p></div>
</template>

<!-- posts: [{id, autor, quando, meu, linhas}] -->
<template id="t-mural-posts">
  <article v-for="p in posts" class="post"><header><b>{{ p.autor }}</b><span class="muted sm">{{ p.quando }}</span><button v-if="p.meu" type="button" class="tbtn d" :data-mdel="p.id">Apagar</button></header>
    <p><span v-for="(l, k) in p.linhas" data-solta><br v-if="k">{{ l }}</span></p></article>
  <p v-if="!posts.length" class="empty">Nenhum recado ainda. Começa você.</p>
</template>

<!-- grupos: [{tipo, nome, itens:[{id, nome, on, daSessao}]}] -->
<template id="t-liberar">
  <p class="lead">Marque o que os {{ vmin('jogadores') }} podem ver. Nada é liberado sozinho: só aparece na {{ vmin('mesa') }} o que você marcar.</p>
  <div v-for="g in grupos" class="fld mt-4"><h3 class="flb">{{ g.nome }}</h3>
    <div class="libgrid"><button v-for="x in g.itens" type="button" :class="'libit' + (x.on ? ' on' : '')" :data-lib="g.tipo" :data-id="x.id" :aria-pressed="String(!!x.on)"><span class="libck" aria-hidden="true">{{ x.on ? '✓' : '' }}</span><span class="cresce">{{ x.nome }}</span><span v-if="x.daSessao" class="mini">nesta {{ vmin('sessao') }}</span></button></div></div>
  <p v-if="!grupos.length" class="empty">Ainda não há nada no Elenco para liberar. Cadastre lá os {{ vmin('npcs') }}, {{ vmin('locais') }} e {{ vmin('evidencias') }}.</p>
</template>

<template id="t-lib-botao"><button type="button" class="btn sec libbtn" :id="id"></button></template>
